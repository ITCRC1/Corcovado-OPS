<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Corcovado Wilderness Lodge — Sistema de Operación</title>
<!-- Sin esta línea el celular dibuja la página a 980px y la encoge: todo queda diminuto.
     Se permite agrandar con los dedos (no se bloquea el zoom) por accesibilidad. -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!-- Para que se instale y se vea como una app en el teléfono -->
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#2C4A3E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CWL Operación">
<link rel="apple-touch-icon" href="/assets/icono-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icono-192.png">
<!-- El servidor reemplaza esta marca por la versión con la que entrega la página, así
     la pantalla sabe cuál está corriendo y puede avisar si quedó una copia vieja. -->
<!--VERSION-->
<style>
  /* Tipografías del lodge: las mismas que recibe el huésped en su itinerario.
     Playfair para títulos, Archivo Narrow para datos (es condensada, así caben
     más columnas en las tablas sin reducir el tamaño de letra). */
  @font-face { font-family:'Display'; src:url('/assets/fonts/Playfair-Bold.ttf'); font-weight:700; font-display:swap; }
  @font-face { font-family:'Display'; src:url('/assets/fonts/Playfair-Regular.ttf'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Datos'; src:url('/assets/fonts/ArchivoNarrow-Regular.ttf'); font-weight:400; font-display:swap; }
  @font-face { font-family:'Datos'; src:url('/assets/fonts/ArchivoNarrow-SemiBold.ttf'); font-weight:600; font-display:swap; }

  :root {
    --forest: #2C4A3E; --forest-dark: #1D332A; --sand: #F5F1E8; --card: #FFFFFF;
    /* Escala de texto: un solo sistema en vez de tamaños sueltos */
    --t-xs: 11px; --t-sm: 12.5px; --t-md: 14px; --t-lg: 16px; --t-xl: 19px; --t-xxl: 25px;
    /* Radios: tres valores para todo el sistema */
    --r-sm: 6px; --r-md: 10px; --r-pill: 999px;
    /* Escala general, ajustable por el usuario */
    --escala: 1;
    --border: #E3DFD3; --text: #24291F; --muted: #6E6A5C;
    --warn-bg: #FFF4E5; --warn-text: #92400E;
    --danger-bg: #FDECEC; --danger-text: #B91C1C;
    --ok-bg: #E7F1EA; --ok-text: #1F6B45;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--sand); color: var(--text);
    font-family: 'Datos', -apple-system, "Segoe UI", Arial, sans-serif;
    font-size: calc(var(--t-sm) * var(--escala)); }
  input, select, textarea, button { font-family: inherit; }
  h1, h2, h3, h4, .title, .stat-value, .titulo-display {
    font-family: 'Display', Georgia, serif; font-weight: 700; }
  .container { max-width: 980px; margin: 0 auto; padding: 20px 16px 40px; }
  .topbar { display:flex; align-items:center; justify-content:space-between;
    background: var(--forest); padding: 12px 24px; position:relative; }
  /* Franja fotográfica delgada: presencia de marca sin estorbar la lectura */
  .topbar::after { content:""; position:absolute; left:0; right:0; bottom:0; height:3px;
    background: url('/assets/itinerario/fondo.jpg') center 30%/cover no-repeat; opacity:.85; }
  .topbar-left { display:flex; align-items:center; gap:14px; }
  .topbar-left img { height: 30px; width: auto; }
  .topbar img { height: 34px; filter: brightness(0) invert(1); }
  .topbar-title { color: #F5F1E8; font-size: 14px; font-weight: 600; letter-spacing: 0.5px; }
  .topbar-user { color: #DDE6DF; font-size: 13px; display:flex; align-items:center; gap:10px; }
  .topbar-user button { background: transparent; border: 1px solid #4B6B5C; color: #F5F1E8; border-radius: 6px; padding: 5px 10px; font-size: 12px; cursor:pointer; }
  .topbar-buscar { flex:1; display:flex; justify-content:center; padding:0 16px; }
  .topbar-buscar input { width:100%; max-width:380px; font-size:13px; padding:7px 12px;
    border-radius:20px; border:1px solid #4B6B5C; background:#24413600; color:#F5F1E8; }
  .topbar-buscar input::placeholder { color:#9FB6A8; }
  .topbar-buscar input:focus { outline:none; background:#1D332A; border-color:#7FA98F; }

  /* Resultados de búsqueda */
  .buscar-panel { position:fixed; top:56px; left:50%; transform:translateX(-50%);
    width:min(680px, 94vw); background:#fff; border:1px solid var(--border);
    border-radius:12px; box-shadow:0 10px 34px rgba(0,0,0,.22); z-index:900;
    max-height:70vh; overflow-y:auto; padding:8px; }
  .buscar-item { padding:10px 12px; border-radius:8px; cursor:pointer; }
  .buscar-item:hover, .buscar-item.activo { background:#EAF1EC; }
  .buscar-item .linea1 { font-size:14px; font-weight:600; color:var(--forest-dark); }
  .buscar-item .linea2 { font-size:12px; color:var(--muted); margin-top:2px; }

  /* Aviso flotante de confirmación */
  .aviso-flotante { position:fixed; bottom:26px; left:50%; transform:translateX(-50%);
    background:var(--forest-dark); color:#fff; font-size:13px; padding:11px 20px;
    border-radius:24px; box-shadow:0 6px 20px rgba(0,0,0,.28); z-index:1200;
    opacity:0; transition:opacity .2s, bottom .2s; pointer-events:none; }
  .aviso-flotante.visible { opacity:1; bottom:34px; }
  .aviso-flotante.error { background:#B91C1C; }
  /* Alguien más cambió algo y la pantalla se acaba de actualizar. Azul, para que no
     se confunda con "guardado" (verde) ni con un error (rojo), y se va enseguida. */
  .aviso-flotante.ajeno { background:#1D4ED8; }

  /* Sello de versión: discreto mientras todo está al día, ámbar y pulsable cuando el
     servidor ya tiene una versión más nueva que la que está abierta. */
  #sello-version { font-size:11px; opacity:.55; letter-spacing:.3px; white-space:nowrap; }
  #sello-version.vieja { opacity:1; background:#E5A93B; color:#3A2B08; font-weight:600;
    padding:3px 9px; border-radius:12px; cursor:pointer; }

  /* Fila con cambios sin guardar */
  tr.sin-guardar { background:#FFF8DC !important; box-shadow:inset 3px 0 0 #E5A93B; }

  /* Habitaciones que viajan juntas: la etiqueta va junto al número de cuarto y el
     color es estable por grupo, así se reconocen entre filas sin leer nada. */
  .chip-grupo { display:inline-block; color:#fff; font-size:10px; font-weight:600;
    padding:2px 7px; border-radius:var(--r-pill); letter-spacing:.2px; cursor:pointer;
    white-space:nowrap; vertical-align:middle; max-width:190px; overflow:hidden;
    text-overflow:ellipsis; }
  .chip-grupo:active { opacity:.75; }

  /* Línea del día: la jornada del lodge se organiza por horas de salida, así que
     se dibuja el día completo de 5:45 a 20:30 con los tours en su hora real. */
  .jornada { position:relative; margin:4px 0 2px; }
  .jornada-eje { position:relative; height:20px; border-bottom:1px solid var(--border); }
  .jornada-hora { position:absolute; top:0; transform:translateX(-50%); font-size:10px;
    color:var(--muted); letter-spacing:.3px; }
  .jornada-hora::after { content:""; position:absolute; left:50%; top:14px; width:1px;
    height:6px; background:var(--border); }
  .jornada-comidas { position:absolute; left:0; right:0; top:20px; bottom:0; }
  .jornada-comida { position:absolute; top:0; bottom:0; background:#FAF6EC;
    border-left:1px dashed #E3DFD3; border-right:1px dashed #E3DFD3; }
  .jornada-comida span { position:absolute; top:-15px; left:2px; font-size:9px;
    color:#A79E86; letter-spacing:.4px; text-transform:uppercase; white-space:nowrap; }
  .jornada-comida:first-child span { left:0; }
  .jornada-pistas { position:relative; padding-top:6px; }
  .jornada-pista { position:relative; height:38px; margin-bottom:5px; }
  .jornada-tour { position:absolute; top:0; height:38px; min-width:52px;
    background:var(--forest); color:#fff; border-radius:6px; padding:5px 7px;
    overflow:hidden; cursor:pointer; transition:transform .12s, box-shadow .12s; }
  .jornada-tour:hover { transform:translateY(-1px); box-shadow:0 3px 10px rgba(0,0,0,.18); }
  .jornada-tour.sin-asignar { background:#8B7B4E; }
  .jornada-tour.conflicto { background:#9B2C2C; }
  .jornada-tour b { display:block; font-size:11.5px; line-height:1.15; letter-spacing:.2px; }
  .jornada-tour small { display:block; font-size:9.5px; opacity:.85; line-height:1.25;
    white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .jornada-ahora { position:absolute; top:0; bottom:0; width:2px; background:#B91C1C; z-index:5; }
  .jornada-ahora::before { content:""; position:absolute; top:-3px; left:-3px; width:8px;
    height:8px; border-radius:50%; background:#B91C1C; }
  .jornada-leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:11px;
    color:var(--muted); margin-top:8px; }
  .jornada-leyenda span { display:flex; align-items:center; gap:5px; }
  .jornada-leyenda i { width:12px; height:12px; border-radius:3px; display:inline-block; }

  /* Indicador de que el sistema está trabajando. Leer un PDF de 77 reservas toma
     unos segundos y sin aviso la pantalla parece congelada. */
  .trabajando { text-align:center; padding:34px 16px; }
  .trabajando .giro { width:34px; height:34px; margin:0 auto 14px;
    border:3px solid var(--border); border-top-color:var(--forest);
    border-radius:50%; animation:girar .8s linear infinite; }
  @keyframes girar { to { transform:rotate(360deg); } }
  .trabajando p { margin:0; font-size:14px; color:var(--forest-dark); font-weight:600; }
  .trabajando small { display:block; margin-top:5px; font-size:12px; color:var(--muted); }

  /* Distribución de restaurantes */
  .rest-grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .rest-col { background:#fff; border:1px solid var(--border); border-radius:var(--r-md); padding:14px; }
  .rest-col h5 { margin:0; font-family:'Display',Georgia,serif; font-weight:700;
    font-size:calc(var(--t-lg)*var(--escala)); color:var(--forest-dark); }
  .rest-col .cifra { font-family:'Display',Georgia,serif; font-weight:700;
    font-size:calc(var(--t-xxl)*var(--escala)); color:var(--forest-dark); line-height:1.1; }
  .rest-barra { background:#EFEBE0; border-radius:5px; height:10px; margin-top:8px; overflow:hidden; }
  .rest-barra div { height:100%; border-radius:5px; }
  .rest-nota { font-size:calc(var(--t-xs)*var(--escala)); color:var(--muted);
    padding:3px 0; border-bottom:1px dotted var(--border); }
  .rest-nota:last-child { border-bottom:none; }
  @media (max-width: 760px) { .rest-grid { grid-template-columns:1fr; } }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--r-md); padding: 20px; margin-bottom: 16px; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
  .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }
  .title { font-weight: 700; font-size: calc(var(--t-lg) * var(--escala)); margin: 0;
    color: var(--forest-dark); letter-spacing: .2px; }
  .subtitle { font-size: calc(var(--t-sm) * var(--escala)); color: var(--muted); margin: 2px 0 0; }
  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 16px; }
  .stat { background: #FAF8F2; border-radius: var(--r-sm); padding: 14px; cursor: pointer; border: 1px solid transparent; }
  .stat:hover { border-color: var(--border); }
  .stat.selected { border-color: var(--forest); background: #EAF1EC; }
  .stat-label { font-size: calc(var(--t-xs) * var(--escala)); color: var(--muted); margin: 0 0 6px;
    letter-spacing: .3px; text-transform: uppercase; }
  .stat-value { font-size: calc(var(--t-xxl) * var(--escala)); font-weight: 700; margin: 0;
    color: var(--forest-dark); line-height: 1.1; }
  table { width: 100%; border-collapse: collapse; font-size: calc(var(--t-sm) * var(--escala)); }
  th { text-align: left; color: var(--muted); font-weight: 600; padding: 9px 6px;
    border-bottom: 1px solid var(--border); font-size: calc(var(--t-xs) * var(--escala));
    letter-spacing: .4px; text-transform: uppercase;
    /* El encabezado queda fijo al desplazar tablas largas */
    position: sticky; top: 0; background: var(--card); z-index: 2; }
  td { padding: 10px 6px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  tbody tr:hover, table tr:hover { background: #FCFBF7; }
  .badge { font-size: 11px; padding: 2px 8px; border-radius: 6px; }
  .badge-ok { background: var(--ok-bg); color: var(--ok-text); }
  .badge-warn { background: var(--warn-bg); color: var(--warn-text); }
  .badge-hoy { background: var(--forest); color: #fff; font-weight: 600; letter-spacing:.4px; }
  .badge-tour { background: #EAF1EC; color: var(--forest-dark); margin-right:4px; display:inline-block; margin-bottom:2px; }
  nav { display: flex; gap: 8px; margin-bottom: 20px; flex-wrap: wrap; }
  nav button { font-size: calc(var(--t-sm) * var(--escala)); padding: 8px 14px; border-radius: var(--r-sm); border: 1px solid var(--border); background: white; cursor: pointer; color: var(--text); }
  nav button.active { background: var(--forest); color: white; border-color: var(--forest); }
  /* En computadora se lee el nombre completo. El corto es solo para la barra del
     celular, y hay que ocultarlo aquí o el botón muestra los dos ("Reservas Reservas"). */
  nav button .corto { display: none; }
  .empty { color: var(--muted); font-size: calc(var(--t-sm) * var(--escala));
    padding: 26px 12px; text-align: center; }
  .empty::before { content:""; display:block; width:112px; height:76px; margin:0 auto 10px;
    background: url('/assets/hoja.png') center/contain no-repeat; opacity:.35; }
  .empty small { display:block; margin-top:5px; font-size: calc(var(--t-xs) * var(--escala));
    color:#9C9683; }
  td.empty::before { display:none; }
  td.empty { padding: 20px 12px; }
  .btn { font-size: calc(var(--t-sm) * var(--escala)); padding: 7px 13px; border-radius: var(--r-sm); border: 1px solid var(--border); background: white; cursor: pointer; margin-right: 6px; color: var(--text); transition: background .12s, color .12s, border-color .12s; }
  /* Al tocar un botón se pinta de azul un instante, para confirmar que la acción se ejecutó */
  .btn:active, .btn.pulsado { background: #2563EB; color: #fff; border-color: #2563EB; }
  nav button { transition: background .12s, color .12s; }
  nav button:active, nav button.pulsado { background: #2563EB; color: #fff; border-color: #2563EB; }
  .stat { transition: background .12s, border-color .12s; }
  .stat.pulsado { background: #E6EEFC; border-color: #2563EB; }
  .pulsable { transition: background .12s; }
  .pulsable.pulsado { background: #E6EEFC; }
  .btn-primary { background: var(--forest); color: white; border-color: var(--forest); }
  .filterbar { display: flex; align-items: center; gap: 8px; font-size: 13px; flex-wrap: wrap; }

  /* ==========================================================================
     CELULAR
     El sistema se diseñó para computadora, y ahí se sigue trabajando: importar el
     PDF, editar itinerarios, mover tours. En el teléfono la mayoría solo consulta,
     así que aquí se busca que ABRA como una app y se LEA de un pulgar:
       · el menú pasa a una barra fija abajo, al alcance del dedo
       · las tablas se vuelven tarjetas, una por fila, con la etiqueta del dato
       · las barras de filtros se deslizan de lado en vez de amontonarse
     Los botones de editar no hace falta esconderlos: ya desaparecen solos para quien
     tiene permiso de solo ver.
     ========================================================================== */
  .solo-movil { display: none; }

  @media (max-width: 760px) {
    .solo-movil { display: block; }
    .solo-escritorio { display: none !important; }

    /* Debajo de la barra fija tiene que quedar aire, o el último botón de la pantalla
       queda tapado. El env() es para los teléfonos con barra de gestos. */
    .container { padding: 12px 10px calc(86px + env(safe-area-inset-bottom)); max-width: 100%; }

    .topbar { padding: 10px 12px; padding-top: calc(10px + env(safe-area-inset-top)); }
    .topbar-title { display: none; }          /* el logo ya identifica al lodge */
    .topbar-left img, .topbar img { height: 26px; }
    .topbar-buscar { padding: 0 8px; }
    .topbar-user { gap: 6px; font-size: 12px; }
    #user-label { max-width: 84px; overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; }
    #sello-version { display: none; }          /* en pantalla chica no cabe; sigue en la web */

    /* ---- Menú: barra fija abajo ----
       Se desliza de lado si la persona tiene muchas pantallas. Quien tenga dos o tres
       las ve todas de una: la barra se arma con los botones que su permiso deja pasar. */
    nav {
      position: fixed; left: 0; right: 0; bottom: 0; z-index: 800;
      margin: 0; gap: 0; flex-wrap: nowrap; overflow-x: auto; scroll-snap-type: x proximity;
      background: var(--card); border-top: 1px solid var(--border);
      padding: 6px 4px calc(6px + env(safe-area-inset-bottom));
      box-shadow: 0 -3px 14px rgba(0,0,0,.10);
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    nav::-webkit-scrollbar { display: none; }
    nav button {
      flex: 1 0 auto; min-width: 74px; scroll-snap-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 3px;
      border: none; background: transparent; border-radius: var(--r-sm);
      padding: 7px 6px 5px; font-size: 10.5px; line-height: 1.15; color: var(--muted);
      letter-spacing: .1px;
    }
    nav button.active { background: #EAF1EC; color: var(--forest-dark); font-weight: 600; }
    /* El icono y el nombre corto viven en el propio botón, así el menú no se duplica */
    nav button::before { content: attr(data-icono); font-size: 19px; line-height: 1; }
    nav button .largo { display: none; }
    nav button .corto { display: block; }

    /* ---- Tablas convertidas en tarjetas ----
       La etiqueta de cada dato la pone adaptarTablasMovil() leyendo el encabezado,
       así funciona en todas las tablas sin tocar ninguna a mano. */
    table thead, table tr:first-child th { display: none; }
    table, table tbody, table tr, table td { display: block; width: 100%; }
    table { border-collapse: separate; }
    table tr {
      border: 1px solid var(--border); border-radius: var(--r-md);
      margin-bottom: 10px; padding: 4px 0; background: var(--card);
      overflow: hidden;
    }
    table td {
      border: none; border-bottom: 1px solid #F1EFE8;
      padding: 7px 12px; text-align: left; font-size: 13px;
      display: flex; justify-content: space-between; align-items: baseline; gap: 12px;
      /* Si el dato es largo —el nombre de un grupo, por ejemplo— baja de línea en vez
         de desbordar la tarjeta. */
      flex-wrap: wrap;
    }
    /* La etiqueta de grupo dentro de la tarjeta: cabe completa y se toca cómodo */
    .chip-grupo { max-width: 100%; padding: 4px 9px; font-size: 10.5px;
      -webkit-tap-highlight-color: transparent; }
    table tr td:last-child { border-bottom: none; }
    table td::before {
      content: attr(data-etiqueta);
      flex: 0 0 38%; font-size: 10px; text-transform: uppercase; letter-spacing: .5px;
      color: var(--muted); font-weight: 600; padding-top: 2px;
    }
    /* Celdas sin encabezado (la columna de botones) ocupan todo el ancho */
    table td[data-etiqueta=""] { display: block; }
    table td[data-etiqueta=""]::before { display: none; }
    table td .btn { margin: 3px 6px 3px 0; }

    /* ---- Recuadros de cifras: de a dos ---- */
    .stats { grid-template-columns: repeat(2, 1fr) !important; gap: 8px; }
    .stat { padding: 11px; }

    /* ---- Filtros: una sola fila que se desliza ---- */
    .filterbar {
      flex-wrap: nowrap; overflow-x: auto; padding-bottom: 4px;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .filterbar::-webkit-scrollbar { display: none; }
    .filterbar > * { flex: 0 0 auto; }
    .header { flex-direction: column; align-items: stretch; gap: 10px; }

    /* ---- Tocable con el pulgar, y sin que el iPhone haga zoom al escribir ---- */
    .btn { padding: 10px 14px; }
    nav button, .btn, .stat { -webkit-tap-highlight-color: transparent; }
    input, select, textarea { font-size: 16px !important; }
    .filterbar input, .filterbar select { padding: 8px 10px; }

    .card { padding: 14px 12px; border-radius: var(--r-md); }
    .modal-fondo { padding: 12px 8px calc(80px + env(safe-area-inset-bottom)); }
    .modal-caja { padding: 16px 14px; }
    .aviso-flotante { bottom: calc(78px + env(safe-area-inset-bottom)); width: max-content;
      max-width: 88vw; text-align: center; }
    .aviso-flotante.visible { bottom: calc(86px + env(safe-area-inset-bottom)); }
    .buscar-panel { top: 52px; width: 96vw; }
  }

  /* Instalada en el teléfono: sin barra de direcciones, se gana ese alto */
  @media (display-mode: standalone) {
    .instalar-aviso { display: none !important; }
  }

  /* Aviso para instalar, solo la primera vez y solo en el teléfono */
  .instalar-aviso {
    position: fixed; left: 10px; right: 10px; bottom: calc(84px + env(safe-area-inset-bottom));
    background: var(--forest-dark); color: #F5F1E8; border-radius: var(--r-md);
    padding: 12px 14px; font-size: 12.5px; z-index: 1100; display: flex; gap: 10px;
    align-items: center; box-shadow: 0 6px 22px rgba(0,0,0,.3);
  }
  .instalar-aviso button { flex: 0 0 auto; background: #F5F1E8; color: var(--forest-dark);
    border: none; border-radius: var(--r-sm); padding: 8px 12px; font-weight: 600;
    font-size: 12.5px; cursor: pointer; }

  .filterbar input, .filterbar select, select, input[type=date], input[type=text] { font-size: 13px; padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; }
  .note-tag { display:inline-block; font-size:10px; padding:1px 6px; border-radius:4px; margin-right:6px; font-weight:600; }

  /* Colores pastel por estado de la reserva (relativo al día de hoy) */

  .leyenda { display:flex; gap:14px; flex-wrap:wrap; font-size:11px; color:var(--muted); margin:10px 0 4px; }
  .leyenda span { display:flex; align-items:center; gap:5px; }

  .detail-panel { background: #FAF8F2; border-radius: 8px; padding: 12px; margin: 8px 0 16px; font-size: 13px; }

  /* Cuadro de detalle de reserva */
  .modal-fondo { position: fixed; inset: 0; background: rgba(29,51,42,0.55); display: flex; align-items: flex-start; justify-content: center; z-index: 1000; overflow-y: auto; padding: 30px 16px; }
  .modal-caja { background: white; border-radius: 12px; max-width: 720px; width: 100%; padding: 24px; box-shadow: 0 12px 40px rgba(0,0,0,0.3); }
  .modal-cerrar { float: right; background: transparent; border: none; font-size: 22px; cursor: pointer; color: var(--muted); line-height: 1; }
  .modal-seccion { margin-top: 18px; }

  .modal-dato { font-size: 13px; margin: 0 0 4px; }
  .modal-dato strong { color: var(--muted); font-weight: 400; }

  /* Login */
  /* La pantalla de ingreso es el umbral del sistema: aquí sí la naturaleza a
     pantalla completa. Las pantallas de trabajo van con fondo plano para que el
     color pueda significar urgencia sin competencia visual. */
  .login-wrap { min-height: 100vh; display:flex; align-items:center; justify-content:center;
    background: linear-gradient(rgba(29,51,42,.55), rgba(29,51,42,.72)),
                url('/assets/itinerario/fondo.jpg') center/cover no-repeat var(--forest-dark); }
  .login-card { background: rgba(255,255,255,.97); border-radius: var(--r-md);
    padding: 40px 36px; width: 340px; text-align: center;
    box-shadow: 0 14px 44px rgba(0,0,0,0.32); backdrop-filter: blur(2px); }
  .login-card img { max-width: 220px; margin-bottom: 20px; }
  .login-card input { width: 100%; margin-bottom: 12px; padding: 10px 12px; border-radius: 8px; }
  .login-card button { width: 100%; padding: 10px; border-radius: 8px; background: var(--forest); color: white; border: none; font-size: 14px; cursor: pointer; margin-top: 6px; }
  .login-error { color: var(--danger-text); font-size: 12px; margin-top: 8px; min-height: 14px; }
  .login-hint { color: var(--muted); font-size: 11px; margin-top: 18px; line-height: 1.5; }
</style>
</head>
<body>

<div id="login-screen" class="login-wrap">
  <div class="login-card">
    <img src="/assets/logo.jpg" alt="Corcovado Wilderness Lodge">
    <p style="font-weight:600;font-size:15px;margin:0 0 16px;color:#24291F;">Sistema de operación</p>
    <!-- autocapitalize/autocorrect apagados: en el celular el teclado ponía mayúscula a
         la primera letra ("Transporte" en vez de "transporte") y el ingreso fallaba. -->
    <input type="text" id="login-user" placeholder="Usuario" autocomplete="username"
           autocapitalize="none" autocorrect="off" spellcheck="false">
    <input type="password" id="login-pass" placeholder="Contraseña" autocomplete="current-password">
    <button onclick="doLogin()">Ingresar</button>
    <div class="login-error" id="login-error"></div>
    <!-- Aquí se listaban las cuentas iniciales con su contraseña. Servía cuando el
         sistema corría solo en la red del hotel, pero con el sistema publicado en
         internet le entregaba una cuenta válida a cualquiera que abriera la dirección. -->
    <div class="login-hint">Si no tienes usuario, pídelo en recepción.</div>
  </div>
</div>

<div id="app-screen" style="display:none;">
  <div class="topbar">
    <div class="topbar-left">
      <img src="/assets/logo_blanco.png" alt="logo">
      <span class="topbar-title">CORCOVADO WILDERNESS LODGE · OPERACIÓN</span>
    </div>
    <div class="topbar-buscar">
      <input type="search" id="buscador" placeholder="Buscar huésped, habitación o reserva…"
             autocomplete="off" oninput="buscarGlobal(this.value)">
    </div>
    <div class="topbar-user">
      <button id="btn-escala" onclick="cambiarEscala()" title="Tamaño del texto">A+</button>
      <span id="user-label"></span>
      <!-- Sello de la versión que está corriendo. Se pone ámbar y se vuelve botón si el
           servidor pasa a tener una más nueva. -->
      <span id="sello-version" title=""></span>
      <button onclick="doLogout()">Cerrar sesión</button>
    </div>
  </div>
  <div class="container">
    <nav>
      <!-- Cada botón abre su pantalla en el día de hoy: irAPantalla reinicia el filtro
           de fechas de esa pantalla antes de cargarla.
           El nombre va dos veces: el largo se lee en computadora, el corto y el icono en
           el teléfono. Así la barra de abajo no es un segundo menú que haya que mantener
           aparte — y como los botones sin permiso ya se ocultan, a cada persona le queda
           la barra con solo sus pantallas. -->
      <button class="active" data-icono="🏠" onclick="irAPantalla(0)"><span class="largo">Dashboard</span><span class="corto">Hoy</span></button>
      <button data-icono="🛏️" onclick="irAPantalla(1)"><span class="largo">Reservas</span><span class="corto">Reservas</span></button>
      <button data-icono="🥾" onclick="irAPantalla(2)"><span class="largo">Agenda de tours</span><span class="corto">Tours</span></button>
      <button data-icono="🚤" onclick="irAPantalla(3)"><span class="largo">Transporte</span><span class="corto">Transporte</span></button>
      <button data-icono="🎫" onclick="irAPantalla(4)"><span class="largo">Entradas SINAC</span><span class="corto">SINAC</span></button>
      <button data-icono="🎁" onclick="irAPantalla(5)"><span class="largo">Amenidades</span><span class="corto">Amenidades</span></button>
      <button data-icono="🍽️" onclick="irAPantalla(6)"><span class="largo">Restaurantes</span><span class="corto">Comidas</span></button>
      <button data-icono="📊" onclick="irAPantalla(7)"><span class="largo">Analítica</span><span class="corto">Analítica</span></button>
      <button data-icono="📋" onclick="irAPantalla(8)"><span class="largo">Resumen operación</span><span class="corto">Resumen</span></button>
      <button id="nav-importar" data-icono="📄" onclick="irAPantalla(9)"><span class="largo">Importar PDF</span><span class="corto">Importar</span></button>
      <button id="nav-usuarios" data-icono="👤" onclick="irAPantalla(10)"><span class="largo">Usuarios</span><span class="corto">Usuarios</span></button>
      <button id="nav-catalogo" data-icono="📚" onclick="irAPantalla(11)"><span class="largo">Catálogo</span><span class="corto">Catálogo</span></button>
      <button id="nav-publicacion" data-icono="📱" onclick="irAPantalla(12)"><span class="largo">Publicación</span><span class="corto">QR</span></button>
    </nav>
    <div id="app"></div>
  </div>
</div>

<script>
const API = "";
let TOKEN = null;
let CURRENT_USER = null;
function hoyISO() { 
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function inicioMesISO() {
  const d = new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
}
function finMesISO() {
  const d = new Date(new Date().getFullYear(), new Date().getMonth()+1, 0);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function masDiasISO(n) {
  const d = new Date(); d.setDate(d.getDate() + n);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function finMesSiguienteISO() {
  const d = new Date(new Date().getFullYear(), new Date().getMonth()+2, 0);
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}

// Cada pantalla tiene su PROPIO filtro de fechas, independiente de las demás:
// si eliges una fecha en Reservas, no afecta a Transporte ni a Agenda.
//
// Los valores por defecto son funciones, no valores fijos, porque se vuelven a
// calcular cada vez que se abre la pantalla desde el menú. Así siempre se entra en
// el día de hoy, incluso si el sistema quedó abierto desde ayer en una computadora
// que nadie apaga — antes la fecha se calculaba una sola vez al cargar la página y
// se quedaba pegada en el día en que se abrió.
const DEFECTOS_FILTRO = {
  dashboard:   () => ({ fecha: hoyISO() }),
  reservas:    () => ({ fecha: hoyISO(), desde: inicioMesISO(), hasta: finMesISO(), modo: "dia" }),
  agenda:      () => ({ fecha: hoyISO(), desde: inicioMesISO(), hasta: finMesISO(), modo: "dia" }),
  transporte:  () => ({ fecha: hoyISO(), desde: inicioMesISO(), hasta: finMesISO(), modo: "dia" }),
  sinac:       () => ({ desde: hoyISO(), hasta: masDiasISO(120) }),
  amenidades:  () => ({ fecha: hoyISO(), desde: inicioMesISO(), hasta: finMesISO(), modo: "dia" }),
  analitica:   () => ({ fecha: hoyISO(), desde: inicioMesISO(), hasta: finMesISO(), modo: "dia" }),
  resumen:     () => ({ fecha: hoyISO() }),
  publicacion: () => ({ fecha: hoyISO(), filtro: "todas" }),
  restaurantes:() => ({ fecha: hoyISO() }),
};

const FILTROS = {};
for (const p in DEFECTOS_FILTRO) FILTROS[p] = DEFECTOS_FILTRO[p]();

// Nombre del filtro de cada botón del menú, en el mismo orden que los botones y que
// cargadoresPantalla(). Las pantallas sin fechas (Importar, Usuarios, Catálogo) no
// tienen filtro que reiniciar.
const FILTRO_DE_PANTALLA = ["dashboard", "reservas", "agenda", "transporte", "sinac",
                            "amenidades", "restaurantes", "analitica", "resumen",
                            null, null, null, "publicacion"];

async function irAPantalla(indice) {
  // Los grupos se releen al cambiar de pantalla: una importación de PDF nueva puede
  // haber vinculado habitaciones, y la etiqueta tiene que reflejarlo.
  await cargarGrupos();
  _irAPantalla(indice);
}

function _irAPantalla(indice) {
  // Abrir desde el menú siempre lleva al día de hoy. Filtrar otra fecha DENTRO de la
  // pantalla no pasa por aquí, así que se respeta mientras se esté trabajando ahí:
  // ni el refresco automático ni un guardado devuelven la vista al día de hoy.
  const filtro = FILTRO_DE_PANTALLA[indice];
  if (filtro) FILTROS[filtro] = DEFECTOS_FILTRO[filtro]();
  const cargar = cargadoresPantalla()[indice];
  if (cargar) cargar();
}

async function fetchAuth(url, options) {
  options = options || {};
  options.headers = Object.assign({}, options.headers, { "Authorization": "Bearer " + TOKEN });
  const res = await fetch(url, options);
  if (res.status === 401) { doLogout(); throw new Error("Sesión expirada"); }
  // Lo que cambia uno mismo no debe anunciarse como "alguien más hizo un cambio":
  // se pone al día la referencia del refresco automático sin recargar nada.
  if ((options.method || "GET").toUpperCase() !== "GET" && res.ok) ponerAlDiaVersion();
  return res;
}

async function doLogin() {
  const username = document.getElementById("login-user").value.trim();
  const password = document.getElementById("login-pass").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  try {
    const res = await fetch(`${API}/api/auth/login`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ username, password }),
    });
    if (!res.ok) { errEl.textContent = "Usuario o contraseña incorrectos."; return; }
    const data = await res.json();
    TOKEN = data.token;
    CURRENT_USER = data;
    localStorage.setItem("hotel_token", TOKEN);
    showApp();
  } catch (e) {
    errEl.textContent = "No se pudo conectar con el servidor.";
  }
}

function doLogout() {
  if (TOKEN) fetch(`${API}/api/auth/logout`, { method: "POST", headers: { "Authorization": "Bearer " + TOKEN } }).catch(() => {});
  detenerRefrescoAutomatico();
  TOKEN = null; CURRENT_USER = null;
  localStorage.removeItem("hotel_token");
  document.getElementById("app-screen").style.display = "none";
  document.getElementById("login-screen").style.display = "flex";
  document.getElementById("login-pass").value = "";
}

function showApp() {
  document.getElementById("login-screen").style.display = "none";
  document.getElementById("app-screen").style.display = "block";
  ROL = CURRENT_USER.rol;
  PERMISOS = CURRENT_USER.permisos || {};
  const rolLabel = { recepcion: "Recepción", gerencia: "Gerencia", staff: "Staff de campo" }[CURRENT_USER.rol] || CURRENT_USER.rol;
  document.getElementById("user-label").textContent = `${CURRENT_USER.nombre_completo} · ${rolLabel}`;

  // Se ocultan las pestañas a las que el usuario no tiene acceso. Un usuario de
  // restaurante solo verá lo que necesita para su trabajo.
  mostrarSelloVersion();
  // Si el navegador ya ofreció instalar antes de entrar, se propone ahora que hay sesión.
  setTimeout(mostrarAvisoInstalar, 1500);
  const primera = aplicarPermisos();
  // Se entra por irAPantalla para que la primera pantalla también abra en el día de
  // hoy, aunque la sesión se haya iniciado con la página abierta desde ayer.
  irAPantalla(primera >= 0 ? primera : 0);   // trae también los grupos
  iniciarRefrescoAutomatico();
}

// ---------- Aviso flotante de confirmación ----------
let _avisoTimer = null;
function avisar(texto, esError, tipo) {
  let el = document.getElementById("aviso-flotante");
  if (!el) {
    el = document.createElement("div");
    el.id = "aviso-flotante";
    el.className = "aviso-flotante";
    document.body.appendChild(el);
  }
  el.textContent = texto;
  el.classList.toggle("error", !!esError);
  el.classList.toggle("ajeno", tipo === "ajeno");
  el.classList.add("visible");
  clearTimeout(_avisoTimer);
  // El aviso de cambio de otra persona dura menos: solo hace falta enterarse.
  _avisoTimer = setTimeout(() => el.classList.remove("visible"), tipo === "ajeno" ? 1800 : 2600);
}

// ---------- Habitaciones que viajan juntas ----------
// Grupos de agencia y familias con varios cuartos. Es informativo: la fila no se mueve
// ni se esconde, porque la operación es por habitación —housekeeping prepara el cuarto
// 03, el salonero sienta al 12—. Lo que se agrega es la RELACIÓN, visible donde sea que
// aparezca la habitación, con el mismo color para las del mismo grupo.
let GRUPOS = {};

async function cargarGrupos() {
  try {
    GRUPOS = await (await fetchAuth(`${API}/api/grupos`)).json();
  } catch (e) { GRUPOS = {}; }
}

// Un color estable por grupo, sacado de su clave: así las habitaciones del mismo grupo
// se reconocen de un vistazo y el color no cambia al recargar.
const COLORES_GRUPO = ["#5B7C99", "#8A6D5B", "#6B8E7B", "#8E6B85", "#94804A", "#5E7A6B"];
function colorGrupo(clave) {
  let suma = 0;
  for (const c of clave) suma = (suma + c.charCodeAt(0)) % 9973;
  return COLORES_GRUPO[suma % COLORES_GRUPO.length];
}

// La etiqueta que se pone al lado de la habitación. Se le pasa el número de reserva.
function etiquetaGrupo(confNo) {
  const g = GRUPOS[confNo];
  if (!g) return "";
  const color = colorGrupo(g.clave);
  const aviso = g.confirmado ? "" : " ·  sin confirmar";
  return ` <span class="chip-grupo" style="background:${color};"
      onclick="verGrupo('${confNo}'); event.stopPropagation();"
      title="Toca para ver las habitaciones de este grupo">
      ${g.etiqueta} · ${g.habitaciones} hab.${aviso}</span>`;
}

function verGrupo(confNo) {
  const g = GRUPOS[confNo];
  if (!g) return;
  const color = colorGrupo(g.clave);
  const origen = g.origen === "bloque"
    ? "Van juntas según el código de bloque del PMS."
    : "Vínculo detectado en las notas del PDF.";
  const fondo = document.createElement("div");
  fondo.className = "modal-fondo"; fondo.id = "modal-grupo";
  fondo.onclick = (e) => { if (e.target === fondo) fondo.remove(); };
  fondo.innerHTML = `<div class="modal-caja" style="max-width:560px;">
    <div class="modal-encabezado">
      <div>
        <p class="title">${g.etiqueta}</p>
        <p class="subtitle">${g.habitaciones} habitaciones · ${g.pax} pax · ${origen}</p>
      </div>
      <button class="btn" onclick="document.getElementById('modal-grupo').remove()">Cerrar</button>
    </div>
    <div class="modal-cuerpo">
      ${!g.confirmado ? `<div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 10px;font-size:12.5px;">
        Este vínculo lo detectó el sistema al leer las notas${g.confianza ? ` (confianza ${g.confianza})` : ""}
        y <strong>nadie lo ha confirmado todavía</strong>. Mientras siga así, se muestra
        pero conviene revisarlo.
        ${puedeEscribir("reservas") && g.grupo_id ? `<br>
          <button class="btn" style="margin-top:8px;" onclick="confirmarGrupoDesdePanel(${g.grupo_id}, true)">Sí, viajan juntas</button>
          <button class="btn" onclick="confirmarGrupoDesdePanel(${g.grupo_id}, false)">No, desvincular</button>` : ""}
      </div>` : ""}
      <table>
        <tr><th>Hab.</th><th>Huésped</th><th>Pax</th><th>Estadía</th></tr>
        ${g.miembros.map(m => `<tr style="box-shadow:inset 3px 0 0 ${color};">
          <td><strong>${m.room_no || "—"}</strong></td>
          <td>${m.nombre}</td>
          <td>${m.pax}</td>
          <td>${m.arr_date} – ${m.dep_date || "?"}</td>
        </tr>`).join("")}
      </table>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">
        El reparto de restaurantes nunca separa a estas habitaciones.
      </p>
    </div></div>`;
  document.body.appendChild(fondo);
}

async function confirmarGrupoDesdePanel(grupoId, confirmar) {
  await fetchAuth(`${API}/api/grupos/${grupoId}/confirmar?confirmar=${confirmar}`, { method: "POST" });
  document.getElementById("modal-grupo")?.remove();
  avisar(confirmar ? "Grupo confirmado" : "Grupo desvinculado");
  await cargarGrupos();
  const cargar = cargadoresPantalla()[window._pantallaActiva];
  if (cargar) cargar();
}

// ---------- App en el teléfono ----------
// Tres cosas: registrar el programa de servicio (lo que permite instalarla y abrirla
// sin señal), poner etiqueta a cada dato de las tablas para que se lean como tarjetas,
// y ofrecer la instalación una vez.

function esMovil() { return window.matchMedia("(max-width: 760px)").matches; }
function estaInstalada() {
  return window.matchMedia("(display-mode: standalone)").matches || window.navigator.standalone === true;
}

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("/sw.js").catch(() => {
      // Sin él la app sigue funcionando como página web; solo no se instala ni abre
      // sin señal. No vale la pena molestar a nadie con este error.
    });
  });
}

// En el teléfono las tablas se dibujan como tarjetas, y cada dato necesita su etiqueta.
// Se toma del encabezado de la propia tabla, así vale para todas —las de hoy y las que
// se agreguen— sin tener que escribir la etiqueta a mano en cada celda.
function adaptarTablasMovil(raiz) {
  (raiz || document).querySelectorAll("table:not([data-adaptada])").forEach(tabla => {
    const encabezados = [...tabla.querySelectorAll("tr")]
      .find(f => f.querySelector("th"));
    if (!encabezados) return;
    const titulos = [...encabezados.querySelectorAll("th")].map(t => t.textContent.trim());
    tabla.querySelectorAll("tr").forEach(fila => {
      [...fila.children].forEach((celda, i) => {
        if (celda.tagName === "TD" && !celda.hasAttribute("data-etiqueta")) {
          celda.setAttribute("data-etiqueta", titulos[i] || "");
        }
      });
    });
    tabla.setAttribute("data-adaptada", "1");
  });
}

// Las pantallas se dibujan en momentos distintos (al cargar, al abrir un detalle, en un
// modal), así que en vez de llamar a la adaptación en cada lugar se observa el documento.
new MutationObserver(cambios => {
  if (cambios.some(c => c.addedNodes.length)) adaptarTablasMovil();
}).observe(document.body, { childList: true, subtree: true });

// ---------- Ofrecer la instalación ----------
let _eventoInstalar = null;
window.addEventListener("beforeinstallprompt", (e) => {
  e.preventDefault();            // se guarda para ofrecerlo cuando convenga
  _eventoInstalar = e;
  mostrarAvisoInstalar();
});

function mostrarAvisoInstalar() {
  if (!esMovil() || estaInstalada() || !TOKEN) return;
  if (localStorage.getItem("cwl_no_instalar") === "1") return;
  if (document.querySelector(".instalar-aviso")) return;

// ---------- Sello de versión ----------
// La página conoce SU versión porque el servidor se la deja puesta al entregarla. Con
// eso se puede distinguir lo que antes no se podía: si el sistema no trae un cambio
// porque no se desplegó, o porque el navegador se quedó con una copia anterior.
const VERSION_PAGINA = document.querySelector('meta[name="version-sistema"]')?.content || "";

function textoVersion(iso) {
  // Llega en UTC y se muestra en la hora de quien mira, que es la que le sirve.
  const d = new Date(iso);
  if (isNaN(d)) return "";
  const p = n => String(n).padStart(2, "0");
  return `v ${p(d.getDate())}/${p(d.getMonth() + 1)} ${p(d.getHours())}:${p(d.getMinutes())}`;
}

function mostrarSelloVersion() {
  const el = document.getElementById("sello-version");
  if (!el) return;
  el.textContent = textoVersion(VERSION_PAGINA);
  el.title = VERSION_PAGINA ? `Versión del sistema que está abierta: ${VERSION_PAGINA}`
                            : "Versión desconocida";
}

function avisarVersionNueva(versionServidor) {
  const el = document.getElementById("sello-version");
  if (!el || el.classList.contains("vieja")) return;   // ya está avisado
  el.classList.add("vieja");
  el.textContent = "versión nueva · recargar";
  el.title = `Abierta: ${VERSION_PAGINA}\nEn el servidor: ${versionServidor}`;
  el.onclick = () => location.replace(location.pathname + "?v=" + Date.now());
}

// ---------- Refresco automático entre computadoras ----------
// El sistema lo usan varias personas a la vez desde distintas computadoras. Cada
// pocos segundos se le pregunta al servidor si alguien cambió algo, y solo entonces
// se vuelve a cargar la pantalla. Es una sola consulta muy barata, y nunca se
// refresca a lo bruto: si la persona tiene algo a medio editar o un detalle abierto,
// se respeta lo que está haciendo.
const REFRESCO_MS = 6000;
// Pantallas que conviene refrescar solas. Quedan fuera a propósito Analítica (informe
// pesado que nadie mira en vivo) e Importar PDF, Usuarios y Catálogo, donde un
// refresco borraría el archivo elegido o un formulario a medio llenar.
const PANTALLAS_QUE_SE_REFRESCAN = [0, 1, 2, 3, 4, 5, 6, 8, 12];
let _versionDatos = null;
let _refrescoTimer = null;

// Cargadores en el mismo orden que los botones del menú.
function cargadoresPantalla() {
  return [loadDashboard, loadReservas, loadAgenda, loadTransporte, loadEntradas,
          loadAmenidades, loadRestaurantes, loadAnalitica, loadResumenOperacion,
          loadImportarPDF, loadUsuarios, loadCatalogoAdmin, loadPublicacion];
}

function iniciarRefrescoAutomatico() {
  clearInterval(_refrescoTimer);
  _versionDatos = null;
  // Se toma la referencia de entrada ya mismo: así el primer turno del reloj ya puede
  // detectar un cambio, en vez de gastarse en aprender cómo estaban las cosas.
  ponerAlDiaVersion();
  _refrescoTimer = setInterval(revisarCambios, REFRESCO_MS);
}

function detenerRefrescoAutomatico() {
  clearInterval(_refrescoTimer);
  _refrescoTimer = null;
  _versionDatos = null;
}

async function ponerAlDiaVersion() {
  if (!TOKEN) return;
  try {
    const res = await fetch(`${API}/api/cambios`, { headers: { "Authorization": "Bearer " + TOKEN } });
    if (res.ok) _versionDatos = (await res.json()).version;
  } catch (e) { /* si falla, el próximo turno del reloj lo resuelve */ }
}

async function revisarCambios() {
  // Sin sesión, o con la pestaña en segundo plano, no hay nada que refrescar.
  if (!TOKEN || document.hidden) return;
  let version;
  try {
    // A propósito no se usa fetchAuth: un fallo de red o un token vencido no debe
    // cerrarle la sesión a nadie desde un temporizador de fondo. Se reintenta solo.
    const res = await fetch(`${API}/api/cambios`, { headers: { "Authorization": "Bearer " + TOKEN } });
    if (!res.ok) return;
    const datos = await res.json();
    version = datos.version;
    // Si el servidor fue actualizado mientras esto estaba abierto, se avisa en el sello
    // en vez de recargar por sorpresa: puede haber trabajo a medio hacer en pantalla.
    if (datos.version_sistema && VERSION_PAGINA && datos.version_sistema !== VERSION_PAGINA) {
      avisarVersionNueva(datos.version_sistema);
    }
  } catch (e) { return; }

  if (_versionDatos === null) { _versionDatos = version; return; }  // primera lectura
  if (version === _versionDatos) return;                            // nadie tocó nada
  _versionDatos = version;

  const cargar = cargadoresPantalla()[window._pantallaActiva];
  if (!cargar || !PANTALLAS_QUE_SE_REFRESCAN.includes(window._pantallaActiva)) return;
  if (document.querySelector(".modal-fondo")) return;   // hay un detalle abierto encima
  if (hayCambiosSinGuardar()) {
    // No se recarga: se perderían los guías que la persona acaba de elegir.
    avisar("Alguien más hizo un cambio · guarda para ver lo nuevo", false, "ajeno");
    return;
  }
  cargar();
  avisar("Actualizado", false, "ajeno");
}

document.addEventListener("visibilitychange", () => {
  // Al volver a la pestaña se revisa de una vez, sin esperar el turno del reloj.
  if (!document.hidden && TOKEN) revisarCambios();
});

// Permisos del usuario. Si no tiene configuración propia se usan los del rol,
// así los usuarios creados antes de esta función siguen entrando igual.
let PERMISOS = {};

  "restaurantes","analitica","resumen","importar","usuarios","catalogo","publicacion"];

function puedeVer(pantalla) {
  const n = PERMISOS[pantalla];

  botones.forEach((b, i) => {

async function descargar(reporte, params, formato) {
  const qs = new URLSearchParams();
  Object.entries(params).forEach(([k, v]) => { if (v) qs.append(k, v); });
  qs.append("formato", formato);
  const res = await fetchAuth(`${API}/api/export/${reporte}?${qs.toString()}`);
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = `${reporte}.${formato}`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

// Dibuja el día como una línea de tiempo. Se usa el rango real de operación del
// lodge: del desayuno (5:45) a la cena (20:30).
function lineaDelDia(tours, conflictos, fecha) {
  const INICIO = 5 * 60 + 45, FIN = 20 * 60 + 30;
  const SPAN = FIN - INICIO;
  const min = (h) => {
    if (!h) return null;
    const p = String(h).split(":");
    return parseInt(p[0]) * 60 + parseInt(p[1] || 0);
  };
  const pos = (m) => Math.max(0, Math.min(100, ((m - INICIO) / SPAN) * 100));

  // Se agrupan por salida: mismo tour y mismo grupo operativo van juntos
  const salidas = {};
  tours.forEach(t => {
    const k = `${t.tour_codigo}|${t.grupo_operativo || 'A'}`;
    if (!salidas[k]) salidas[k] = { ...t, pax: 0, habitaciones: [] };
    salidas[k].pax += t.pax || 0;
    salidas[k].habitaciones.push(t.room_no);
  });
  let lista = Object.values(salidas)
    .map(t => ({ ...t, ini: min(t.horario_inicio), fin: min(t.horario_fin) }))
    .filter(t => t.ini !== null)
    .sort((a, b) => a.ini - b.ini);

  if (!lista.length) return "";

  const enConflicto = new Set();
  (conflictos || []).forEach(cf => {
    enConflicto.add(cf.salida_a.split(" ")[0]);
    enConflicto.add(cf.salida_b.split(" ")[0]);
  });

  // Se reparten en pistas para que dos salidas simultáneas no se tapen
  const pistas = [];
  lista.forEach(t => {
    const dur = Math.max((t.fin || t.ini + 120) - t.ini, 45);
    const item = { ...t, dur };
    let puesto = pistas.find(p => p.every(x => t.ini >= (x.ini + x.dur) || (t.ini + dur) <= x.ini));
    if (puesto) puesto.push(item); else pistas.push([item]);
  });

  const horas = [];
  for (let h = 6; h <= 20; h += 2) horas.push(h);

  const comidas = [
    { nombre: "Desayuno", ini: 5 * 60 + 45, fin: 9 * 60 },
    { nombre: "Almuerzo", ini: 12 * 60, fin: 14 * 60 },
    { nombre: "Cena", ini: 18 * 60, fin: 20 * 60 + 30 },
  ];

  // Marca de la hora actual, solo si se está viendo el día de hoy
  const ahora = new Date();
  const esHoy = fecha === hoyISO();
  const minAhora = ahora.getHours() * 60 + ahora.getMinutes();
  const mostrarAhora = esHoy && minAhora >= INICIO && minAhora <= FIN;

  return `
    <div class="jornada" style="padding-left:2px;">
      <div class="jornada-eje" style="margin-top:18px;">
        ${horas.map(h => `<div class="jornada-hora" style="left:${pos(h * 60)}%;">${h}:00</div>`).join("")}
      </div>
      <div style="position:relative;">
        <div class="jornada-comidas">
          ${comidas.map(m => `<div class="jornada-comida" style="left:${pos(m.ini)}%;width:${pos(m.fin) - pos(m.ini)}%;"><span>${m.nombre}</span></div>`).join("")}
        </div>
        ${mostrarAhora ? `<div class="jornada-ahora" style="left:${pos(minAhora)}%;" title="Ahora"></div>` : ""}
        <div class="jornada-pistas">
          ${pistas.map(p => `
            <div class="jornada-pista">
              ${p.map(t => {
                // Solo se marca como incompleto si falta lo que ese tour realmente
                // necesita: las caminatas y actividades en el lodge no llevan bote.
                const faltaBote = t.requiere_bote && !t.bote_nombre;
                const clase = enConflicto.has(t.tour_codigo) ? "conflicto"
                            : ((!t.guia_nombre || faltaBote) ? "sin-asignar" : "");
                const grupo = (t.grupo_operativo && t.grupo_operativo !== "A") ? ` ${t.grupo_operativo}` : "";
                const quien = [t.guia_nombre, t.bote_nombre].filter(Boolean).join(" · ") || "sin asignar";
                return `<div class="jornada-tour ${clase}"
                    style="left:${pos(t.ini)}%;width:${Math.max(pos(t.ini + t.dur) - pos(t.ini), 6)}%;"
                    title="${t.tour_codigo}${grupo} · ${t.horario_inicio}–${t.horario_fin || ''} · ${t.pax} pax · ${quien} · Hab. ${t.habitaciones.join(", ")}"
                    onclick="loadAgenda('${fecha}')">
                    <b>${t.tour_codigo}${grupo} <span style="font-weight:400;opacity:.8;">${t.pax}p</span></b>
                    <small>${t.horario_inicio} · ${quien}</small>
                  </div>`;
              }).join("")}
            </div>`).join("")}
        </div>
      </div>
      <div class="jornada-leyenda">
        <span><i style="background:var(--forest);"></i>Asignado</span>
        <span><i style="background:#8B7B4E;"></i>Falta guía o bote</span>
        <span><i style="background:#9B2C2C;"></i>Conflicto de horario</span>
        ${mostrarAhora ? '<span><i style="background:#B91C1C;border-radius:50%;width:8px;height:8px;"></i>Ahora</span>' : ""}
      </div>
    </div>`;
}

function mostrarListaDash(campo) {
  const panel = document.getElementById("dash-detalle");
  // Si se vuelve a tocar la misma tarjeta, se cierra el detalle
  if (window._dashAbierto === campo) {
    window._dashAbierto = null;
    panel.innerHTML = "";
    document.querySelectorAll(".stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._dashAbierto = campo;
  document.querySelectorAll(".stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");
  const d = window._dashData;
  if (campo === "alertas") {
    panel.innerHTML = `<div class="detail-panel">${d.alertas.length ? d.alertas.map(a => `<p class="note-line">⚠ ${a.mensaje}</p>`).join("") : "Sin alertas activas."}</div>`;
    return;
  }
  const titulo = {entran_hoy:"Entran hoy", salen_hoy:"Salen hoy", en_casa:"En casa"}[campo];
  const lista = d[campo];
  panel.innerHTML = `
    <div class="detail-panel">
      <p style="font-weight:600;margin:0 0 8px;">${titulo} (${lista.length})</p>
      ${lista.length ? lista.map(r => `
        <div style="border-bottom:1px solid var(--border); padding:8px 0;">
          <p style="margin:0;font-weight:600;">${r.nombre_principal} · Hab. ${r.room_no} <span style="font-weight:400;color:var(--muted);">(${r.adl+r.chl} pax)</span></p>
          <p style="margin:2px 0 6px;color:var(--muted);">Ingreso: ${r.arr_date} · Salida: ${r.dep_date}</p>
          <p style="margin:0;">${r.notas_libres ? r.notas_libres.slice(0,180) + (r.notas_libres.length>180 ? "…" : "") : "Sin notas."}</p>
        </div>`).join("") : "<p class=\"empty\">Sin registros.</p>"}
    </div>`;
}

// ---------- RESERVAS ----------
// Mismo manejo de fechas que Agenda y Transporte: abre en el día de hoy y desde ahí
// se puede mover de día o pasar a un rango. `fecha` nula significa "ver rango".
async function loadReservas(fecha, desde, hasta) {
  setActive(1);
  const F = FILTROS.reservas;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desde) F.desde = desde;
  if (hasta) F.hasta = hasta;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  // En vista de día se consulta ese único día: el servidor devuelve las reservas que
  // lo tocan, o sea quien entra, quien sale y quien está en casa ese día.
  desde = fecha || F.desde;
  hasta = fecha || F.hasta;
  const res = await fetchAuth(`${API}/api/reservas?desde=${desde}&hasta=${hasta}`);
  const rows = await res.json();
  // Estado del itinerario de cada reserva, para avisar si la reserva cambió
  // después de que recepción lo editó a mano.
  let estadosItin = {};
  try { estadosItin = await (await fetchAuth(`${API}/api/itinerarios/estados`)).json(); } catch (e) {}
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Reservas ${fecha ? etiquetaFecha(fecha) : ""}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadReservas(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha || ""}" onchange="loadReservas(this.value)">
          <button class="btn" onclick="loadReservas(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadReservas(hoyISO())">Hoy</button>
          <button class="btn" onclick="loadReservas(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="res-desde" value="${F.desde}">
          <input type="date" id="res-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadReservas(null, document.getElementById('res-desde').value, document.getElementById('res-hasta').value)">Ver rango</button>
          <button class="btn" onclick="descargar('reservas', {desde:'${desde}', hasta:'${hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('reservas', {desde:'${desde}', hasta:'${hasta}'}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      <table>
        <tr><th>N° Reserva</th><th>Hab.</th><th>Huésped</th><th>Fechas</th><th>Pax</th><th>Estatus</th><th>Grupo</th><th>Itinerario</th></tr>
        ${rows.map(r => { const e = estadoReserva(r); return `
          <tr class="${e.clase}">
            <td><a href="#" onclick="verDetalleReserva('${r.conf_no}'); return false;" style="color:var(--forest);font-weight:600;text-decoration:underline;cursor:pointer;">${r.conf_no}</a></td>
            <td>${r.room_no}${etiquetaGrupo(r.conf_no)}</td>
            <td>${r.nombre_principal}</td>
            <td>${r.arr_date} – ${r.dep_date}</td>
            <td>${r.adl + r.chl}</td>
            <td><strong>${e.etiqueta}</strong><br><span style="font-size:11px;color:var(--muted);">${r.res_status}</span></td>
            <td>${r.confianza ? `<span class="badge ${r.confianza === 'ALTA' ? 'badge-ok' : 'badge-warn'}">${r.confianza}${r.confirmado_por_recepcion ? '' : ' · sin confirmar'}</span>` : "—"}</td>
            <td>${(() => {
              const e = estadosItin[r.conf_no];
              if (e && e.aviso_cambios) return `<button class="btn" style="background:var(--warn-bg);border-color:#E5C07B;color:var(--warn-text);font-weight:600;" onclick="abrirItinerario('${r.conf_no}')" title="La reserva cambió después de editar el itinerario">⚠ Revisar</button>`;
              const idi = e && e.idioma && e.idioma !== "en" ? ` ${e.idioma.toUpperCase()}` : "";
              if (e && e.editado) return `<button class="btn" onclick="abrirItinerario('${r.conf_no}')">Editado${idi}</button>`;
              return `<button class="btn" onclick="abrirItinerario('${r.conf_no}')">Ver${idi}</button>`;
            })()}</td>
          </tr>`; }).join("")}
      </table>
      <div class="leyenda">
        <span><i style="background:#FFF8DC;"></i>Entra hoy</span>
        <span><i style="background:#FDE8E8;"></i>Sale hoy</span>
        <span><i style="background:#E6F0FA;"></i>En casa</span>
        <span><i style="background:#E8F5E9;"></i>Por ingresar</span>
        <span><i style="background:#F2F2F0;"></i>Ya salió</span>
      </div>
      ${puedeEscribir("reservas") ? `
      <div style="margin-top:16px;">
        ${rows.filter(r => r.grupo_id && !r.confirmado_por_recepcion).map(r => `
          <div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;">
            <span style="color:var(--warn-text);">⚠ Grupo sugerido para ${r.nombre_principal} (hab. ${r.room_no})</span>
            <button class="btn" style="margin-left:8px;" onclick="confirmarGrupo(${r.grupo_id}, true)">Confirmar grupo</button>
            <button class="btn" onclick="confirmarGrupo(${r.grupo_id}, false)">No vincular</button>
          </div>`).join("")}
        ${rows.filter(r => r.guia_sugerido && !r.guia_confirmado).map(r => `
          <div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;">
            <span style="color:var(--warn-text);">⚠ Guía sugerido para ${r.nombre_principal} (hab. ${r.room_no}): ${r.guia_sugerido}</span>
            <button class="btn" style="margin-left:8px;" onclick="confirmarGuia('${r.conf_no}', null, true)">Confirmar guía</button>
          </div>`).join("")}
      </div>` : ""}
    </div>
  `;
}

async function confirmarGrupo(grupoId, confirmar) {
  await fetchAuth(`${API}/api/grupos/${grupoId}/confirmar?confirmar=${confirmar}`, { method: "POST" });
  avisar(confirmar ? "Grupo confirmado" : "Grupo desvinculado");
  loadReservas();
}

async function confirmarGuia(confNo, guia, confirmar) {
  const params = new URLSearchParams({ confirmar });
  if (guia) params.append("guia", guia);
  await fetchAuth(`${API}/api/reservas/${confNo}/guia?${params.toString()}`, { method: "POST" });
  avisar("Guía confirmado");
  loadReservas();
}

function estadoReserva(r) {
  // Convierte 'DD-MM-YY' a 'YYYY-MM-DD' para comparar correctamente
  const aIso = (f) => { if (!f) return null; const [d,m,y] = f.split("-"); return `20${y}-${m}-${d}`; };
  const hoy = hoyISO();
  const llega = aIso(r.arr_date), sale = aIso(r.dep_date);
  if (sale && sale < hoy)  return { clase: "fila-salio",       etiqueta: "Ya salió" };
  if (sale === hoy)        return { clase: "fila-sale",        etiqueta: "Sale hoy" };
  if (llega === hoy)       return { clase: "fila-entra",       etiqueta: "Entra hoy" };
  if (llega && llega > hoy) return { clase: "fila-poringresar", etiqueta: "Por ingresar" };
  return { clase: "fila-encasa", etiqueta: "En casa" };
}

async function abrirItinerario(confNo) {
  const d = await (await fetchAuth(`${API}/api/reservas/${confNo}/itinerario`)).json();
  window._itin = d;
  const modal = document.createElement("div");
  modal.className = "modal-fondo";
  modal.id = "modal-itin";
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  const colorEstado = { LISTO: "badge-ok", REVISAR: "badge-warn", EDITADO: "badge-tour" };
  modal.innerHTML = `
    <div class="modal-caja" style="max-width:1000px;">
      <button class="modal-cerrar" onclick="this.closest('.modal-fondo').remove()">×</button>
      <p style="font-weight:600;font-size:18px;margin:0;color:var(--forest-dark);">Itinerario de bienvenida</p>
      <p style="font-size:13px;color:var(--muted);margin:2px 0 12px;">
        Reserva ${d.conf_no} · <span class="badge ${colorEstado[d.estado]}">${d.estado}</span>
      </p>

      <div class="modal-seccion" style="margin-top:8px;">
        <h4>Idioma del documento</h4>
        <div class="filterbar">
          <select id="it-idioma" onchange="cambiarIdiomaItinerario('${d.conf_no}', this.value)" style="width:190px;">
            ${Object.entries(d.idiomas || {}).map(([cod, nombre]) =>
              `<option value="${cod}" ${d.idioma === cod ? "selected" : ""}>${nombre}</option>`).join("")}
          </select>
          <span style="font-size:11px;color:var(--muted);">
            Se traducen los textos del catálogo. Lo que escribas a mano queda en el idioma en que lo escribas.
          </span>
        </div>
      </div>

      <div class="modal-seccion">
        <h4>Nombres del huésped (título del documento)</h4>
        <div class="filterbar">
          <input type="text" id="it-nombre" value="${(d.nombre_bienvenida||"").replace(/"/g,'&quot;')}" style="width:320px;">
        </div>
      </div>

      ${d.aviso_cambios ? `<div style="background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:12px 14px;margin-top:12px;font-size:13px;">
        <p style="margin:0 0 8px;font-weight:600;">⚠ La reserva cambió después de editar este itinerario</p>
        <p style="margin:0 0 10px;">${d.aviso_cambios}</p>
        <button class="btn btn-primary" onclick="incorporarCambios('${d.conf_no}')">Incorporar lo que falta</button>
        <button class="btn" onclick="regenerarItinerario('${d.conf_no}')">Rehacer todo desde cero</button>
        <p style="margin:8px 0 0;font-size:11px;">"Incorporar" agrega solo lo nuevo y conserva tus ediciones. "Rehacer" descarta las ediciones manuales.</p>
      </div>` : ""}

      ${d.avisos && d.avisos.length ? `<div style="background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:12px;">
        <strong>Falta completar:</strong><br>${d.avisos.join("<br>")}
      </div>` : ""}

      <div class="modal-seccion">
        <h4>Itinerario — puedes editar cualquier campo</h4>
        <table style="font-size:12px;" id="it-tabla">
          <tr><th style="width:90px;">Día</th><th style="width:150px;">Actividad</th><th style="width:80px;">Duración</th><th>Horario</th><th>Detalles</th><th></th></tr>
          ${d.filas.map((f, i) => filaItinerarioHTML(f, i)).join("")}
        </table>
        <button class="btn" style="margin-top:8px;" onclick="agregarFilaItinerario()">+ Agregar fila</button>
      </div>

      <div style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);padding-top:12px;margin-top:16px;">
        <button class="btn" onclick="regenerarItinerario('${d.conf_no}')">Rehacer automático</button>
        <button class="btn" onclick="guardarItinerario('${d.conf_no}')">Guardar cambios</button>
        <button class="btn btn-primary" onclick="descargarItinerario('${d.conf_no}')">⬇ Descargar PDF</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

function filaItinerarioHTML(f, i) {
  const ta = (campo, valor, filas) => `<textarea data-campo="${campo}" data-i="${i}" rows="${filas}" style="width:100%;font-size:12px;font-family:inherit;border:1px solid var(--border);border-radius:5px;padding:4px;resize:vertical;">${valor || ""}</textarea>`;
  return `<tr data-fila="${i}" ${f.revisar ? 'style="background:var(--warn-bg);"' : ""}>
    <td>${ta("dia", f.dia, 2)}</td>
    <td>${ta("actividad", f.actividad, 3)}</td>
    <td>${ta("duracion", f.duracion, 2)}</td>
    <td>${ta("horario", f.horario, 3)}</td>
    <td>${ta("detalles", f.detalles, 4)}</td>
    <td><button class="btn" onclick="quitarFilaItinerario(${i})">Quitar</button></td>
  </tr>`;
}

function leerFilasItinerario() {
  const filas = [];
  document.querySelectorAll("#it-tabla tr[data-fila]").forEach(tr => {
    const f = {};
    tr.querySelectorAll("textarea").forEach(t => { f[t.dataset.campo] = t.value; });
    filas.push(f);
  });
  return filas;
}

function agregarFilaItinerario() {
  const filas = leerFilasItinerario();
  filas.push({ dia: "", actividad: "", duracion: "", horario: "", detalles: "" });
  window._itin.filas = filas;
  redibujarTablaItinerario(filas);
}

function quitarFilaItinerario(i) {
  const filas = leerFilasItinerario();
  filas.splice(i, 1);
  window._itin.filas = filas;
  redibujarTablaItinerario(filas);
}

function redibujarTablaItinerario(filas) {
  document.getElementById("it-tabla").innerHTML =
    `<tr><th style="width:90px;">Día</th><th style="width:150px;">Actividad</th><th style="width:80px;">Duración</th><th>Horario</th><th>Detalles</th><th></th></tr>`
    + filas.map((f, i) => filaItinerarioHTML(f, i)).join("");
}

async function cambiarIdiomaItinerario(confNo, idioma) {
  const payload = {
    nombre_bienvenida: document.getElementById("it-nombre").value.trim(),
    filas: leerFilasItinerario(),
    idioma,
  };
  await fetchAuth(`${API}/api/reservas/${confNo}/itinerario`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  const nombres = { en: "inglés", es: "español", pt: "portugués", fr: "francés", ru: "ruso" };
  avisar(`Itinerario en ${nombres[idioma] || idioma}`);
  document.getElementById("modal-itin")?.remove();
  abrirItinerario(confNo);
}

async function guardarItinerario(confNo) {
  const payload = {
    nombre_bienvenida: document.getElementById("it-nombre").value.trim(),
    filas: leerFilasItinerario(),
    idioma: document.getElementById("it-idioma")?.value || "en",
  };
  await fetchAuth(`${API}/api/reservas/${confNo}/itinerario`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  document.getElementById("modal-itin")?.remove();
  abrirItinerario(confNo);
}

async function incorporarCambios(confNo) {
  const res = await fetchAuth(`${API}/api/reservas/${confNo}/itinerario/incorporar`, { method: "POST" });
  const d = await res.json();
  avisar("Itinerario guardado");
  document.getElementById("modal-itin")?.remove();
  abrirItinerario(confNo);
}

async function regenerarItinerario(confNo) {
  if (!confirm("Esto descarta las ediciones manuales y vuelve a armar el itinerario desde la reserva. ¿Continuar?")) return;
  await fetchAuth(`${API}/api/reservas/${confNo}/itinerario/regenerar`, { method: "POST" });
  document.getElementById("modal-itin")?.remove();
  abrirItinerario(confNo);
}

async function descargarItinerario(confNo) {
  const res = await fetchAuth(`${API}/api/reservas/${confNo}/itinerario/pdf`);
  const blob = await res.blob();
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = `Itinerary_${confNo}.pdf`;
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

        · <span class="badge badge-ok">${r.res_status}</span>
      </p>

      <div class="modal-seccion">

        <p class="modal-dato"><strong>Ingreso:</strong> ${r.arr_date}${r.arr_time ? ` a las ${r.arr_time}` : ""} · <strong>Salida:</strong> ${r.dep_date}</p>
        <p class="modal-dato"><strong>Transporte:</strong> entrada ${r.punto_entrada || "—"}${r.hora_vuelo_entrada ? ` (${r.hora_vuelo_entrada})` : ""} · salida ${r.punto_salida || "—"}${r.hora_vuelo_salida ? ` (${r.hora_vuelo_salida})` : ""}</p>

            <span class="badge badge-tour">${a.amenidad}</span>
