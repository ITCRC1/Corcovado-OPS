async function cambiarRestaurante(fecha, confNo, comida, restaurante) {
  // Destildar la casilla saca una sola habitación del grupo. Por defecto van todas: el
  // reparto automático no separa a un grupo, y el botón tampoco debería.
  const todos = document.getElementById("mover-todo-el-grupo");
  const res = await fetchAuth(`${API}/api/restaurantes/cambiar`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fecha, conf_no: confNo, comida, restaurante,
                           solo_esta: !!(todos && !todos.checked) }),
  });
  if (!res.ok) { avisar((await res.json()).detail || "No se pudo cambiar", true); return; }
  const d = await res.json();

  // Un solo cartel, como en la hora: avisar() reutiliza el mismo elemento y dos seguidos
  // se pisan. Se dice a quién se llevó y a quién NO, porque lo segundo es lo que hay que
  // mirar antes de sentar a la gente.
  const habs = (d.grupo || []).map(c => `hab. ${c.room_no || "?"}`).join(", ");
  const exc = (d.excepciones || []).map(c => `hab. ${c.room_no || "?"} (${c.motivo})`);
  let msg = `Cambiado a ${restaurante}`;
  if (habs) msg += ` — con el grupo: ${habs}`;
  if (exc.length) msg += `. Sin mover: ${exc.join(", ")}`;
  if (d.aviso_capacidad) msg += `. ${d.aviso_capacidad}`;
  avisar(msg, !!(d.aviso_capacidad || exc.length));
  loadRestaurantes();
}

async function guardarHoraMesa(fecha, confNo, hora) {
  // Destildar la casilla del panel es partir la mesa: se guarda solo esta habitación.
  const todos = document.getElementById("hora-toda-la-mesa");
  const res = await fetchAuth(`${API}/api/restaurantes/hora`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fecha, conf_no: confNo, hora,
                           solo_esta: !!(todos && !todos.checked) }),
  });
  if (!res.ok) { avisar("No se pudo guardar la hora", true); return; }
  const d = await res.json();

  // Las habitaciones del grupo se actualizan aquí mismo, sin recargar la pantalla: si
  // el panel se cerrara en cada hora que escribe, el salonero tendría que volver a
  // abrirlo para la mesa siguiente.
  (d.grupo || []).forEach(c => document.querySelectorAll(`input[data-hora="${c.conf_no}"]`)
    .forEach(i => { i.value = d.hora || ""; }));

  // Un solo cartel: avisar() reutiliza el mismo elemento, así que dos seguidos se pisan
  // y el salonero solo alcanzaría a leer el segundo.
  const habs = (d.grupo || []).map(c => c.room_no || "?").join(", ");
  const exc = (d.excepciones || []).map(c => `hab. ${c.room_no || "?"} sigue a las ${c.hora}`);
  let msg = hora ? `Mesa a las ${hora}` : "Hora borrada";
  if (habs) msg += ` — también la hab. ${habs} del grupo`;
  // Una hora distinta puesta a mano no se pisa; se avisa para que sea una decisión.
  if (exc.length) msg += `. Sin cambiar: ${exc.join(", ")}`;
  avisar(msg, exc.length > 0);
}

// '28-08-26' -> '2026-08-28'. Las fechas de la reserva llegan en el formato del reporte
// y el selector de fecha del navegador necesita ISO.
function isoDeDDMMYY(texto) {
  const p = String(texto || "").split("-");
  if (p.length !== 3 || p[2].length !== 2) return "";
  return `20${p[2]}-${p[1]}-${p[0]}`;
}

async function copiarEnlaceHk(i) {

async function loadHousekeeping(fecha, desde, hasta) {
  setActive(14);
  const F = FILTROS.housekeeping;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desde && hasta) { F.desde = desde; F.hasta = hasta; F.modo = "rango"; }
  fecha = F.modo === "dia" ? F.fecha : null;
  const d1 = fecha || F.desde, d2 = fecha || F.hasta;

  const d = await (await fetchAuth(
    `${API}/api/housekeeping/pedidos?${new URLSearchParams({ desde: d1, hasta: d2 })}`)).json();
  window._hkData = d;
  const pedidos = d.pedidos || [];
  const cfg = d.config || {};

  const porConfirmar = pedidos.filter(p => p.estado === "SOLICITADO");
  const enCurso = pedidos.filter(p => p.estado === "CONFIRMADO" || p.estado === "RECOGIDO");
  const entregadas = pedidos.filter(p => p.estado === "ENTREGADO");
  const piezas = pedidos.filter(p => p.estado !== "CANCELADO")
                        .reduce((a, p) => a + (p.total_prendas || 0), 0);

  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Housekeeping ${fecha ? etiquetaFecha(fecha) : ""}</p>

          <button class="btn" onclick="loadHousekeeping(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>

          <button class="btn" onclick="loadHousekeeping(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>

          ${puedeEscribir("housekeeping") ? `

            <button class="btn" onclick="mostrarHorarioHk()">Horario y prendas</button>` : ""}

      </div>
      <div class="stats" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat" style="cursor:default;"><p class="stat-label">Por confirmar</p>
          <p class="stat-value" style="color:var(--warn-text);">${porConfirmar.length}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">En curso</p>
          <p class="stat-value" style="color:var(--ok-text);">${enCurso.length}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Entregadas</p>
          <p class="stat-value">${entregadas.length}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Piezas</p>
          <p class="stat-value">${piezas}</p></div>
      </div>
      <p class="subtitle" style="margin-bottom:12px;">
        Se recoge de ${cfg.abre || "?"} a ${cfg.cierra || "?"}${cfg.hora_tope_mismo_dia

      ${pedidos.length ? `
        <table style="font-size:12.5px;">

              <th style="width:62px;">Hab.</th><th>Huésped</th><th>Prendas</th>
              <th style="width:130px;text-align:right;">Total</th>
              <th style="width:112px;">Estado</th>
              ${puedeEscribir("housekeeping") ? "<th style='width:190px;'></th>" : ""}</tr>
          ${pedidos.map(filaPedidoHk).join("")}
        </table>`
        : `<p class="empty">No hay ropa en estas fechas.<small>El huésped manda la suya por el enlace, que se copia con «🔗 Enlace para el huésped».</small></p>`}
    </div>`;
}

function filaPedidoHk(p) {
  const e = ESTADOS_HK[p.estado] || ESTADOS_HK.SOLICITADO;
  const siguiente = SIGUIENTE_HK[p.estado];
  const apagada = p.estado === "CANCELADO";
  // El plazo se muestra tal como se le PROMETIÓ al huésped al pedirlo. Si mañana se
  // cambia la hora tope, lo prometido ayer no cambia — por eso viene del pedido y no se
  // recalcula aquí.
  const plazo = p.mismo_dia === 1 ? "vuelve hoy"
              : p.mismo_dia === 0 ? "vuelve al día siguiente" : "";
  return `<tr style="${apagada ? "opacity:.5;" : ""}">
    <td>${escaparHTML(p.fecha || "")}</td>
    <td>${escaparHTML(p.hora || "—")}</td>
    <td><strong>${escaparHTML(p.room_no || "?")}</strong></td>
    <td>${escaparHTML(p.nombre_huesped || "")}
      ${p.nota_huesped ? `<br><span style="font-size:11px;color:var(--muted);">“${escaparHTML(p.nota_huesped)}”</span>` : ""}
      ${p.nota_operacion ? `<br><span style="font-size:11px;color:var(--muted);">${escaparHTML(p.nota_operacion)}</span>` : ""}</td>
    <td>${escaparHTML(p.resumen || "—")}
      ${plazo ? `<br><span style="font-size:11px;color:var(--muted);">${plazo}</span>` : ""}</td>
    <td style="text-align:right;font-variant-numeric:tabular-nums;">
      ${p.total ? `<strong>${escaparHTML(p.total)}</strong>${p.iva_centavos
          // El desglose, con el porcentaje que se le cobró a ESTE pedido: es lo que hay
          // que poder leer cuando el huésped pregunta por qué el total no es la suma de
          // las prendas.
          ? `<br><span style="font-size:10.5px;color:var(--muted);white-space:nowrap;">${escaparHTML(p.subtotal)} + IVA ${escaparHTML(p.iva_porcentaje)}% ${escaparHTML(p.iva)}</span>`
          : ""}`
        : p.total_incompleto
          ? `<span style="font-size:11px;color:var(--warn-text);">a consultar</span>`
          : `<span style="color:var(--muted);">—</span>`}</td>
    <td><span style="background:${e.fondo};color:${e.color};padding:2px 8px;border-radius:var(--r-pill);font-size:11px;font-weight:600;white-space:nowrap;">${e.texto}</span></td>
    ${puedeEscribir("housekeeping") ? `<td>
      ${siguiente ? `<button class="btn btn-primary" style="padding:4px 9px;font-size:11.5px;"
          onclick="pasarPedidoHk(${p.id}, '${siguiente}')">${VERBO_HK[siguiente]}</button>` : ""}
      ${!apagada ? `<button class="btn" style="padding:4px 9px;font-size:11.5px;"
          onclick="notaPedidoHk(${p.id})">Nota</button>` : ""}
      ${!apagada ? `<button class="btn" style="padding:4px 9px;font-size:11.5px;"
          onclick="cancelarPedidoHk(${p.id})">Cancelar</button>` : ""}
    </td>` : ""}
  </tr>`;
}

async function pasarPedidoHk(id, estado) {
  const res = await fetchAuth(`${API}/api/housekeeping/pedidos/${id}/estado`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ estado }),
  });
  if (!res.ok) return avisar((await res.json().catch(() => ({}))).detail || "No se pudo", true);
  avisar(`Marcado como ${(ESTADOS_HK[estado] || {}).texto || estado}`);
  loadHousekeeping();
}

async function cancelarPedidoHk(id) {
  const motivo = prompt("¿Por qué se cancela? (lo verá quien revise después)");
  if (motivo === null) return;
  const res = await fetchAuth(`${API}/api/housekeeping/pedidos/${id}/estado`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ estado: "CANCELADO", motivo }),
  });
  if (!res.ok) return avisar((await res.json().catch(() => ({}))).detail || "No se pudo", true);
  avisar("Pedido cancelado");
  loadHousekeeping();
}

async function notaPedidoHk(id) {
  const pedido = ((window._hkData || {}).pedidos || []).find(p => p.id === id) || {};
  const nota = prompt("Nota de housekeeping:", pedido.nota_operacion || "");
  if (nota === null) return;
  const res = await fetchAuth(`${API}/api/housekeeping/pedidos/${id}/nota`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nota }),
  });
  if (!res.ok) return avisar("No se pudo guardar la nota", true);
  avisar("Nota guardada");
  loadHousekeeping();
}

// ---------- El horario y las prendas ----------

async function mostrarHorarioHk() {
  const d = await (await fetchAuth(`${API}/api/housekeeping/catalogo`)).json();
  const c = d.config || {};
  // El precio va como campo editable en la propia fila y no en una ventana aparte:
  // cargar la lista es teclear ocho números seguidos, y abrir un diálogo por prenda lo
  // haría tres veces más lento. Se guarda al salir del campo.
  const prendas = (d.prendas || []).map(p => `<tr style="${p.activo ? "" : "opacity:.5;"}">
      <td style="font-family:monospace;font-size:11px;">${escaparHTML(p.codigo)}</td>
      <td>${escaparHTML(p.nombre)}</td>
      <td style="color:var(--muted);">${escaparHTML(p.nombre_en || "")}</td>
      <td><input value="${p.precio_centavos == null ? "" : (p.precio_centavos / 100).toFixed(2)}"
            placeholder="—" inputmode="decimal"
            style="width:76px;text-align:right;font-size:12.5px;padding:3px 6px;"
            onchange="precioPrendaHk('${escaparHTML(p.codigo)}', this)"></td>
      <td><button class="btn" style="padding:3px 8px;font-size:11px;"
            onclick="estadoPrendaHk('${escaparHTML(p.codigo)}', ${p.activo ? 0 : 1})">
          ${p.activo ? "Apagar" : "Encender"}</button></td>
    </tr>`).join("");

  modalHk(`
    <p style="font-weight:600;font-size:17px;margin:0;color:var(--forest-dark);">Horario y prendas</p>
    <p style="font-size:13px;color:var(--muted);margin:2px 0 12px;">
      El horario decide qué horas se le ofrecen al huésped. La hora tope es la que le dice
      si su ropa vuelve el mismo día: es lo único que él gana llenando el formulario, así
      que conviene que sea la de verdad.</p>
    <div style="display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:10px;">
      <label>Se recoge desde<input type="time" id="hk-abre" value="${escaparHTML(c.abre || "07:00")}"></label>
      <label>hasta<input type="time" id="hk-cierra" value="${escaparHTML(c.cierra || "18:00")}"></label>
      <label>Hora tope para volver el mismo día
        <input type="time" id="hk-tope" value="${escaparHTML(c.hora_tope_mismo_dia || "")}"></label>
      <label>Cada cuántos minutos se ofrece una hora
        <input type="number" id="hk-paso" min="5" max="120" value="${c.paso_minutos ?? 30}"></label>
      <label>IVA (%)
        <input id="hk-iva" inputmode="decimal" placeholder="13"
               value="${c.iva_porcentaje ?? ""}"></label>
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;">
      Dejar la hora tope vacía significa que no se promete plazo, y entonces la página del
      huésped no le dice nada sobre cuándo vuelve.</p>
    <p style="font-size:11.5px;color:var(--muted);margin:4px 0 0;">
      El IVA se le suma al subtotal y le aparece al huésped como su propio renglón, con el
      porcentaje escrito. En 0 —o vacío— no se cobra impuesto y el huésped solo ve el
      total. <strong>El porcentaje se congela en cada pedido:</strong> si mañana cambia, un
      pedido de ayer sigue diciendo el que se le cobró.</p>
    <button class="btn btn-primary" style="margin-top:12px;" onclick="guardarHorarioHk()">Guardar horario</button>

    <p style="font-weight:600;font-size:15px;margin:22px 0 2px;color:var(--forest-dark);">Prendas</p>
    <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px;">
      Las que ve el huésped en su formulario. Apagar una no borra los pedidos viejos:
      siguen diciendo qué se recogió.</p>
    <table style="font-size:12.5px;">
      <tr><th style="width:80px;">Código</th><th>Nombre</th><th>En inglés</th>
          <th style="width:86px;">Precio ($)</th><th style="width:90px;"></th></tr>
      ${prendas}
    </table>
    <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;">
      El precio es por pieza, en dólares, y el formulario del huésped multiplica por la

      «a consultar» en vez de como cero. <strong>Cambiar un precio afecta a los pedidos

    <div style="display:grid;grid-template-columns:90px 1fr 1fr 86px auto;gap:8px;margin-top:12px;">
      <input id="hk-p-cod" placeholder="CÓDIGO" style="text-transform:uppercase;">
      <input id="hk-p-nom" placeholder="Nombre en español">
      <input id="hk-p-en" placeholder="Name in English">
      <input id="hk-p-precio" placeholder="0.00" inputmode="decimal" style="text-align:right;">
      <button class="btn btn-primary" onclick="agregarPrendaHk()">Agregar</button>
    </div>
  `);

async function guardarHorarioHk() {
  const res = await fetchAuth(`${API}/api/housekeeping/config`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      abre: document.getElementById("hk-abre").value,
      cierra: document.getElementById("hk-cierra").value,
      hora_tope_mismo_dia: document.getElementById("hk-tope").value,
      paso_minutos: Number(document.getElementById("hk-paso").value) || 30,
      // Va como texto, sin Number(): vacío tiene que llegar vacío para que el servidor lo
      // entienda como «sin impuesto». Un Number("") es 0 y daría lo mismo, pero un
      // Number("13,5") es NaN y ahí se perdería lo que la persona escribió.
      iva_porcentaje: document.getElementById("hk-iva").value,
    }),
  });
  if (!res.ok) return avisar((await res.json().catch(() => ({}))).detail || "No se pudo", true);
  avisar("Horario guardado");
  cerrarModalHk();
  loadHousekeeping();
}

async function agregarPrendaHk() {
  const codigo = (document.getElementById("hk-p-cod").value || "").trim().toUpperCase();
  const nombre = (document.getElementById("hk-p-nom").value || "").trim();
  if (!codigo || !nombre) return avisar("Hacen falta el código y el nombre", true);
  const res = await fetchAuth(`${API}/api/housekeeping/prenda`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      codigo, nombre,
      nombre_en: (document.getElementById("hk-p-en").value || "").trim(),
      precio: (document.getElementById("hk-p-precio").value || "").trim(),
    }),
  });
  if (!res.ok) return avisar((await res.json().catch(() => ({}))).detail || "No se pudo", true);
  avisar("Prenda agregada");
  mostrarHorarioHk();
}

async function precioPrendaHk(codigo, campo) {
  const res = await fetchAuth(`${API}/api/housekeeping/prenda/${codigo}/editar`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ precio: campo.value }),
  });
  if (!res.ok) {
    avisar((await res.json().catch(() => ({}))).detail || "No se pudo guardar", true);
    campo.focus();
    return;
  }
  // No se vuelve a dibujar la ventana: quien está cargando la lista está tecleando
  // precio tras precio, y redibujar le sacaría el cursor de la fila siguiente.
  avisar(`Precio de ${codigo} guardado`);
}

async function estadoPrendaHk(codigo, activo) {
  const res = await fetchAuth(`${API}/api/housekeeping/prenda/${codigo}/estado`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ activo: !!activo }),
  });
  if (!res.ok) return avisar("No se pudo", true);
  mostrarHorarioHk();
}


// Si el huésped se cambió de cuarto después de pedir la cita, se muestra el de AHORA
// —es donde la terapeuta tiene que ir— y se señala de dónde venía. Cambiar el número
// en silencio dejaría a quien lo anotó en un papel buscando en el cuarto equivocado.
function cambioDeCuarto(c) {
  if (!c.room_no_pedida || c.room_no_pedida === c.room_no) return "";
  return `<br><span style="font-size:10px;color:var(--warn-text);"
    title="El huésped se cambió de cuarto después de pedir la cita">se cambió de la ${escaparHTML(c.room_no_pedida)}</span>`;
}

// Los tratamientos del catálogo, para poder cambiar el de una cita sin cancelarla.
//
// Lo pidió el lodge: «editar el tipo de masaje en caso que el cliente quiera cambiarlo
// y no cancelar del todo la reserva del masaje». Cancelar y volver a crear perdía la
// ficha médica —que es un consentimiento de ESA cita— y el sitio en la agenda.
//
// El que tiene puesto sale SIEMPRE, aunque ya no esté activo en el catálogo: si no,
// una cita con un tratamiento retirado mostraría otro distinto al abrir la lista, y
// bastaría con tocar cualquier cosa para cambiárselo sin querer.
function opcionesServicio(c) {
  const lista = ((_spaCat && _spaCat.servicios) || []).filter(s => s.activo !== 0);
  const actual = c.servicio_codigo || "";
  const hay = lista.some(s => s.codigo === actual);
  const todas = hay || !actual
    ? lista
    : [{ codigo: actual, nombre: c.servicio_nombre || actual, minutos: c.minutos }]
        .concat(lista);
  return todas.map(s =>
    `<option value="${escaparHTML(s.codigo)}" ${s.codigo === actual ? "selected" : ""}>`
    + `${escaparHTML(s.nombre || s.codigo)}${s.minutos ? ` · ${s.minutos}′` : ""}</option>`
  ).join("");
}

function filaCitaSpa(c, terapeutas) {
  const [clase, texto] = ESTADO_SPA[c.estado] || ["badge-tour", c.estado];
  const apagada = c.estado === "CANCELADA" || c.estado === "HECHA";
  const opciones = ['<option value="">sin asignar</option>']
    .concat(terapeutas.map(t =>
      `<option value="${escaparHTML(t)}" ${c.terapeuta === t ? "selected" : ""}>${escaparHTML(t)}</option>`))
    .join("");
  return `
    <tr class="${apagada ? "fila-salio" : ""}" ${(c.choques || []).length ? 'style="background:var(--warn-bg);"' : ""}>
      <td>${c.fecha}</td>
      <td>${puedeEscribir("spa") && !apagada
        ? `<input type="time" value="${c.hora || ""}"
             onchange="moverCita(${c.id}, {hora: this.value})"
             style="font-size:11.5px;padding:2px 4px;width:88px;">`
        : (c.hora || '<span style="color:var(--warn-text);font-size:11px;">sin hora</span>')}</td>
      <td><strong>${escaparHTML(c.room_no || "—")}</strong>${c.conf_no ? etiquetaGrupo(c.conf_no) : ""}
        ${cambioDeCuarto(c)}</td>
      <td>${escaparHTML(c.nombre_huesped || c.nombre_principal || "")}
        ${c.origen === "HUESPED" ? '<br><span style="font-size:10px;color:var(--muted);">lo pidió el huésped</span>' : ""}</td>
      <td>${puedeEscribir("spa") && !apagada
        ? `<select onchange="moverCita(${c.id}, {servicio: this.value})"
             title="Cambiar el tratamiento sin perder la cita ni la ficha médica"
             style="font-size:11.5px;width:160px;">${opcionesServicio(c)}</select>`
        : `<span class="badge badge-tour">${escaparHTML(c.servicio_nombre || c.servicio_codigo || "")}</span>`}
        <span style="font-size:10.5px;color:var(--muted);">${c.minutos || "?"}′</span></td>
      <td>${puedeEscribir("spa") && !apagada
        ? `<select onchange="moverCita(${c.id}, {terapeuta: this.value})"
             style="font-size:11.5px;width:118px;">${opciones}</select>`
        : escaparHTML(c.terapeuta || "—")}</td>
      <td><span class="badge ${clase}">${texto}</span></td>
      ${puedeEscribir("spa") ? `<td>
        ${c.estado === "SOLICITADA" ? `<button class="btn" onclick="cambiarEstadoCita(${c.id}, 'CONFIRMADA')">Confirmar</button>` : ""}
        ${c.estado === "CONFIRMADA" ? `<button class="btn" onclick="cambiarEstadoCita(${c.id}, 'HECHA')">Atendida</button>` : ""}
        ${c.estado === "HECHA" ? `<button class="btn" onclick="cambiarEstadoCita(${c.id}, 'CONFIRMADA')">Reabrir</button>` : ""}

async function datosDeReservaSpa() {
  // Se rellena la habitación desde la reserva: es de donde sale la correcta, y evita el
  // error de teclear mal el cuarto — que es justo lo que pasaba con el formulario.
  const conf = document.getElementById("nc-conf").value.trim();
  if (!conf) return;
  try {
    const res = await fetchAuth(`${API}/api/reservas/${conf}/detalle`);
    if (!res.ok) return;
    const d = await res.json();
    const hab = (d.reserva || d).room_no;
    if (hab) document.getElementById("nc-hab").value = hab;
  } catch (e) { /* si no se puede, se escribe a mano */ }
}

async function horasLibresSpa() {
  const caja = document.getElementById("nc-libres");
  if (!caja) return;
  const fecha = document.getElementById("nc-fecha").value;
  const serv = document.getElementById("nc-serv").value;
  if (!fecha || !serv) { caja.textContent = ""; return; }
  try {
    const res = await fetchAuth(
      `${API}/api/spa/disponibilidad?${new URLSearchParams({ fecha, servicio: serv })}`);
    if (!res.ok) { caja.textContent = ""; return; }
    const d = await res.json();
    caja.innerHTML = d.horas.length
      ? `Horas libres para ${d.minutos}′: ` + d.horas.map(h =>
          `<button class="btn" onclick="document.getElementById('nc-hora').value='${h}'"
             style="font-size:10.5px;padding:1px 5px;margin:1px;">${h}</button>`).join("")
      : `<span style="color:var(--warn-text);">Ese día no queda hueco para ${d.minutos} minutos.</span>`;
  } catch (e) { caja.textContent = ""; }
}

async function crearCitaSpa() {
  const error = document.getElementById("nc-error");
  const payload = {
    conf_no: document.getElementById("nc-conf").value.trim(),
    room_no: document.getElementById("nc-hab").value.trim(),
    servicio_codigo: document.getElementById("nc-serv").value,
    fecha: document.getElementById("nc-fecha").value,
    hora: document.getElementById("nc-hora").value,
    terapeuta: document.getElementById("nc-tera").value,
  };
  if (!payload.fecha) { error.textContent = "Indica el día."; return; }
  if (!payload.conf_no && !payload.room_no) {
    error.textContent = "Indica la reserva o al menos la habitación.";
    return;
  }
  const res = await fetchAuth(`${API}/api/spa/citas`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) { error.textContent = (await res.json()).detail || "No se pudo guardar"; return; }
  const d = await res.json();
  document.getElementById("form-cita").innerHTML = "";
  avisar("Cita creada");
  // Los avisos se muestran DESPUÉS de guardar y no bloquean: el spa sabe si puede
  // absorber algo que el sistema ve apretado.
  const todos = (d.avisos || []).concat(d.avisos_salud || []);
  if (todos.length) alert("La cita quedó guardada. Revisa esto:\n\n· " + todos.join("\n· "));
  loadSpa();
}

async function moverCita(id, cambios) {
  const res = await fetchAuth(`${API}/api/spa/citas/${id}/mover`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cambios),
  });
  if (!res.ok) {
    avisar((await res.json()).detail || "No se pudo guardar el cambio", true);
    loadSpa();
    return;
  }
  const d = await res.json();
  if ((d.avisos || []).length) avisar("⚠ " + d.avisos.join(" · "), true);
  else if (d.terapeuta_sugerida) avisar(`Guardado · libre: ${d.terapeuta_sugerida}`);
  else if (cambios.servicio) avisar(`Tratamiento cambiado · ${d.minutos || "?"} min`);
  else avisar("Guardado");
  loadSpa();
}

async function cambiarEstadoCita(id, estado) {
  const res = await fetchAuth(`${API}/api/spa/citas/${id}/estado?estado=${estado}`,
                              { method: "POST" });

  avisar({ CONFIRMADA: "Cita confirmada", HECHA: "Marcada como atendida",
           SOLICITADA: "Vuelve a por confirmar" }[estado] || "Guardado");

}

async function cancelarCita(id) {

  const res = await fetchAuth(
    `${API}/api/spa/citas/${id}/estado?estado=CANCELADA&motivo=${encodeURIComponent(motivo)}`,
    { method: "POST" });

async function borrarCita(id) {

  if (!res.ok) { avisar((await res.json()).detail || "No se pudo borrar", true); return; }

  loadSpa();

        <table style="font-size:12.5px;">
          <tr><th style="width:60px;">Hab.</th><th>Huésped</th><th style="width:118px;">Estadía</th>
              <th style="width:56px;">Citas</th><th style="width:74px;">Idioma</th>
              <th style="width:96px;"></th></tr>
          ${d.huespedes.map((h, i) => `<tr>
            <td><strong>${escaparHTML(h.room_no || "—")}</strong></td>
            <td>${escaparHTML(h.nombre_principal || "")}</td>
            <td style="font-size:11.5px;">${h.arr_date} – ${h.dep_date}</td>
            <td>${h.citas || ""}</td>
            <td><select onchange="cambiarIdiomaEnlace(${i}, this.value)"
                  style="font-size:11px;width:62px;padding:1px 3px;">
                  ${["en", "es"].map(x => `<option value="${x}" ${h.idioma === x ? "selected" : ""}>${x.toUpperCase()}</option>`).join("")}
                </select></td>
            <td><button class="btn" onclick="copiarEnlaceSpa(${i})">Copiar</button></td>
          </tr>`).join("")}
        </table>
        <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0;">
          El idioma viene del <strong>itinerario</strong> de cada huésped, y se puede
          cambiar aquí antes de copiar. La página abre en inglés por omisión y el
          huésped puede cambiarla él mismo con el botón EN/ES.</p>`
        : `<p class="empty">No hay huéspedes en casa ni por llegar en las próximas dos semanas.</p>`}
    </div>`;
  document.body.appendChild(modal);
  // Se guardan la base y la ruta por separado para poder rearmar el enlace al cambiar
  // el idioma, sin volver a pedirle nada al servidor.
  window._spaEnlaces = (d.huespedes || []).map(h => ({
    base: base, conf_no: h.conf_no, token: h.token, idioma: h.idioma,
  }));
}

function urlEnlaceSpa(e) {
  // El inglés es el idioma por omisión de la página, así que no hace falta ponerlo en
  // la dirección: un enlace más corto es un enlace que no se rompe al pegarlo.
  const sufijo = e.idioma && e.idioma !== "en" ? `?idioma=${e.idioma}` : "";
  return `${e.base}/spa/${e.conf_no}/${e.token}${sufijo}`;
}

function cambiarIdiomaEnlace(i, idioma) {
  const e = (window._spaEnlaces || [])[i];
  if (e) e.idioma = idioma;
}

async function copiarEnlaceSpa(i) {
  const e = (window._spaEnlaces || [])[i];
  if (!e) return;
  const url = urlEnlaceSpa(e);
  try {
    await navigator.clipboard.writeText(url);
    avisar(`Enlace copiado en ${e.idioma.toUpperCase()} — pégalo en WhatsApp`);
  } catch (err) {
    // Sin permiso del portapapeles (pasa en algunos navegadores por http): se muestra
    // para copiarlo a mano, en vez de dejar al usuario sin nada.
    prompt("Copia este enlace:", url);
  }
}

// Mismo manejo de fechas que Agenda y Transporte: abre en el día de hoy y desde ahí
// se puede mover de día o pasar a un rango. `fecha` nula significa "ver rango".
// Aquí el rango es lo habitual —un informe de un solo día dice poco—, pero se abre
// en hoy para que todas las pantallas se comporten igual.
// Un mes de calendario COMPLETO, del 1 al último día. Importa que sea exacto: el
// informe reconoce el mes entero y entonces se compara con el mes anterior de
// calendario en vez de con «los 30 días de antes», que es lo que se quiere leer.
function verMesAnalitica(cuantosAtras) {
  const hoy = new Date();
  const ini = new Date(hoy.getFullYear(), hoy.getMonth() + cuantosAtras, 1);
  const fin = new Date(hoy.getFullYear(), hoy.getMonth() + cuantosAtras + 1, 0);
  const iso = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  loadAnalitica(null, iso(ini), iso(fin));
}

async function loadAnalitica(fecha, desdeNuevo, hastaNuevo) {
  setActive(8);
  const F = FILTROS.analitica;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desdeNuevo) F.desde = desdeNuevo;
  if (hastaNuevo) F.hasta = hastaNuevo;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  const desde = fecha || F.desde, hasta = fecha || F.hasta;
  window._boteAbierto = null; window._guiaAbierto = null;
  const res = await fetchAuth(`${API}/api/analitica?desde=${desde}&hasta=${hasta}`);
  const d = await res.json();
  let ocu = null;
  try { ocu = await (await fetchAuth(`${API}/api/ocupacion?desde=${desde}&hasta=${hasta}`)).json(); } catch (e) {}
  const app = document.getElementById("app");
  const maxBote = Math.max(...d.uso_botes.map(b => b.tours), 1);
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Analítica operativa ${fecha ? etiquetaFecha(fecha) : ""}</p>
        <div class="filterbar">

async function mostrarDetalleBote(nombre, desde, hasta) {
  // Volver a tocar el mismo bote cierra su detalle
  if (window._boteAbierto === nombre) {
    window._boteAbierto = null;
    document.getElementById("detalle-bote").innerHTML = "";
    return;
  }
  window._boteAbierto = nombre;
  const res = await fetchAuth(`${API}/api/analitica/bote/${nombre}?desde=${desde}&hasta=${hasta}`);
  const rows = await res.json();
  document.getElementById("detalle-bote").innerHTML = `
    <div class="detail-panel">
      <p style="font-weight:600;margin:0 0 8px;">Detalle: ${nombre}</p>
      <table>
        <tr><th>Fecha</th><th>Tour</th><th>Huésped</th><th>Hab.</th><th>Guía</th><th>Pax</th></tr>
        ${rows.map(r => `<tr><td>${r.fecha}</td><td>${r.tour_codigo}</td><td>${r.nombre_principal}</td><td>${r.room_no}</td><td>${r.guia_nombre||"-"}</td><td>${r.pax}</td></tr>`).join("") || `<tr><td colspan="6" class="empty">Sin registros.</td></tr>`}
      </table>
    </div>`;
}

// ---------- RESUMEN OPERACION ----------
// El mismo manejo de fechas que Reservas y Agenda: abre en el día de hoy y desde ahí se
// puede mover de día o pasar a un rango. `fecha` nula significa «ver rango».
async function loadResumenOperacion(fecha, desde, hasta) {
  setActive(9);
  const F = FILTROS.resumen;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desde) F.desde = desde;
  if (hasta) F.hasta = hasta;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  window._resAbierto = null;
  const url = fecha
    ? `${API}/api/resumen-operacion?fecha=${fecha}`
    : `${API}/api/resumen-operacion?desde=${F.desde}&hasta=${F.hasta}`;
  const d = await (await fetchAuth(url)).json();
  window._resData = d;
  document.getElementById("app").innerHTML = d.modo === "periodo"
    ? vistaResumenPeriodo(d, F) : vistaResumenDia(d, fecha, F);
}

// Los controles de fecha, iguales en las dos vistas: cambiar de una a otra no puede
// obligar a buscar los botones en otro sitio.
function barraFechasResumen(F, fecha) {
  const r = `document.getElementById('resu-desde').value, document.getElementById('resu-hasta').value`;
  return `
    <div class="filterbar">
      <button class="btn" onclick="loadResumenOperacion(shiftDate('${fecha || F.fecha}',-1))">‹</button>
      <input type="date" value="${fecha || ""}" onchange="loadResumenOperacion(this.value)">
      <button class="btn" onclick="loadResumenOperacion(shiftDate('${fecha || F.fecha}',1))">›</button>
      <button class="btn" onclick="loadResumenOperacion(hoyISO())">Hoy</button>
      <button class="btn" onclick="loadResumenOperacion(masDiasISO(1))">Mañana</button>
      <span style="color:var(--muted);">o rango:</span>
      <input type="date" id="resu-desde" value="${F.desde}">
      <input type="date" id="resu-hasta" value="${F.hasta}">
      <button class="btn${fecha ? "" : " btn-primary"}" onclick="loadResumenOperacion(null, ${r})">Ver rango</button>
    </div>`;
}

        ${tarjeta('en_casa', 'Total en casa', d.total_en_casa, d.pax_en_casa)}

      <p style="font-size:11px;color:var(--muted);margin-top:-8px;">Desayunos = salen + en casa (sin ingresos) · En casa = ingresos + en casa (sin salidas)</p>

// ---------- RESUMEN DE UN PERIODO ----------
//
// Lo pidió el lodge: «ver la información total entre periodos de fechas». La vista es la
// misma pantalla con otra unidad —cada renglón es un DÍA en vez de una habitación— y los
// totales salen de sumar los días que se enseñan debajo, no de otra consulta.
//
// «EN CASA» NO SE SUMA, y por eso aquí no aparece con ese nombre. Cuánta gente hay
// alojada es una foto de un momento; sumarla a lo largo de un mes no da «cuántos hubo»,
// da PAX-NOCHE. Llamarlo «total en casa» sería inventar un número que nadie podría
// cuadrar con nada. Al lado va el día de más ocupación, que es lo que de verdad se busca
// cuando alguien pregunta cuánta gente hubo.
function vistaResumenPeriodo(d, F) {
  const tarjeta = (etiqueta, valor, pie) => `
    <div class="stat">
      <p class="stat-label">${etiqueta}</p>
      <p class="stat-value">${valor}</p>
      ${pie ? `<p style="font-size:11px;color:var(--muted);margin:2px 0 0;">${pie}</p>` : ""}
    </div>`;

  const lleno = d.dia_mas_lleno || {};
  const totalTours = (d.tours || []).reduce((s, t) => s + (t.salidas || 0), 0);
  const paxTours = (d.tours || []).reduce((s, t) => s + (t.pax_total || 0), 0);

  return `
    <div class="card">
      <div class="header">
        <div>
          <p class="title">Resumen de operación · periodo</p>
          <p class="subtitle">${d.desde} — ${d.hasta} ·
             ${d.dias} día${d.dias === 1 ? "" : "s"} · toca una fecha de la tabla para
             abrir la hoja de ese día</p>
        </div>
        <div>
          ${barraFechasResumen(F, null)}
          <div class="filterbar" style="margin-top:6px;justify-content:flex-end;">
            <button class="btn btn-primary" onclick="vistaPreviaHoja(null,'${d.desde}','${d.hasta}')">👁 Vista previa</button>
            <button class="btn" onclick="descargar('resumen-operacion', {desde:'${d.desde}', hasta:'${d.hasta}'}, 'xlsx')">⬇ Excel</button>
            <button class="btn" onclick="descargar('resumen-operacion', {desde:'${d.desde}', hasta:'${d.hasta}'}, 'pdf')">⬇ PDF</button>
          </div>
        </div>
      </div>

      <div class="summary-grid">
        ${tarjeta("Entran", d.total_ingresos, `${d.pax_ingresos} pax`)}
        ${tarjeta("Salen", d.total_salidas, `${d.pax_salidas} pax`)}
        ${tarjeta("Desayunos", d.pax_desayunos, "pax en todo el periodo")}
        ${tarjeta("Pax-noche", d.pax_noche, `${d.habitaciones_noche} hab-noche`)}
      </div>
      <p style="font-size:11px;color:var(--muted);margin-top:-8px;">
        Entran y salen se cuentan en habitaciones · <strong>Pax-noche</strong> es la suma
        de los huéspedes alojados cada día, no cuántos hubo a la vez${lleno.fecha ? ` ·
        día de más ocupación: <strong>${etiquetaFecha(lleno.fecha)}</strong> con
        ${lleno.pax} pax en ${lleno.habitaciones} hab.` : ""}</p>
    </div>

    <div class="card">
      <p class="title">Día por día</p>
      <p class="subtitle" style="margin-bottom:12px;">
        El total de arriba es la suma de esta tabla · toca una fecha para abrir su hoja del día</p>
      <table>
        <tr><th>Fecha</th><th>Entran</th><th>Salen</th><th>En casa</th><th>Desayunos</th>
            <th>Sierpe e/s</th><th>Drake e/s</th><th>Tours</th><th>Pax tour</th></tr>
        ${d.por_dia.map(x => {
          const p = x.puntos || {};
          const par = (n) => (p[n] ? `${p[n].entradas} / ${p[n].salidas}` : "—");
          return `<tr>
            <td><button class="btn" style="padding:2px 8px;font-size:12px;"

            <td>${x.total_salidas} <span style="color:var(--muted);">/ ${x.pax_salidas}</span></td>
            <td>${x.total_en_casa} <span style="color:var(--muted);">/ ${x.pax_en_casa}</span></td>
            <td>${x.pax_desayunos}</td>
            <td>${par("Sierpe")}</td>
            <td>${par("Drake")}</td>
            <td>${x.tours || ""}</td>

    <div class="card">
      <p class="title">Movimiento por punto de embarque</p>
      <p class="subtitle" style="margin-bottom:12px;">Todo el periodo sumado</p>
      ${(d.puntos || []).length ? `
      <div class="stats" style="grid-template-columns:repeat(${Math.min(d.puntos.length,3)},1fr);">
        ${d.puntos.map(p => `
          <div class="stat">
            <p class="stat-label">${escaparHTML(p.punto)}</p>

          </div>`).join("")}

    <div class="card">
      <p class="title">Tours del periodo</p>
      <p class="subtitle" style="margin-bottom:12px;">

      ${(d.tours || []).length ? `
      <table>
        <tr><th>Tour</th><th>Salidas</th><th>Pax</th><th>Días con salida</th><th>Sin guía</th><th>Sin bote</th></tr>
        ${d.tours.map(t => `<tr>
          <td><strong>${escaparHTML(t.tour_codigo)}</strong>${t.es_privado ? ` ${insigniaPrivado()}` : ""}</td>
          <td>${t.salidas}</td>
          <td><strong>${t.pax_total}</strong></td>
          <td>${t.dias}</td>
          <td>${t.sin_guia ? `<span style="color:var(--warn-text);">${t.sin_guia}</span>` : "—"}</td>
          <td>${t.sin_bote ? `<span style="color:var(--warn-text);">${t.sin_bote}</span>` : "—"}</td>
        </tr>`).join("")}
        <tr style="background:var(--ok-bg);font-weight:600;">
          <td>TOTAL</td><td>${totalTours}</td><td>${paxTours}</td><td colspan="3"></td>
        </tr>
      </table>` : `<p class="empty">No hay tours en este periodo.</p>`}
      ${(d.bts || []).length ? `
        <p style="font-weight:600;font-size:13px;margin:16px 0 2px;">Botes extra (BT) · ${d.bts.length}</p>
        <table>
          <tr><th>Fecha</th><th>Hora</th><th>Habitación</th><th>Pax</th><th>Bote / capitán</th></tr>
          ${d.bts.map(b => `<tr>
            <td>${escaparHTML(b.fecha || "")}</td>
            <td>${escaparHTML(b.hora || "—")}</td>
            <td>Hab. ${escaparHTML(b.room_no || "—")}</td>
            <td>${b.pax}</td>
            <td>${[b.bote, b.capitan].filter(Boolean).map(escaparHTML).join(" / ") || "—"}</td>
          </tr>`).join("")}

    </div>

    ${d.restaurantes ? `

      <p class="title">Restaurantes</p>
      <p class="subtitle" style="margin-bottom:12px;">Comensales sumados en todo el periodo</p>
      <table style="max-width:520px;">
        <tr><th></th><th>Terra Kitchen</th><th>Bar el Bosque</th></tr>
        <tr><td><strong>Almuerzo</strong></td><td>${d.restaurantes.almuerzo_tk} pax</td><td>${d.restaurantes.almuerzo_bosque} pax</td></tr>
        <tr><td><strong>Cena</strong></td><td>${d.restaurantes.cena_tk} pax</td><td>${d.restaurantes.cena_bosque} pax</td></tr>
      </table>

    ${(d.restricciones_cocina || []).length ? `
    <div class="card">
      <p class="title">Cocina — restricciones, alergias e inclusiones</p>
      <p class="subtitle" style="margin-bottom:12px;">
        Cada huésped UNA vez, con los días que estuvo: una alergia se repite todos los
        días que la persona está alojada, y repetida no se puede leer</p>
      <table>
        <tr><th>Días</th><th>Hab.</th><th>Huésped</th><th>Qué</th><th>Detalle</th></tr>
        ${d.restricciones_cocina.map(x => `<tr>
          <td style="font-size:11.5px;white-space:nowrap;">${escaparHTML(x.desde || "")}${x.hasta && x.hasta !== x.desde ? ` → ${escaparHTML(x.hasta)}` : ""}</td>

    ${(d.spa || []).length ? `

function detalleResumen(campo) {
  const d = window._resData;
  const esPunto = campo.startsWith("punto:");
  const panel = document.getElementById(esPunto ? "res-punto" : "res-detalle");
  // Segundo toque en el mismo bloque: se cierra
  if (window._resAbierto === campo) {
    window._resAbierto = null;
    panel.innerHTML = "";
    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._resAbierto = campo;
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");

  if (esPunto) {
    const nombre = campo.slice(6);
    const p = (d.puntos || []).find(x => x.punto === nombre);
    // Quién lo lleva. Se asigna en la Agenda de tours («Ingresos y salidas por
    // locación») y se muestra aquí porque este es el resumen que se reparte por la
    // mañana: decir a qué hora y por dónde sin decir quién va deja el dato a medias.
    const sinAsignar = p.detalle.filter(x => !x.guia && !x.bote).length;
    const quien = x => {
      if (!x.guia && !x.bote) return `<span style="color:var(--warn-text);">sin asignar</span>`;
      return `${x.guia ? escaparHTML(x.guia) : `<span style="color:var(--warn-text);">sin guía</span>`}`
           + `<br><span style="font-size:11px;color:var(--muted);">`
           + `${x.bote ? escaparHTML(x.bote) : `<span style="color:var(--warn-text);">sin bote</span>`}</span>`;
    };
    panel.innerHTML = `<div class="detail-panel">
      <p style="font-weight:600;margin:0 0 8px;">${escaparHTML(nombre)} — ${p.detalle.length} movimiento(s)
        ${sinAsignar ? `<span style="font-weight:400;color:var(--warn-text);font-size:12.5px;"> · ${sinAsignar} sin guía ni bote</span>` : ""}</p>
      <table><tr><th>Tipo</th><th>Hab.</th><th>Huésped</th><th>Pax</th><th>Vuelo</th><th>Hora</th><th>Guía / bote</th></tr>
      ${p.detalle.map(x => `<tr class="${x.tipo === 'Entrada' ? 'fila-entra' : 'fila-sale'}">
        <td>${x.tipo}</td><td>${x.room_no}</td><td>${escaparHTML(x.nombre || "")}</td>
        <td>${x.pax}</td><td>${escaparHTML(x.vuelo || '—')}</td>
        <td>${escaparHTML(x.hora || x.hora_traslado || '—')}</td>
        <td>${quien(x)}</td></tr>`).join("")}
      </table>
      ${sinAsignar ? `<p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;">
        El guía y el bote se asignan en <strong>Agenda de tours → Ingresos y salidas por
        locación</strong>.</p>` : ""}
      </div>`;
    return;
  }

  const titulos = { ingresos: "Ingresos del día", salidas: "Salidas del día",
                    desayunos: "Desayunos", en_casa: "En casa" };
  const lista = d[campo] || [];
  if (!lista.length) {
    panel.innerHTML = `<div class="detail-panel">Sin registros.</div>`;
    return;
  }
  const esIngreso = campo === "ingresos", esSalida = campo === "salidas";
  panel.innerHTML = `<div class="detail-panel">
    <p style="font-weight:600;margin:0 0 8px;">${titulos[campo]} — ${lista.length} habitación(es)</p>
    <table>
      <tr><th>Hab.</th><th>Huésped</th><th>Pax</th>
        ${esIngreso || esSalida ? "<th>Punto</th><th>Vuelo</th><th>Hora</th>" : ""}
        ${campo === "en_casa" ? "<th>Sale</th>" : ""}
      </tr>
      ${lista.map(x => `<tr>
        <td><strong>${x.room_no}</strong>${etiquetaGrupo(x.conf_no)}</td><td>${x.nombre_principal}</td>
        <td>${(x.adl||0)+(x.chl||0)}</td>
        ${esIngreso ? `<td>${x.punto_entrada || '—'}</td><td>${x.vuelo_entrada || '—'}</td><td>${x.hora_vuelo_entrada || x.arr_time || '—'}</td>` : ""}
        ${esSalida ? `<td>${x.punto_salida || '—'}</td><td>${x.vuelo_salida || '—'}</td><td>${x.hora_vuelo_salida || '—'}</td>` : ""}
        ${campo === "en_casa" ? `<td>${x.dep_date || '—'}</td>` : ""}
      </tr>`).join("")}
    </table></div>`;
}

// ---------- OPERA CLOUD ----------

// Todo lo que viene del servidor se escapa antes de meterlo en la página: los detalles
// de error de Opera son texto que llega de Oracle, y no puede convertirse en etiquetas.
function escHtml(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const TEXTO_CICLO_OPERA = {
  OK: ["badge-ok", "al día"],
  // 'Sin cambios' es un resultado BUENO: se consultó Opera y no había nada nuevo.
  // Falta esta línea era lo que hacía que la pantalla lo mostrara como un error.
  SIN_CAMBIOS: ["badge-ok", "al día, sin cambios"],
  SIN_CONEXION: ["badge-warn", "sin conexión con Opera"],
  SIN_CONFIGURAR: ["badge-warn", "falta configurar"],
  SIN_RESERVAS: ["badge-tour", "no llegaron reservas"],
  ERROR_AL_CARGAR: ["badge-warn", "falló al guardar"],
  ERROR: ["badge-warn", "error"],
  "nunca ejecutado": ["badge-tour", "todavía no ha corrido"],
};

// Los resultados que significan que el ciclo TERMINÓ BIEN.
//
// Antes solo se reconocía 'OK', así que un ciclo perfectamente correcto en el que no
// había nada que actualizar se anunciaba como «No se pudo sincronizar». Eso es lo que
// veía el hotel cada vez que apretaba el botón después del primer ciclo: los cambios
// ya habían entrado, no quedaba nada por traer, y la pantalla lo llamaba error.
const CICLOS_QUE_SALIERON_BIEN = ["OK", "SIN_CAMBIOS"];

function mostrarFormCredenciales() {
  const caja = document.getElementById("opera-cred-form");
  if (!caja) return;
  document.getElementById("btn-cred-opera").style.display = "none";
  caja.innerHTML = `
    <div style="background:var(--warn-bg);border-radius:8px;padding:14px;margin-top:12px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 8px;">Credenciales de Opera Cloud</p>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 10px;">
        Pegue aquí las líneas tal como se las dieron, una por renglón, con el formato
        <code>NOMBRE=valor</code>. Es el mismo formato del panel del servidor, así que
        si ya las tiene preparadas puede pegarlas sin cambiar nada.
      </p>
      <textarea id="cred-texto" rows="9" spellcheck="false"
        style="width:100%;font-family:ui-monospace,monospace;font-size:12px;padding:10px;
               border-radius:6px;border:1px solid var(--linea);background:var(--fondo);
               color:var(--texto);"
        placeholder="OPERA_BASE_URL=https://...&#10;OPERA_APP_KEY=...&#10;OPERA_CLIENT_ID=...&#10;OPERA_CLIENT_SECRET=...&#10;OPERA_HOTEL_ID=..."></textarea>
      <p style="font-size:11.5px;color:var(--muted);margin:8px 0 10px;">
        Se guardan en el servidor, <strong>fuera de la base de datos</strong>: no viajan
        en el respaldo que usted descarga. Si algún día se definen como variables de
        entorno, esas mandan sobre lo que se guarde aquí.
      </p>
      <div style="display:flex;gap:8px;align-items:center;">
        <button class="btn btn-primary" onclick="guardarCredencialesOpera()"
                id="btn-guardar-cred">Guardar y conectar</button>
        <button class="btn" onclick="loadImportarPDF()">Cancelar</button>
      </div>
      <p id="cred-aviso" style="font-size:12.5px;margin:10px 0 0;"></p>
    </div>`;
  document.getElementById("cred-texto").focus();
}

async function guardarCredencialesOpera() {
  const texto = document.getElementById("cred-texto").value;
  const aviso = document.getElementById("cred-aviso");
  const boton = document.getElementById("btn-guardar-cred");
  if (!texto.trim()) {
    aviso.innerHTML = `<span style="color:var(--warn-text);">No hay nada que guardar.</span>`;
    return;
  }
  boton.disabled = true;
  boton.textContent = "Guardando…";
  aviso.textContent = "";
  try {
    const res = await fetchAuth(`${API}/api/opera/credenciales`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texto }),
    });
    const d = await res.json();
    if (!res.ok) throw new Error(d.detail || `el servidor respondió ${res.status}`);
    if (d.configurado) {
      aviso.innerHTML = `<span style="color:var(--ok-text,green);">Listo: se guardaron
        ${d.guardadas.length} credenciales y la conexión quedó configurada.</span>`;
      // Se vuelve a pintar la pantalla: ahora salen los botones de la conexión.
      setTimeout(loadImportarPDF, 900);
    } else {
      aviso.innerHTML = `<span style="color:var(--warn-text);">Se guardaron
        ${d.guardadas.length}, pero todavía faltan:
        <strong>${d.faltantes.map(escHtml).join(", ")}</strong>.</span>`;
    }
  } catch (e) {
    aviso.innerHTML = `<span style="color:var(--warn-text);">No se pudo guardar:
      ${escHtml(e.message)}</span>`;
  } finally {
    boton.disabled = false;
    boton.textContent = "Guardar y conectar";
  }
}

        <p style="margin:8px 0 0;font-size:12px;">Falta definir en el servidor:

      <br>Ventana: del <strong>${escHtml(d.ventana.desde)}</strong> al
      <strong>${escHtml(d.ventana.hasta)}</strong>

      ${u.resultado === "OK" ? `<br>${u.reservas_cargadas} reservas cargadas${u.descartadas ? ` · ${u.descartadas} descartadas` : ""}` : ""}

// Los últimos días de sincronización. A diferencia de "Último intento" —que vive en la
// memoria del servidor y se borra en cada redespliegue—, esto sale de la base y
// sobrevive a los reinicios: es lo único que puede responder "¿sincronizó ayer?".
function pintarDiasDeOpera(d) {
  const dias = d.por_dia || [];
  if (!dias.length) {
    return `<p style="font-size:11.5px;color:var(--muted);margin:16px 0 0;">
      Todavía no hay historial. Se empieza a guardar con el próximo ciclo.</p>`;
  }

  // Un día con ciclos pero ninguno bueno es una racha de fallos, y tiene que verse
  // distinto de un día que simplemente tuvo menos vueltas.
  const filas = dias.map(x => {
    const fallidos = x.ciclos - x.buenos;
    const clase = x.buenos === 0 ? "badge-warn" : (fallidos ? "badge-tour" : "badge-ok");
    const texto = x.buenos === 0 ? `${x.ciclos} fallaron`
                : fallidos ? `${x.buenos} bien · ${fallidos} con fallo`
                : `${x.buenos} bien`;
    return `<tr>
      <td>${escHtml(x.dia)}</td>
      <td><span class="badge ${clase}">${escHtml(texto)}</span></td>
      <td>${x.cargadas || 0}</td>
      <td style="font-size:11.5px;color:var(--muted);">${escHtml((x.ultimo || "").slice(11, 16))}</td>
    </tr>`;
  }).join("");

  return `
    <p style="font-weight:600;font-size:13px;margin:18px 0 6px;">Últimos días</p>
    <table>
      <tr><th>Día</th><th>Ciclos</th><th>Reservas</th><th>Último</th></tr>
      ${filas}
    </table>
    <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0;">
      Un día que no aparece es un día que no sincronizó: o estaba apagada, o el servidor
      estuvo caído.
    </p>`;
}

function operaTrabajando(mensaje) {
  const caja = document.getElementById("opera-resultado") || document.getElementById("opera-estado");
  if (caja) caja.innerHTML = `<div class="trabajando"><div class="giro"></div><p>${escHtml(mensaje)}</p></div>`;
}

async function operaProbar() {
  operaTrabajando("Autenticando contra Opera…");
  const r = await (await fetchAuth(`${API}/api/opera/probar`, { method: "POST" })).json();
  if (r.estado === "OK") avisar("Conexión correcta con Opera Cloud");
  else if (r.estado === "SIN_CONFIGURAR") avisar("Faltan credenciales: " + r.faltantes.join(", "), true);
  else avisar("No se pudo conectar: " + (r.detalle || ""), true);
  pintarEstadoOpera();
}

async function operaVistaPrevia() {
  operaTrabajando("Consultando Opera… (no se guarda nada)");
  const r = await (await fetchAuth(`${API}/api/opera/vista-previa`, { method: "POST" })).json();
  pintarEstadoOpera();
  const caja = document.getElementById("opera-resultado");
  if (!caja) return;
  if (r.estado !== "VISTA_PREVIA") {
    avisar(r.mensaje || r.detalle || "No se pudo consultar Opera", true);
    return;
  }
  caja.innerHTML = `
    <p style="font-weight:600;font-size:13px;margin:16px 0 6px;">
      Esto es lo que entraría (todavía no se guardó nada)
    </p>
    <pre style="background:var(--sand);border:1px solid var(--border);border-radius:var(--r-sm);
                padding:12px;font-size:11.5px;overflow-x:auto;white-space:pre;">${escHtml(r.diagnostico)}</pre>
    <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0;">
      Si algún campo aparece vacío en TODAS las reservas, es que ese dato viene con otro
      nombre en esta propiedad y hay que ajustarlo. Avísale a quien lleva el sistema.
    </p>`;
}

async function operaSincronizar() {
  operaTrabajando("Trayendo reservas de Opera…");
  const r = await (await fetchAuth(`${API}/api/opera/sincronizar`, { method: "POST" })).json();
  if (r.estado === "OK") {
    // No hace falta recargar esta pantalla: fetchAuth ya avisó del cambio de datos,
    // y las demás pantallas se ponen al día solas cuando se entra a ellas.
    let texto = `${r.reservas_cargadas} reservas actualizadas desde Opera`;
    if (r.duplicadas_unificadas) texto += ` · ${r.duplicadas_unificadas} duplicada(s) unificada(s)`;
    avisar(texto);
    // Si una limpieza secundaria falló, el ciclo igual salió bien, pero hay que
    // decirlo: callarlo sería esconder un problema que alguien debe mirar.
    if ((r.problemas_secundarios || []).length) {
      avisar("Ojo: " + r.problemas_secundarios.join(" · "), true);
    }
  } else if (r.estado === "SIN_CAMBIOS") {
    // Terminó bien y no había nada que traer. NO es un error.
    avisar(`Ya estaba al día: ${r.sin_cambio || 0} reservas revisadas, ninguna cambió`);
  } else {
    // Y si de verdad falló, que se vea el motivo. El estado siempre va incluido:
    // un "no se pudo" a secas no deja por dónde empezar a buscar.
    const motivo = r.mensaje || r.detalle || "";
    avisar(`No se pudo sincronizar (${r.estado || "sin estado"})`
           + (motivo ? `: ${motivo}` : ""), true);
  }
  pintarEstadoOpera();
}

async function operaEncender(activo) {
  const res = await fetchAuth(`${API}/api/opera/config`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ activo }),
  });
  const r = await res.json();
  if (!res.ok) { avisar(r.detail || "No se pudo guardar", true); return; }
  avisar(activo ? "Sincronización encendida" : "Sincronización apagada");
  pintarEstadoOpera();
}

  IGNORADO: ["badge-warn", "no era el reporte"],

};

  } catch (e) { caja.innerHTML = `<p class="empty">No se pudo consultar.</p>`; return; }

  if (!d.configurado) {
    // Con Opera conectado y trayendo reservas, este camino sobra: existía para

    // Se esconde en vez de borrarse: si algún día Opera queda caída un tiempo largo,
    // sigue disponible. Vuelve a aparecer solo, en cuanto Opera se apague.

      <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;">

        <strong>BUZON_HOST</strong>, <strong>BUZON_USUARIO</strong> y
        <strong>BUZON_CLAVE</strong> (y opcionalmente BUZON_REMITENTE para aceptar solo los
        correos de OPERA).</p>

  const u = d.ultima_importacion;
  caja.innerHTML = `
    <div style="background:var(--ok-bg);color:var(--ok-text);border-radius:var(--r-sm);padding:11px 13px;font-size:13px;margin-bottom:12px;">
      Activa · revisa <strong>${d.buzon}</strong> cada ${d.cada_minutos} minutos
      ${d.remitente_filtrado ? `· solo correos de <strong>${d.remitente_filtrado}</strong>` : ""}
      ${u ? `<br>Última importación: <strong>${u.recibido_en}</strong> — ${u.reservas} reservas (${u.archivo})`

    </p>

      <p style="font-weight:600;font-size:13px;margin:16px 0 6px;">Últimos reportes recibidos</p>
      <table>
        <tr><th>Cuándo</th><th>Archivo</th><th>Reservas</th><th>Resultado</th><th>Detalle</th></tr>
        ${d.historial.map(h => {
          const [clase, texto] = TEXTO_ESTADO_BUZON[h.estado] || ["badge-tour", h.estado];
          return `<tr>
            <td>${h.recibido_en}</td>
            <td>${h.archivo || "—"}</td>
            <td>${h.reservas || "—"}</td>
            <td><span class="badge ${clase}">${texto}</span></td>
            <td style="font-size:11.5px;color:var(--muted);">${h.detalle ? h.detalle.slice(0, 140) : ""}</td>
          </tr>`;
        }).join("")}
      </table>` : ""}`;
}

async function revisarBuzonAhora() {
  const caja = document.getElementById("buzon-estado");
  caja.innerHTML = `<div class="trabajando"><div class="giro"></div><p>Revisando el buzón…</p></div>`;
  const res = await fetchAuth(`${API}/api/buzon/revisar`, { method: "POST" });
  const r = await res.json();
  if (!res.ok) { avisar(r.detail || "No se pudo revisar", true); pintarEstadoBuzon(); return; }
  if (r.fallo) avisar("No se pudo entrar al buzón: " + r.fallo, true);
  else if (r.importados) avisar(`${r.importados} reporte(s) · ${r.reservas} reservas importadas`);
  else avisar(r.correos ? "Sin reportes nuevos que importar" : "No hay correos nuevos");
  pintarEstadoBuzon();
}

function leerPermisos(prefijo) {
  const permisos = {};
  document.querySelectorAll(`input[type=radio][name^="${prefijo}-"]:checked`).forEach(r => {
    if (r.value) permisos[r.name.slice(prefijo.length + 1)] = r.value;
  });
  return permisos;
}

function aplicarPerfilA(prefijo, nombre) {
  const p = nombre === "__NADA__" ? {} : (window._catPermisos.perfiles[nombre] || {});
  document.querySelectorAll(`input[type=radio][name^="${prefijo}-"]`).forEach(r => {
    r.checked = (p[r.name.slice(prefijo.length + 1)] || "") === r.value;
  });
}

async function guardarComoPerfil(prefijo) {
  const permisos = leerPermisos(prefijo);
  if (!Object.keys(permisos).length) {
    avisar("Marca al menos una pantalla antes de guardar el perfil", true);
    return;
  }
  const nombre = prompt("Nombre del perfil (ej. Salonero, Housekeeping):");
  if (!nombre || !nombre.trim()) return;
  const res = await fetchAuth(`${API}/api/permisos/perfiles`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nombre: nombre.trim(), permisos }),
  });
  if (!res.ok) { avisar((await res.json()).detail || "No se pudo guardar el perfil", true); return; }
  avisar(`Perfil "${nombre.trim()}" guardado`);
  // Se recarga la pantalla para que el perfil nuevo aparezca en los botones.
  document.getElementById("modal-pm")?.remove();
  loadUsuarios();
}

async function borrarPerfil(prefijo) {
  const sel = document.getElementById(`${prefijo}-borrar-perfil`);
  const nombre = sel && sel.value;
  if (!nombre) { avisar("Elige el perfil a borrar", true); return; }
  if (!confirm(`¿Borrar el perfil "${nombre}"? Los usuarios que ya lo tenían aplicado no cambian.`)) return;
  await fetchAuth(`${API}/api/permisos/perfiles/${encodeURIComponent(nombre)}`, { method: "DELETE" });
  avisar(`Perfil "${nombre}" borrado`);
  document.getElementById("modal-pm")?.remove();
  loadUsuarios();
}

function resumenPermisos(u) {
  const actuales = permisosDe(u);
  const claves = Object.keys(actuales);
  if (!claves.length) {
    return `<span class="badge badge-warn" style="font-size:10.5px;">sin acceso a nada</span>`;
  }
  const cat = window._catPermisos || { pantallas: [] };
  const nombre = c => (cat.pantallas.find(p => p.clave === c) || {}).nombre || c;
  const partes = claves.map(c =>
    `<span class="badge ${actuales[c] === "escribir" ? "badge-ok" : "badge-tour"}"
       style="font-size:10.5px;">${nombre(c)}${actuales[c] === "escribir" ? " ✎" : ""}</span>`);
  return partes.join(" ");
}

async function mostrarUsoDePasaportes() {
  const donde = document.getElementById("respaldo-pas-estado");
  if (!donde) return;
  try {
    const [d, t] = await Promise.all([
      (await fetchAuth(`${API}/api/pasaportes/uso`)).json(),
      fetchAuth(`${API}/api/tiquetes-sinac/uso`).then(r => r.ok ? r.json() : null)
        .catch(() => null),
    ]);
    const mb = (d.bytes / (1024 * 1024)).toFixed(1);
    // Se enseñan las dos cuentas porque el ZIP lleva las dos cosas: decir solo las fotos
    // haría creer que los tiquetes no se están respaldando.
    const linea = d.fotos
      ? `Hay <strong>${d.fotos}</strong> foto${d.fotos === 1 ? "" : "s"} de
         ${d.reservas} reserva${d.reservas === 1 ? "" : "s"} · ${mb} MB.`
      : "Todavía no hay ninguna foto guardada.";
    const lineaT = (t && t.tiquetes)
      ? `<br>Y <strong>${t.tiquetes}</strong> tiquete${t.tiquetes === 1 ? "" : "s"} del
         SINAC de ${t.dias} día${t.dias === 1 ? "" : "s"} ·
         ${(t.bytes / (1024 * 1024)).toFixed(1)} MB.`
      : (t ? "<br>Todavía no hay ningún tiquete del SINAC subido." : "");
    donde.innerHTML = linea + lineaT;
  } catch (e) { /* sin permiso o sin red: la tarjeta se lee igual */ }
}

async function bajarRespaldoPasaportes() {
  const boton = document.getElementById("btn-respaldo-pas");
  const aviso = document.getElementById("respaldo-pas-estado");
  boton.disabled = true;
  boton.textContent = "Preparando…";
  aviso.textContent = "Armando el ZIP con las fotos y los tiquetes. Puede tardar.";
  aviso.style.color = "var(--muted)";
  try {
    const res = await fetchAuth(`${API}/api/respaldo/archivos`);
    if (!res.ok) throw new Error(`el servidor respondió ${res.status}`);
    const blob = await res.blob();
    let nombre = "corcovado_archivos.zip";
    const m = (res.headers.get("content-disposition") || "").match(/filename="?([^";]+)"?/);
    if (m) nombre = m[1];
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
    aviso.innerHTML = `<span style="color:var(--ok-text,green);">Listo:
      <strong>${escaparHTML(nombre)}</strong> (${(blob.size / (1024 * 1024)).toFixed(1)} MB).
      Guárdelo fuera del servidor.</span>`;
  } catch (e) {
    aviso.innerHTML = `<span style="color:var(--warn-text);">No se pudo descargar:
      ${escaparHTML(e.message)}. Las fotos NO se respaldaron.</span>`;
  } finally {
    boton.disabled = false;
    boton.textContent = "Descargar fotos";
  }
}

async function bajarRespaldo() {
  // Se descarga con fetch y no con un enlace normal porque la sesión viaja en la
  // cabecera Authorization: un <a href> no la lleva y el servidor respondería 401.
  const boton = document.getElementById("btn-respaldo");
  const aviso = document.getElementById("respaldo-estado");
  boton.disabled = true;
  boton.textContent = "Preparando…";
  aviso.textContent = "Copiando la base. En una base grande puede tardar unos segundos.";
  aviso.style.color = "var(--muted)";
  try {
    const res = await fetchAuth(`${API}/api/respaldo`);
    if (!res.ok) throw new Error(`el servidor respondió ${res.status}`);
    const blob = await res.blob();
    // El nombre viene del servidor con la fecha y la hora.
    let nombre = "corcovado_respaldo.db";
    const cd = res.headers.get("content-disposition") || "";
    const m = cd.match(/filename="?([^";]+)"?/);
    if (m) nombre = m[1];
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = nombre;
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
    const mb = (blob.size / (1024 * 1024)).toFixed(1);
    aviso.innerHTML = `<span style="color:var(--ok-text,green);">Listo: <strong>${escaparHTML(nombre)}</strong>
      (${mb} MB). Guárdelo fuera del servidor.</span>`;
  } catch (e) {
    aviso.innerHTML = `<span style="color:var(--warn-text);">No se pudo descargar: ${escaparHTML(e.message)}.
      El respaldo NO se hizo.</span>`;
  } finally {
    boton.disabled = false;
    boton.textContent = "Descargar respaldo";
  }
}

function alternarConfigPublicacion() {
  const caja = document.getElementById("pb-config");
  if (!caja) return;
  const oculto = caja.style.display === "none";
  caja.style.display = oculto ? "block" : "none";
  const flecha = document.getElementById("pb-flecha");
  if (flecha) flecha.textContent = oculto ? "▾" : "▸";
}

async function guardarConfigPublicacion() {
  const habs = document.getElementById("pb-habs").value.split(",").map(s => s.trim()).filter(Boolean);
  const res = await fetchAuth(`${API}/api/publicacion/config`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      base_url: document.getElementById("pb-url").value.trim(),
      habitaciones: habs,
      enlaces_con_codigo: document.getElementById("pb-codigo").checked,
    }),
  });
  if (!res.ok) { avisar((await res.json()).detail || "No se pudo guardar", true); return; }
  avisar("Configuración guardada");
  loadPublicacion();
}

function verPaginaHuesped(roomNo, url) {
  // Se abre el mismo enlace que lleva impreso el código QR. Cuando los enlaces
  // llevan código secreto, la dirección corta ya no sirve ni para recepción.
  window.open(url || `${API}/i/${roomNo}`, "_blank");
}

async function descargarHojaQR() {
  const res = await fetchAuth(`${API}/api/publicacion/qr`);
  if (!res.ok) {
    // Se muestra el motivo del servidor (suele ser que falta la dirección base).
    let motivo = "No se pudo generar la hoja";
    try { motivo = (await res.json()).detail || motivo; } catch (e) {}
    avisar(motivo, true);
    return;
  }
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "codigos_qr_habitaciones.pdf";
  a.click();
}

/* ---------- Editar lo que ya está en el catálogo ----------
 *
 * Antes solo se podía crear y desactivar. Para corregir la capacidad de un bote o un
 * nombre mal escrito había que desactivar el viejo y crear uno nuevo, y eso parte la
 * historia en dos: los tours ya asignados siguen apuntando al viejo y la analítica
 * cuenta al mismo guía como dos personas.
 *
 * Se edita en la propia fila, no en un cuadro aparte: son dos o tres campos y así se ve
 * el resto de la tabla mientras se corrige.
 */
function botonesFila(tipo, i, activo) {
  if (!puedeEscribir("catalogo")) return "";
  // Se pasa la POSICIÓN y no el nombre: un nombre con comilla o acento metido dentro de
  // un onclick rompe el atributo, y esa fila se queda sin botones sin decir por qué.
  return `<button class="btn" onclick="editarFilaCatalogo('${tipo}', ${i})">Editar</button>
    <button class="btn" onclick="alternarCatalogo('${tipo}', ${i})">${activo ? "Desactivar" : "Activar"}</button>`;
}

function alternarCatalogo(tipo, i) {
  const cfg = EDITOR_CATALOGO[tipo];
  const item = (window._catalogo || {})[cfg.lista][i];
  if (!item) return;
  toggleCatalogo(tipo, encodeURIComponent(item[cfg.llave]), item.activo ? "false" : "true");
}

function insigniaEstado(activo) {
  return `<span class="badge ${activo ? "badge-ok" : "badge-warn"}">${activo ? "Activo" : "Inactivo"}</span>`;
}

function filaGuiaHTML(g, i) {
  return `<td>${escaparHTML(g.nombre)}</td>
    <td>${g.es_externo ? "Sí" : "No"}</td>
    <td>${insigniaEstado(g.activo)}</td>
    <td>${botonesFila("guia", i, g.activo)}</td>`;
}

function filaCapitanHTML(c, i) {
  // Sin botón de editar: un capitán es solo un nombre, y renombrarlo dejaría huérfanas
  // las corridas que ya lo nombran. Para corregir un nombre mal escrito se apaga y se
  // crea el bueno, que es lo mismo que hace el catálogo con todo lo demás.
  return `<td>${escaparHTML(c.nombre)}</td>
    <td>${insigniaEstado(c.activo)}</td>
    <td>${c.activo
      ? `<button class="btn" onclick="estadoCapitan('${encodeURIComponent(c.nombre)}', false)">Desactivar</button>`
      : `<button class="btn" onclick="estadoCapitan('${encodeURIComponent(c.nombre)}', true)">Activar</button>`}</td>`;
}

    ],

      { id: "requiere_entrada_sinac", etiqueta: "Entrada SINAC", tipo: "si_no", valor: t.requiere_entrada_sinac },
      { id: "requiere_bote", etiqueta: "Lleva bote", tipo: "si_no", valor: t.requiere_bote },
    ],
  },
};

function editarFilaCatalogo(tipo, i) {
  const cfg = EDITOR_CATALOGO[tipo];
  const item = (window._catalogo || {})[cfg.lista][i];
  const fila = document.getElementById(`cat-${tipo}-${i}`);
  if (!item || !fila) return;
  const campos = cfg.campos(item).map(c => {
    const id = `ed-${tipo}-${i}-${c.id}`;
    if (c.tipo === "si_no") {
      return `<label style="font-size:11.5px;white-space:nowrap;">
        <input type="checkbox" id="${id}" ${c.valor ? "checked" : ""}> ${c.etiqueta}</label>`;
    }
    return `<label style="font-size:10.5px;color:var(--muted);display:block;">${c.etiqueta}
      <input type="${c.tipo === "numero" ? "number" : "text"}" id="${id}"
        value="${c.valor == null ? "" : String(c.valor).replace(/"/g, "&quot;")}"
        style="display:block;width:${c.ancho}px;font-size:11.5px;padding:2px 4px;"></label>`;
  }).join("");
  // Ocupa la fila entera: son varios campos y repartidos por columna no caben.
  const columnas = fila.children.length;
  fila.innerHTML = `<td colspan="${columnas}">
    <div class="filterbar" style="flex-wrap:wrap;align-items:flex-end;gap:10px;">
      ${campos}
      <button class="btn btn-primary" onclick="guardarFilaCatalogo('${tipo}', ${i})">Guardar</button>
      <button class="btn" onclick="cancelarFilaCatalogo('${tipo}', ${i})">Cancelar</button>
    </div>
    <div id="ed-${tipo}-${i}-error" style="color:var(--danger-text);font-size:11.5px;margin-top:4px;"></div>
  </td>`;
}

function cancelarFilaCatalogo(tipo, i) {
  const cfg = EDITOR_CATALOGO[tipo];
  const item = (window._catalogo || {})[cfg.lista][i];
  const fila = document.getElementById(`cat-${tipo}-${i}`);
  if (item && fila) fila.innerHTML = cfg.volver(item, i);
}

async function guardarFilaCatalogo(tipo, i) {
  const cfg = EDITOR_CATALOGO[tipo];
  const item = (window._catalogo || {})[cfg.lista][i];
  if (!item) return;
  const payload = {};
  cfg.campos(item).forEach(c => {
    const el = document.getElementById(`ed-${tipo}-${i}-${c.id}`);
    if (!el) return;
    payload[c.id] = c.tipo === "si_no" ? el.checked : el.value.trim();
  });

  const error = document.getElementById(`ed-${tipo}-${i}-error`);
  const clave = encodeURIComponent(item[cfg.llave]);
  const res = await fetchAuth(`${API}/api/catalogo/${tipo}/${clave}/editar`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(payload),
  });
  if (!res.ok) {
    if (error) error.textContent = (await res.json()).detail || "No se pudo guardar";
    return;
  }
  const d = await res.json();
  // Renombrar arrastra los tours, las entradas del parque y los guías ya asignados. Se
  // dice cuántos se movieron: no es lo mismo renombrar un guía recién creado que uno
  // con cuarenta salidas encima.
  if (d.aviso) avisar(d.aviso);
  else avisar("Catálogo actualizado");
  CATALOGO = null;      // la copia que usan las otras pantallas quedó vieja
  loadCatalogoAdmin();
}
