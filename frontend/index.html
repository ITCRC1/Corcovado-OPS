// ---------- AGENDA DE TOURS ----------
let CATALOGO = null;
async function getCatalogo() {
  if (!CATALOGO) CATALOGO = await (await fetchAuth(`${API}/api/catalogo`)).json();
  return CATALOGO;
}

async function loadAgenda(fecha, desde, hasta) {
  setActive(2);
  window._agendaSinGuardar = new Set();
  const F = FILTROS.agenda;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desde) F.desde = desde;
  if (hasta) F.hasta = hasta;
  if (fecha === null) F.modo = "rango";              // se pidió ver un rango
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  let url = fecha ? `${API}/api/tours/agenda?fecha=${fecha}` : `${API}/api/tours/agenda?desde=${F.desde}&hasta=${F.hasta}`;
  const [rows, cat] = await Promise.all([fetchAuth(url).then(r => r.json()), getCatalogo()]);
  // Conflictos de horario y quién está libre ese día
  let conflictos = [], dispo = {};
  if (fecha) {
    try {
      conflictos = (await (await fetchAuth(`${API}/api/agenda/conflictos?fecha=${fecha}`)).json()).conflictos || [];
      const codigos = [...new Set(rows.flatMap(r => r.tours.map(t => t.tour_codigo)))];
      for (const cod of codigos) {
        dispo[cod] = await (await fetchAuth(`${API}/api/agenda/disponibilidad?fecha=${fecha}&tour_codigo=${cod}`)).json();
      }
    } catch (e) {}
  }
  // Los desplegables marcan quién ya está ocupado en ese horario
  const opcionesGuia = (cod, actual) => {
    const d = dispo[cod] || {};
    const ocup = new Set(d.guias_ocupados || []);
    return cat.guias.map(g => {
      const marca = ocup.has(g.nombre) && g.nombre !== actual ? " (ocupado)" : "";
      return `<option value="${g.nombre}"${g.nombre === actual ? " selected" : ""}>${g.nombre}${marca}</option>`;
    }).join("");
  };
  const opcionesBote = (cod, actual) => {
    const d = dispo[cod] || {};
    const ocup = new Set(d.botes_ocupados || []);
    return cat.botes.filter(b => b.gestionado_por_hotel).map(b => {
      const marca = ocup.has(b.nombre) && b.nombre !== actual ? " (ocupado)" : "";
      return `<option value="${b.nombre}"${b.nombre === actual ? " selected" : ""}>${b.nombre}${marca}</option>`;
    }).join("");
  };
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Agenda de tours ${fecha ? etiquetaFecha(fecha) : ''}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadAgenda(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha || ""}" onchange="loadAgenda(this.value)">
          <button class="btn" onclick="loadAgenda(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadAgenda(hoyISO())">Hoy</button>
          <button class="btn" onclick="loadAgenda(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="ag-desde" value="${F.desde}">
          <input type="date" id="ag-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadAgenda(null, document.getElementById('ag-desde').value, document.getElementById('ag-hasta').value)">Ver rango</button>
          <button class="btn" onclick="descargar('agenda', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('agenda', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      <div id="ag-alertas"></div>
      ${conflictos.length ? `
        <div style="background:var(--danger-bg);color:var(--danger-text);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;">
          <p style="margin:0 0 6px;font-weight:600;">⚠ ${conflictos.length} conflicto${conflictos.length>1?'s':''} de asignación</p>
          ${conflictos.map(x => `<p style="margin:0 0 3px;">${x.mensaje}</p>`).join("")}
        </div>` : ""}
      ${rows.length ? `
      <table>
        <tr><th>Huésped / Hab.</th><th>Tour</th><th>Fecha del tour</th><th>Grupo</th><th>Guía</th><th>Bote</th><th>Pax</th>${puedeEscribir("agenda") ? "<th></th>" : ""}</tr>
        ${rows.map(r => r.tours.map((t, i) => `
          <tr>
            ${i === 0 ? `<td rowspan="${r.tours.length}">${r.nombre_principal} · ${r.room_no}</td>` : ''}
            <td>${t.tour_codigo}</td>
            <td>${puedeEscribir("agenda")
              ? `<input type="date" value="${t.fecha || r.fecha}" style="font-size:11.5px;padding:3px 5px;width:130px;"
                   onchange="cambiarFechaTour(${t.id}, this.value, '${t.fecha || r.fecha}')">`
              : (t.fecha || r.fecha)}</td>
            <td>${puedeEscribir("agenda") ? `<select id="gr-${t.id}" onchange="cambiarGrupo(${t.id}, this.value)" style="width:60px;">
                ${["A","B","C","D"].map(g => `<option value="${g}" ${(t.grupo_operativo||"A")===g?"selected":""}>${g}</option>`).join("")}
              </select>` : (t.grupo_operativo || "A")}</td>
            <td>${puedeEscribir("agenda") ? `<select id="g-${t.id}" onchange="marcarSinGuardar(${t.id})">${'<option value="">Sin asignar</option>' + opcionesGuia(t.tour_codigo, t.guia_nombre)}</select>` : (t.guia_nombre || "Sin asignar")}</td>
            <td>${puedeEscribir("agenda") ? `<select id="b-${t.id}" onchange="marcarSinGuardar(${t.id})">${'<option value="">Sin asignar</option>' + opcionesBote(t.tour_codigo, t.bote_nombre)}</select>` : (t.bote_nombre || "Sin asignar")}</td>
            ${i === 0 ? `<td rowspan="${r.tours.length}">${r.pax}</td>` : ''}
            ${puedeEscribir("agenda") ? `<td><button class="btn" onclick="guardarAsignacion(${t.id})">Guardar</button></td>` : ''}
          </tr>`).join("")).join("")}
      </table>
      <p style="font-size:11px;color:var(--muted);margin-top:8px;">
        <strong>Grupo:</strong> si un tour excede la capacidad de un guía, cambia algunas reservas al grupo B, C o D — cada grupo lleva su propio guía.
        Pueden compartir el mismo bote (si cabe) o usar botes distintos: el sistema valida el guía por grupo, y el bote sumando todos los grupos que lo comparten.
      </p>` : `<p class="empty">No hay tours para esta fecha.<small>Si esperabas alguno, revisa que el PDF de reservas esté importado y que la fecha sea la correcta.</small></p>`}
    </div>
  `;
}

async function cambiarFechaTour(tourId, fecha, fechaAnterior) {
  if (!fecha) { avisar("Fecha vacía", true); return; }
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/fecha?fecha=${fecha}`, { method: "POST" });
  if (!res.ok) {
    const e = await res.json();
    avisar(e.detail || "No se pudo cambiar la fecha", true);
    loadAgenda();
    return;
  }
  const d = await res.json();
  if (d.sin_cambios) return;

  let msg = `Tour movido al ${d.a}`;
  if (d.entrada_sinac_movida) msg += " · entrada SINAC actualizada";
  if (d.itinerario === "actualizado" || d.itinerario === "regenerado") msg += " · itinerario actualizado";
  avisar(msg);

  const panel = document.getElementById("ag-alertas");
  let avisos = [];
  if (d.itinerario === "requiere revisión manual") {
    avisos.push("El itinerario de esta reserva fue editado a mano y no se pudo ajustar solo. Revísalo antes de enviarlo.");
  }
  avisos = avisos.concat(d.alertas || []);
  if (panel) {
    panel.innerHTML = avisos.length
      ? `<div style="background:var(--warn-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${avisos.map(a => `⚠ ${a}`).join("<br>")}</div>`
      : `<div style="background:var(--ok-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ok-text);">Tour movido del ${d.de} al ${d.a}. Todo lo relacionado quedó actualizado.</div>`;
  }
  loadAgenda();
}

async function cambiarGrupo(tourId, grupo) {
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/grupo?grupo=${grupo}`, { method: "POST" });
  const data = await res.json();
  const panel = document.getElementById("ag-alertas");
  if (data.alertas && data.alertas.length) {
    panel.innerHTML = `<div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${data.alertas.map(a => `⚠ ${a}`).join("<br>")}</div>`;
  } else {
    panel.innerHTML = `<div style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ok-text);">Movido al grupo ${data.grupo}. Asigna su guía y bote.</div>`;
  }
  loadAgenda();
}

// Marca visualmente la fila cuando se cambia un guía o bote y aún no se ha guardado
function marcarSinGuardar(tourId) {
  const fila = document.getElementById(`g-${tourId}`)?.closest("tr");
  if (fila) fila.classList.add("sin-guardar");
  window._agendaSinGuardar = window._agendaSinGuardar || new Set();
  window._agendaSinGuardar.add(tourId);
  const btn = document.querySelector(`button[onclick="guardarAsignacion(${tourId})"]`);
  if (btn) { btn.textContent = "Guardar *"; btn.classList.add("btn-primary"); }
}

async function guardarAsignacion(tourId) {
  const guia = document.getElementById(`g-${tourId}`).value;
  const bote = document.getElementById(`b-${tourId}`).value;
  // Se mandan siempre los dos, incluso vacíos: vacío significa "Sin asignar" y el
  // servidor lo borra. Si no se mandaran, dejaría el guía anterior puesto.
  const params = new URLSearchParams();
  params.append("guia", guia);
  params.append("bote", bote);
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/asignar?${params.toString()}`, { method: "POST" });
  const data = await res.json();
  // La fila deja de estar marcada como pendiente de guardar
  const fila = document.getElementById(`g-${tourId}`)?.closest("tr");
  if (fila) fila.classList.remove("sin-guardar");
  window._agendaSinGuardar?.delete(tourId);
  const btn = document.querySelector(`button[onclick="guardarAsignacion(${tourId})"]`);
  if (btn) { btn.textContent = "Guardar"; btn.classList.remove("btn-primary"); }
  avisar(data.alertas && data.alertas.length ? "Guardado, revisa el aviso de capacidad" : "Asignación guardada");
  const panel = document.getElementById("ag-alertas");
  if (data.alertas && data.alertas.length) {
    panel.innerHTML = `<div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${data.alertas.map(a => `⚠ ${a}`).join("<br>")}</div>`;
  } else {
    panel.innerHTML = `<div style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ok-text);">Asignación guardada, sin conflictos de capacidad.</div>`;
  }
}

          <button class="btn" onclick="loadTransporte(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="tr-desde" value="${F.desde}">
          <input type="date" id="tr-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadTransporte(null, document.getElementById('tr-desde').value, document.getElementById('tr-hasta').value)">Ver rango</button>
          <button class="btn" onclick="descargar('transporte', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('transporte', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      <p style="font-weight:600;font-size:14px;">Entradas</p>
      ${d.entradas.length ? `<table><tr><th>Fecha</th><th>Hab.</th><th>Huésped</th><th>Punto</th><th>Hora</th><th>Pax</th></tr>${d.entradas.map(filaE).join("")}</table>` : `<p class="empty">Nadie ingresa este día.<small>Cambia la fecha con las flechas para revisar otro día.</small></p>`}
      <p style="font-weight:600;font-size:14px;margin-top:16px;">Salidas</p>
      ${d.salidas.length ? `<table><tr><th>Fecha</th><th>Hab.</th><th>Huésped</th><th>Punto</th><th>Hora</th><th>Pax</th></tr>${d.salidas.map(filaS).join("")}</table>` : `<p class="empty">Nadie sale este día.</p>`}
      ${pendientes.length && puedeEscribir("transporte") ? `
        <p style="font-weight:600;font-size:14px;margin-top:20px;color:var(--warn-text);">⚠ Pendientes de confirmar (${pendientes.length})</p>
        <p style="font-size:12px;color:var(--muted);margin:0 0 8px;">El PDF menciona un ingreso o salida, pero no indica claramente si es por Sierpe o Drake.</p>
        ${pendientes.map(p => `
          ${p.punto_entrada_sin_confirmar ? `
            <div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;">
              <span style="color:var(--warn-text);"><strong>Entrada</strong> · ${p.nombre_principal} (hab. ${p.room_no}, ${p.arr_date}): "${p.punto_entrada_sin_confirmar}"</span>
              <button class="btn" style="margin-left:8px;" onclick="confirmarTransporte('${p.conf_no}','entrada','Sierpe')">Es Sierpe</button>
              <button class="btn" onclick="confirmarTransporte('${p.conf_no}','entrada','Drake')">Es Drake</button>
            </div>` : ""}
          ${p.punto_salida_sin_confirmar ? `
            <div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;">

              <button class="btn" style="margin-left:8px;" onclick="confirmarTransporte('${p.conf_no}','salida','Sierpe')">Es Sierpe</button>
              <button class="btn" onclick="confirmarTransporte('${p.conf_no}','salida','Drake')">Es Drake</button>
            </div>` : ""}
        `).join("")}` : ""}
    </div>
  `;
}

async function confirmarTransporte(confNo, tipo, punto) {
  await fetchAuth(`${API}/api/reservas/${confNo}/transporte?tipo=${tipo}&punto=${punto}`, { method: "POST" });
  avisar(`Confirmado: ${tipo} por ${punto}`);
  loadTransporte();
}

// ---------- ENTRADAS SINAC ----------
async function loadEntradas(desde, hasta) {
  setActive(4);
  // Esta pantalla mantiene su propio rango, mirando hacia adelante: lo útil es ver
  // qué falta comprar en los próximos meses, no lo que ya pasó.
  if (desde) FILTROS.sinac.desde = desde;
  if (hasta) FILTROS.sinac.hasta = hasta;
  desde = FILTROS.sinac.desde; hasta = FILTROS.sinac.hasta;
  const res = await fetchAuth(`${API}/api/entradas-sinac?desde=${desde}&hasta=${hasta}`);
  const rows = await res.json();
  const vencidas = rows.filter(e => e.urgencia === "VENCIDA").length;
  const urgentes = rows.filter(e => e.urgencia === "URGENTE").length;
  const aTiempo  = rows.filter(e => e.urgencia === "A_TIEMPO").length;
  const compradas = rows.filter(e => e.estado === "COMPRADA").length;
  window._sinacRows = rows;
  const colorUrg = { VENCIDA:"fila-sale", URGENTE:"fila-entra", A_TIEMPO:"", OK:"", PASADA:"fila-salio", SIN_FECHA:"" };
  const textoUrg = (e) => {
    if (e.estado === "COMPRADA") return "—";
    if (e.urgencia === "PASADA") return "Tour ya pasó";
    if (e.dias_para_limite === null) return "—";

function detalleSinac(urgencia) {
  const panel = document.getElementById("sinac-detalle");
  if (window._sinacAbierto === urgencia) {
    window._sinacAbierto = null;
    panel.innerHTML = "";
    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._sinacAbierto = urgencia;
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");
  const titulos = {
    VENCIDA: "Plazo de compra vencido",
    URGENTE: "Urgentes — quedan 7 días o menos",
    A_TIEMPO: "A tiempo",
    OK: "Ya compradas",
  };
  const lista = (window._sinacRows || []).filter(e => e.urgencia === urgencia);
  if (!lista.length) {
    panel.innerHTML = `<div class="detail-panel">No hay entradas en esta categoría.</div>`;
    return;
  }
  // Se agrupa por reserva para ver, huésped por huésped, qué entradas le corresponden
  const porReserva = {};
  lista.forEach(e => (e.reservas || []).forEach(r => {
    const k = r.conf_no;
    if (!porReserva[k]) porReserva[k] = { ...r, entradas: [] };
    porReserva[k].entradas.push(e);
  }));
  const reservas = Object.values(porReserva);
  const totalEntradas = lista.reduce((s, e) => s + (e.pax_total_grupo || 0), 0);

  panel.innerHTML = `
    <div class="detail-panel">
      <p style="font-weight:600;margin:0 0 4px;">${titulos[urgencia]} — ${lista.length} salidas · ${totalEntradas} entradas en total</p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Toca el número de reserva para ver toda su información.</p>
      ${reservas.length ? reservas.map(r => `
        <div style="border-bottom:1px solid var(--border);padding:8px 0;">
          <p style="margin:0;font-weight:600;">
            <a href="#" onclick="verDetalleReserva('${r.conf_no}'); return false;" style="color:var(--forest);text-decoration:underline;">${r.conf_no}</a>
            · Hab. ${r.room_no} · ${r.nombre_principal}
            <span style="font-weight:400;color:var(--muted);">(${r.adl + r.chl} pax)</span>
          </p>
          ${r.entradas.map(e => `<p style="margin:3px 0 0;font-size:12px;">
              <span class="badge badge-tour">${e.tour_codigo}</span> ${e.fecha}
              · comprar antes de <strong>${e.fecha_limite_compra || "—"}</strong>
              ${e.dias_para_limite !== null && e.estado !== "COMPRADA"
                ? (e.dias_para_limite < 0 ? ` · <span style="color:var(--danger-text);">venció hace ${Math.abs(e.dias_para_limite)} d</span>`
                                          : ` · faltan ${e.dias_para_limite} d`)
                : ""}
              ${e.conf_entrada ? ` · conf. ${e.conf_entrada}` : ""}
            </p>`).join("")}
        </div>`).join("")
      : `<p style="font-size:13px;color:var(--muted);">Estas entradas no tienen reservas asociadas visibles.</p>`}
    </div>`;
}

// ---------- AMENIDADES / TAREAS ----------
// Mismo manejo de fechas que Agenda y Transporte: abre en el día de hoy y desde ahí
// se puede mover de día o pasar a un rango. `fecha` nula significa "ver rango".
async function loadAmenidades(fecha, desdeNuevo, hastaNuevo, estadoNuevo) {
  setActive(5);
  const F = FILTROS.amenidades;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desdeNuevo) F.desde = desdeNuevo;
  if (hastaNuevo) F.hasta = hastaNuevo;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  // El servidor filtra por la fecha de llegada del huésped, que es cuando hay que
  // tener la amenidad lista: en vista de día son las de quien entra ese día.
  const desde = fecha || F.desde, hasta = fecha || F.hasta;
  const estado = estadoNuevo !== undefined ? estadoNuevo : (window._amenEstado || "");
  window._amenEstado = estado;

  const qs = new URLSearchParams({ desde, hasta });
  if (estado) qs.append("estado", estado);
  const rows = await (await fetchAuth(`${API}/api/amenidades?${qs}`)).json();
  const pend = rows.filter(a => a.estado === "PENDIENTE").length;
  const hechas = rows.filter(a => a.estado === "HECHA").length;

  // Agrupar por área responsable, que es como trabaja el staff
  const porArea = {};
  rows.forEach(a => { (porArea[a.area_responsable] = porArea[a.area_responsable] || []).push(a); });

  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Amenidades y tareas ${fecha ? etiquetaFecha(fecha) : ""}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadAmenidades(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha || ""}" onchange="loadAmenidades(this.value)">
          <button class="btn" onclick="loadAmenidades(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadAmenidades(hoyISO())">Hoy</button>
          <button class="btn" onclick="loadAmenidades(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="am-desde" value="${F.desde}">
          <input type="date" id="am-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadAmenidades(null, document.getElementById('am-desde').value, document.getElementById('am-hasta').value)">Ver rango</button>
          <select id="am-estado" onchange="loadAmenidades(undefined, undefined, undefined, this.value)">
            <option value="" ${estado===""?"selected":""}>Todas</option>
            <option value="PENDIENTE" ${estado==="PENDIENTE"?"selected":""}>Solo pendientes</option>
            <option value="HECHA" ${estado==="HECHA"?"selected":""}>Solo hechas</option>
          </select>
          <button class="btn" onclick="descargar('amenidades', {desde:'${desde}', hasta:'${hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('amenidades', {desde:'${desde}', hasta:'${hasta}'}, 'pdf')">⬇ PDF</button>
          ${puedeEscribir("amenidades") ? `<button class="btn btn-primary" onclick="mostrarFormAmenidad()">+ Agregar requerimiento</button>` : ""}
        </div>
      </div>
      <div id="form-amenidad"></div>
      <div class="stats" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="cursor:default;"><p class="stat-label">Total</p><p class="stat-value">${rows.length}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Pendientes</p><p class="stat-value" style="color:var(--warn-text);">${pend}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Hechas</p><p class="stat-value" style="color:var(--ok-text);">${hechas}</p></div>
      </div>
      <p class="subtitle" style="margin-bottom:12px;">Se muestran según la fecha de llegada del huésped, que es cuando deben estar listas.</p>
      ${rows.length ? Object.entries(porArea).map(([area, lista]) => `
        <p style="font-weight:600;font-size:14px;margin:16px 0 6px;color:var(--forest);">${area} (${lista.length})</p>
        <table>
          <tr><th>Llegada</th><th>Hab.</th><th>Huésped</th><th>Amenidad</th><th>Tarea</th><th>Estado</th>${puedeEscribir("amenidades")?"<th></th>":""}</tr>
          ${lista.map(a => `
            <tr class="${a.estado === 'HECHA' ? 'fila-salio' : ''}">
              <td>${a.arr_date}</td>
              <td>${a.room_no}${etiquetaGrupo(a.conf_no)}</td>
              <td>${a.nombre_principal}</td>
              <td><span class="badge badge-tour">${a.amenidad}</span>${a.origen === 'MANUAL' ? ' <span style="font-size:10px;color:var(--muted);">(manual)</span>' : ''}</td>
              <td style="font-size:12px;color:var(--muted);">${a.detalle ? `<strong style="color:var(--text);">${a.detalle}</strong><br>` : ''}${a.tarea}</td>
              <td><span class="badge ${a.estado === 'HECHA' ? 'badge-ok' : 'badge-warn'}">${a.estado}</span></td>
              ${puedeEscribir("amenidades") ? `<td><button class="btn" onclick="marcarAmenidad(${a.id}, '${a.estado === 'HECHA' ? 'PENDIENTE' : 'HECHA'}')">${a.estado === 'HECHA' ? 'Reabrir' : 'Marcar hecha'}</button>${a.origen === 'MANUAL' ? `<button class="btn" onclick="eliminarAmenidad(${a.id})">Eliminar</button>` : ''}</td>` : ""}
            </tr>`).join("")}
        </table>`).join("") : `<p class="empty">No hay amenidades en estas fechas.<small>Se detectan al importar el PDF, y puedes agregar requerimientos a mano con el botón de arriba.</small></p>`}
    </div>
  `;
}

async function crearAmenidad() {
  const payload = {
    conf_no: document.getElementById("na-conf").value.trim(),
    amenidad: document.getElementById("na-tipo").value,
    detalle: document.getElementById("na-detalle").value.trim(),
    area_responsable: document.getElementById("na-area").value,
  };
  if (!payload.conf_no) { document.getElementById("na-error").textContent = "Indica el número de reserva."; return; }
  payload.tarea = payload.detalle || payload.amenidad;
  const res = await fetchAuth(`${API}/api/amenidades`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) { document.getElementById("na-error").textContent = (await res.json()).detail; return; }
  loadAmenidades();
}

async function eliminarAmenidad(id) {
  if (!confirm("¿Eliminar este requerimiento?")) return;
  await fetchAuth(`${API}/api/amenidades/${id}`, { method: "DELETE" });
  avisar("Requerimiento eliminado");
  loadAmenidades();
}

async function marcarAmenidad(id, estado) {
  await fetchAuth(`${API}/api/amenidades/${id}/estado?estado=${estado}`, { method: "POST" });
  avisar(estado === "HECHA" ? "Marcada como hecha" : "Reabierta");
  loadAmenidades();
}

async function abrirPermisos(userId, username) {
  // Se relee la lista para traer los permisos que el usuario tiene HOY. Antes esta
  // consulta no devolvía permisos_json, así que el editor abría siempre en blanco y
  // al guardar borraba lo que estuviera configurado.
  const usuarios = await (await fetchAuth(`${API}/api/usuarios`)).json();
  const u = usuarios.find(x => x.id === userId) || {};
  const actuales = permisosDe(u);
  const sinConfigurar = !Object.keys(actuales).length;

  const fondo = document.createElement("div");
  fondo.className = "modal-fondo"; fondo.id = "modal-pm";
  fondo.innerHTML = `<div class="modal-caja" style="max-width:760px;">
    <div class="modal-encabezado">
      <div><p class="title">Permisos de ${username}</p>
        <p class="subtitle">Botón por botón: si no entra, si solo mira o si puede modificar</p></div>
      <button class="btn" onclick="document.getElementById('modal-pm').remove()">Cerrar</button>
    </div>
    <div class="modal-cuerpo">
      ${sinConfigurar ? `<div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 10px;font-size:12.5px;">
        Este usuario no tiene ninguna pantalla marcada, así que hoy no puede entrar a
        nada. Aplica un perfil o marca las pantallas que necesite.</div>` : ""}
      ${gridPermisos("pm", actuales)}
      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="guardarPermisos(${userId})">Guardar permisos</button>
      </div>
    </div></div>`;
  document.body.appendChild(fondo);
}

async function guardarPermisos(userId) {
  const permisos = leerPermisos("pm");
  if (!Object.keys(permisos).length &&
      !confirm("No marcaste ninguna pantalla: el usuario quedará SIN ACCESO a nada del sistema. ¿Continuar?")) {
    return;
  }
  await fetchAuth(`${API}/api/usuarios/${userId}/permisos`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ permisos }),
  });
  document.getElementById("modal-pm")?.remove();
  avisar("Permisos guardados");
  loadUsuarios();
}

        ${x.de} → <strong>${x.a}</strong> · ${x.motivo}

    <div class="card">

      ${(d.cenas_privadas_sin_noche || []).length ? `
        <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:11px 13px;margin-top:12px;font-size:13px;">
          <p style="margin:0 0 6px;font-weight:600;">⚠ Contratadas sin noche asignada (${d.cenas_privadas_sin_noche.length})</p>
          <p style="margin:0 0 8px;font-size:12px;">El PDF avisa que estos huéspedes tienen cena privada, pero no dice qué día.
             Mientras no se le ponga la noche, <strong>no se le guarda mesa en Bar el Bosque ni cocina la ve venir</strong>.</p>
          ${d.cenas_privadas_sin_noche.map(p => `

              <strong>Hab. ${p.room_no}</strong> · ${p.nombre_principal}

              ${p.detalle ? `<br><span style="font-size:11.5px;">${p.detalle}</span>` : ""}

                  onclick="abrirCenaPrivada('${F.fecha}', '${p.conf_no}')">Es esta noche</button>` : ""}
            </p>`).join("")}
        </div>` : ""}

      ${puedeEscribir("restaurantes") ? `<button class="btn" style="margin-top:12px;" onclick="abrirCenaPrivada('${F.fecha}')">Marcar cena privada</button>` : ""}

  `;
}

// ---------- Régimen de comidas ----------
// Quiénes comen en el lodge ese día son los mismos que aparecen en la cena: quien
// entra y quien está en casa. Los que salen no cuentan, el bote se va de madrugada.
// Así el conteo del día no necesita pedir nada más al servidor.
function enCasaHoy(d) {
  return [...d.cena.terra_kitchen, ...d.cena.bar_el_bosque];
}
function porRegimen(d, regimen) {
  return enCasaHoy(d).filter(x => (x.regimen || "SIN_DATO") === regimen);
}
function paxFullBoard(d) {
  return porRegimen(d, "PENSION_COMPLETA").reduce((s, x) => s + x.pax, 0);
}
function habsFullBoard(d) {
  return porRegimen(d, "PENSION_COMPLETA").length;
}

const ORDEN_REGIMEN = ["PENSION_COMPLETA", "DESAYUNO_CENA", "SOLO_DESAYUNO",
                       "COMEDOR_TRABAJADORES", "SIN_DATO"];
const NOMBRE_REGIMEN = {
  PENSION_COMPLETA: "Full board · comidas incluidas",
  DESAYUNO_CENA: "Solo desayuno y cena",
  SOLO_DESAYUNO: "Solo desayuno",
  COMEDOR_TRABAJADORES: "Come en el comedor de trabajadores",
  SIN_DATO: "El PDF no indicó el régimen",
};

function detalleRegimen() {
  const d = window._restData;
  const panel = document.getElementById("rest-detalle");
  const F = FILTROS.restaurantes;
  const grupos = ORDEN_REGIMEN
    .map(r => [r, porRegimen(d, r)])
    .filter(([, lista]) => lista.length);

  panel.innerHTML = `<div class="detail-panel">
    <p style="font-weight:600;margin:0 0 4px;">Régimen de comidas · ${F.fecha}</p>
    <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">
      Habitaciones que comen en el lodge ese día: quien entra y quien está en casa.</p>
    ${grupos.map(([regimen, lista]) => `
      <p style="margin:10px 0 4px;font-weight:600;font-size:13px;">
        ${NOMBRE_REGIMEN[regimen]}
        <span style="font-weight:400;color:var(--muted);">— ${lista.length} hab.,
          ${lista.reduce((s, x) => s + x.pax, 0)} pax</span></p>
      <table>
        <tr><th>Hab.</th><th>Huésped</th><th>Pax</th><th></th></tr>
        ${lista.map(x => `<tr class="${x.tipo === 'ENTRA' ? 'fila-entra' : ''}">
          <td><strong>${x.room_no || '—'}</strong>${etiquetaGrupo(x.conf_no)}</td>
          <td>${x.nombre}</td>
          <td>${x.pax}</td>
          <td>${x.tipo === 'ENTRA' ? '<span class="badge badge-warn">entra</span>' : ''}</td>
        </tr>`).join("")}
      </table>`).join("")}

    <div class="filterbar" style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
      <span style="font-size:12.5px;color:var(--muted);">Ver por rango:</span>
      <input type="date" id="rg-desde" value="${F.fecha}">
      <input type="date" id="rg-hasta" value="${masDiasISO(7)}">
      <button class="btn" onclick="verRegimenRango()">Ver rango</button>
    </div>
    <div id="rg-rango"></div>
  </div>`;
}

async function verRegimenRango() {
  const desde = document.getElementById("rg-desde").value;
  const hasta = document.getElementById("rg-hasta").value;
  const caja = document.getElementById("rg-rango");
  caja.innerHTML = `<p class="empty" style="padding:12px;">Contando…</p>`;
  const d = await (await fetchAuth(`${API}/api/restaurantes/regimen?desde=${desde}&hasta=${hasta}`)).json();
  const cols = ORDEN_REGIMEN.filter(r => d.totales[r]);
  caja.innerHTML = `
    <p style="font-weight:600;font-size:13px;margin:14px 0 4px;">Del ${d.desde} al ${d.hasta}</p>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 8px;">
      Cada día cuenta aparte: quien se queda tres noches suma tres veces, que es lo que
      importa para el servicio.${d.recortado ? " El rango se recortó a 92 días." : ""}</p>
    <table>
      <tr><th>Fecha</th>${cols.map(r => `<th>${NOMBRE_REGIMEN[r].split(" · ")[0]}</th>`).join("")}</tr>
      ${d.dias.map(dia => `<tr>
        <td>${dia.fecha}</td>
        ${cols.map(r => {
          const v = dia.resumen[r];
          return `<td>${v ? `${v.pax} pax <span style="font-size:11px;color:var(--muted);">(${v.habitaciones} hab.)</span>` : "—"}</td>`;
        }).join("")}
      </tr>`).join("")}
      <tr style="font-weight:600;background:var(--surface-2, #F3F1EA);">
        <td>Total</td>
        ${cols.map(r => `<td>${d.totales[r].pax} pax <span style="font-size:11px;">(${d.totales[r].habitaciones} hab.)</span></td>`).join("")}
      </tr>
    </table>`;
}

function detalleRest(cual) {
  const d = window._restData;
  const panel = document.getElementById("rest-detalle");
  if (window._restAbierto === cual) {
    window._restAbierto = null; panel.innerHTML = "";
    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._restAbierto = cual;
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");

  // El régimen no es un restaurante: se agrupa por lo que trae pagado el huésped.
  if (cual === "regimen") { detalleRegimen(); return; }

  const mapa = {
    cena_tk: ["Cena en Terra Kitchen", d.cena.terra_kitchen, "CENA", "Bar el Bosque"],
    cena_bosque: ["Cena en Bar el Bosque", d.cena.bar_el_bosque, "CENA", "Terra Kitchen"],
    alm_tk: ["Almuerzo en Terra Kitchen", d.almuerzo.terra_kitchen, "ALMUERZO", "Bar el Bosque"],
    alm_bosque: ["Almuerzo en Bar el Bosque", d.almuerzo.bar_el_bosque, "ALMUERZO", "Terra Kitchen"],
  };
  const [titulo, lista, comida, destino] = mapa[cual];
  const esCena = comida === "CENA";
  if (!lista.length) { panel.innerHTML = `<div class="detail-panel">Nadie asignado.</div>`; return; }

  // Lo que el salonero necesita saber de un vistazo: si esta comida se la trae pagada.
  // Se distingue "no la trae" (ámbar, hay que cobrarla) de "el PDF no lo dijo" (gris),
  // porque no es lo mismo y no se le puede negar una comida por un dato que no vino.
  const sinComida = lista.filter(x => x.incluye_esta_comida === false);
  const celdaComida = x => {
    if (x.incluye_esta_comida === false) {
      return `<span class="badge" style="background:#E5A93B;color:#3A2B08;font-weight:600;">
                ${comida === "CENA" ? "cena" : "almuerzo"} NO incluido</span>
              <br><span style="font-size:10.5px;color:var(--muted);">${x.regimen_texto}</span>`;
    }
    if (x.incluye_esta_comida === true) {
      return `<span class="badge badge-ok">incluido</span>`;
    }
    return `<span style="font-size:11px;color:var(--muted);" title="El PDF no indicó el régimen">sin dato</span>`;
  };

  panel.innerHTML = `<div class="detail-panel">
    <p style="font-weight:600;margin:0 0 8px;">${titulo} — ${lista.length} habitación(es),
      ${lista.reduce((s,x)=>s+x.pax,0)} pax</p>
    ${sinComida.length ? `<div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 10px;font-size:12.5px;">
      ⚠ <strong>${sinComida.length} habitación(es)</strong> con ${esCena ? "la cena" : "el almuerzo"} NO incluido:
      ${sinComida.map(x => `hab. ${x.room_no || "—"} (${x.regimen_texto})`).join(" · ")}.
      Se les cobra aparte.</div>` : ""}
    <table>
      <tr><th>Hab.</th><th>Huésped</th><th>Pax</th><th>Noche</th><th>${esCena ? "Cena" : "Almuerzo"}</th><th></th>
        ${esCena ? "<th>Hora reservada</th>" : ""}${puedeEscribir("restaurantes") ? "<th></th>" : ""}</tr>
      ${lista.map(x => `<tr class="${x.tipo === 'ENTRA' ? 'fila-entra' : ''}">
        <td><strong>${x.room_no || '—'}</strong>${etiquetaGrupo(x.conf_no)}</td>
        <td>${x.nombre}${x.grupo ? ' <span class="badge badge-tour">grupo</span>' : ''}</td>
        <td>${x.pax}</td>
        <td style="font-size:11.5px;color:var(--muted);">${x.noche_estadia || 1} de ${x.noches}</td>
        <td>${celdaComida(x)}</td>
        <td>${x.tipo === 'ENTRA' ? '<span class="badge badge-warn">entra</span>' : ''}
            ${x.fijo ? `<span class="badge badge-tour">${x.fijo}</span>` : ''}
            ${x.manual ? '<span class="badge badge-ok">cambio manual</span>' : ''}</td>
        ${esCena ? `<td><input type="time" value="${x.hora || ''}"
            onchange="guardarHoraMesa('${d.fecha}','${x.conf_no}',this.value)"
            style="font-size:11.5px;padding:2px 4px;width:96px;" ${puedeEscribir("restaurantes")?'':'disabled'}></td>` : ""}
        ${puedeEscribir("restaurantes") ? `<td>${x.fijo && x.fijo.includes('privada') ? '<span style="font-size:11px;color:var(--muted);">fija</span>'
          : `<button class="btn" onclick="cambiarRestaurante('${d.fecha}','${x.conf_no}','${comida}','${destino}')">A ${destino.split(' ')[0]}</button>`}</td>` : ""}
      </tr>`).join("")}
    </table>
    ${esCena ? '<p style="font-size:11px;color:var(--muted);margin-top:8px;">La hora de cada mesa la registra el salonero en la mañana.</p>' : ""}
  </div>`;
}

async function cambiarRestaurante(fecha, confNo, comida, restaurante) {
  const res = await fetchAuth(`${API}/api/restaurantes/cambiar`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fecha, conf_no: confNo, comida, restaurante }),
  });
  if (!res.ok) { avisar((await res.json()).detail || "No se pudo cambiar", true); return; }
  const d = await res.json();
  avisar(d.aviso_capacidad ? d.aviso_capacidad : `Cambiado a ${restaurante}`, !!d.aviso_capacidad);
  loadRestaurantes();
}

async function guardarHoraMesa(fecha, confNo, hora) {
  await fetchAuth(`${API}/api/restaurantes/hora`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fecha, conf_no: confNo, hora }),
  });
  avisar(hora ? `Mesa a las ${hora}` : "Hora borrada");
}

async function abrirCenaPrivada(fecha, confNo) {
  const d = window._restData;
  const enCasa = [...d.cena.terra_kitchen, ...d.cena.bar_el_bosque];
  // Si se entra desde una cena contratada sin noche, ya viene elegido el huésped.
  const opciones = enCasa.map(x => `<option value="${x.conf_no}" ${x.conf_no === confNo ? "selected" : ""}>Hab. ${x.room_no} · ${x.nombre}</option>`).join("");
  const fondo = document.createElement("div");
  fondo.className = "modal-fondo"; fondo.id = "modal-cp";
  fondo.innerHTML = `<div class="modal-caja" style="max-width:520px;">
    <div class="modal-encabezado"><p class="title">Marcar cena privada</p>
      <button class="btn" onclick="document.getElementById('modal-cp').remove()">Cerrar</button></div>
    <div class="modal-cuerpo">
      <p style="font-size:13px;color:var(--muted);">Noche del ${fecha}. La cena privada se sirve
        en la piscina y queda fija en Bar el Bosque, contando para su capacidad.</p>
      <select id="cp-conf" style="width:100%;margin:8px 0;">${opciones}</select>
      <input type="text" id="cp-detalle" placeholder="Detalle (opcional): aniversario, decoración…" style="width:100%;">
      <div style="margin-top:12px;">
        <button class="btn btn-primary" onclick="guardarCenaPrivada('${fecha}')">Guardar</button>
      </div>
    </div></div>`;
  document.body.appendChild(fondo);
}

async function guardarCenaPrivada(fecha) {
  const conf_no = document.getElementById("cp-conf").value;
  const detalle = document.getElementById("cp-detalle").value.trim();
  await fetchAuth(`${API}/api/restaurantes/cena-privada`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fecha, conf_no, detalle }),
  });
  document.getElementById("modal-cp")?.remove();
  avisar("Cena privada marcada");
  loadRestaurantes();
}

// Mismo manejo de fechas que Agenda y Transporte: abre en el día de hoy y desde ahí
// se puede mover de día o pasar a un rango. `fecha` nula significa "ver rango".
// Aquí el rango es lo habitual —un informe de un solo día dice poco—, pero se abre
// en hoy para que todas las pantallas se comporten igual.
async function loadAnalitica(fecha, desdeNuevo, hastaNuevo) {
  setActive(7);
  const F = FILTROS.analitica;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desdeNuevo) F.desde = desdeNuevo;
  if (hastaNuevo) F.hasta = hastaNuevo;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  const desde = fecha || F.desde, hasta = fecha || F.hasta;
  window._boteAbierto = null; window._guiaAbierto = null;
  const res = await fetchAuth(`${API}/api/analitica?desde=${desde}&hasta=${hasta}`);
  const d = await res.json();
  let ocu = null;
  try { ocu = await (await fetchAuth(`${API}/api/ocupacion?desde=${desde}&hasta=${hasta}`)).json(); } catch (e) {}
  const app = document.getElementById("app");
  const maxBote = Math.max(...d.uso_botes.map(b => b.tours), 1);
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Analítica operativa ${fecha ? etiquetaFecha(fecha) : ""}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadAnalitica(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha || ""}" onchange="loadAnalitica(this.value)">
          <button class="btn" onclick="loadAnalitica(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadAnalitica(hoyISO())">Hoy</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="an-desde" value="${F.desde}">
          <input type="date" id="an-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadAnalitica(null, document.getElementById('an-desde').value, document.getElementById('an-hasta').value)">Ver rango</button>
          <button class="btn" onclick="descargar('analitica', {desde:'${desde}', hasta:'${hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('analitica', {desde:'${desde}', hasta:'${hasta}'}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      <p class="subtitle">${desde === hasta ? desde : `${desde} a ${hasta}`}</p>
      <p style="font-weight:600;font-size:14px;margin-top:14px;">Uso de botes por actividad <span style="font-weight:400;color:var(--muted);font-size:12px;">(toca un bote)</span></p>
      ${d.uso_botes.map(b => `
        <div class="bar-row pulsable" style="display:flex;align-items:center;gap:10px;margin-bottom:6px;cursor:pointer;border-radius:5px;padding:2px 4px;" onclick="mostrarDetalleBote('${b.bote_nombre}','${desde}','${hasta}')">
          <span style="width:80px;font-size:12px;color:var(--muted);">${b.bote_nombre}</span>
          <div style="flex:1;background:#FAF8F2;border-radius:4px;height:16px;"><div style="width:${(b.tours / maxBote) * 100}%;background:var(--forest);height:100%;border-radius:4px;"></div></div>
          <span style="width:28px;font-size:12px;text-align:right;">${b.tours}</span>
        </div>`).join("")}
      <div id="detalle-bote"></div>

      <div class="cols2" style="margin-top:16px;">

          <p style="font-weight:600;font-size:14px;">Actividades por guía <span style="font-weight:400;color:var(--muted);font-size:12px;">(toca un nombre)</span></p>

            ${d.actividades_por_guia.map(g => `

function detalleResumen(campo) {
  const d = window._resData;
  const esPunto = campo.startsWith("punto:");
  const panel = document.getElementById(esPunto ? "res-punto" : "res-detalle");
  // Segundo toque en el mismo bloque: se cierra
  if (window._resAbierto === campo) {
    window._resAbierto = null;
    panel.innerHTML = "";
    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._resAbierto = campo;
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");

  if (esPunto) {
    const nombre = campo.slice(6);
    const p = (d.puntos || []).find(x => x.punto === nombre);
    panel.innerHTML = `<div class="detail-panel">
      <p style="font-weight:600;margin:0 0 8px;">${nombre} — ${p.detalle.length} movimiento(s)</p>
      <table><tr><th>Tipo</th><th>Hab.</th><th>Huésped</th><th>Pax</th><th>Vuelo</th><th>Hora</th></tr>
      ${p.detalle.map(x => `<tr class="${x.tipo === 'Entrada' ? 'fila-entra' : 'fila-sale'}">
        <td>${x.tipo}</td><td>${x.room_no}</td><td>${x.nombre}</td>
        <td>${x.pax}</td><td>${x.vuelo || '—'}</td><td>${x.hora || '—'}</td></tr>`).join("")}
      </table></div>`;
    return;
  }

  const titulos = { ingresos: "Ingresos del día", salidas: "Salidas del día",
                    desayunos: "Desayunos", en_casa: "En casa" };
  const lista = d[campo] || [];
  if (!lista.length) {
    panel.innerHTML = `<div class="detail-panel">Sin registros.</div>`;
    return;
  }
  const esIngreso = campo === "ingresos", esSalida = campo === "salidas";
  panel.innerHTML = `<div class="detail-panel">
    <p style="font-weight:600;margin:0 0 8px;">${titulos[campo]} — ${lista.length} habitación(es)</p>
    <table>
      <tr><th>Hab.</th><th>Huésped</th><th>Pax</th>
        ${esIngreso || esSalida ? "<th>Punto</th><th>Vuelo</th><th>Hora</th>" : ""}
        ${campo === "en_casa" ? "<th>Sale</th>" : ""}
      </tr>
      ${lista.map(x => `<tr>
        <td><strong>${x.room_no}</strong>${etiquetaGrupo(x.conf_no)}</td><td>${x.nombre_principal}</td>
        <td>${(x.adl||0)+(x.chl||0)}</td>
        ${esIngreso ? `<td>${x.punto_entrada || '—'}</td><td>${x.vuelo_entrada || '—'}</td><td>${x.hora_vuelo_entrada || x.arr_time || '—'}</td>` : ""}
        ${esSalida ? `<td>${x.punto_salida || '—'}</td><td>${x.vuelo_salida || '—'}</td><td>${x.hora_vuelo_salida || '—'}</td>` : ""}
        ${campo === "en_casa" ? `<td>${x.dep_date || '—'}</td>` : ""}
      </tr>`).join("")}
    </table></div>`;
}

// ---------- OPERA CLOUD ----------

// Todo lo que viene del servidor se escapa antes de meterlo en la página: los detalles
// de error de Opera son texto que llega de Oracle, y no puede convertirse en etiquetas.
function escHtml(v) {
  return String(v == null ? "" : v).replace(/[&<>"']/g,
    c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const TEXTO_CICLO_OPERA = {
  OK: ["badge-ok", "al día"],
  SIN_CONEXION: ["badge-warn", "sin conexión con Opera"],
  SIN_CONFIGURAR: ["badge-warn", "falta configurar"],
  SIN_RESERVAS: ["badge-tour", "no llegaron reservas"],
  ERROR: ["badge-warn", "error"],
  "nunca ejecutado": ["badge-tour", "todavía no ha corrido"],
};

async function pintarEstadoOpera() {
  const caja = document.getElementById("opera-estado");
  if (!caja) return;
  let d;
  try {
    d = await (await fetchAuth(`${API}/api/opera/estado`)).json();
  } catch (e) { caja.innerHTML = `<p class="empty">No se pudo consultar.</p>`; return; }

  if (!d.configurado) {
    caja.innerHTML = `
      <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:12px 14px;font-size:13px;">
        <p style="margin:0 0 6px;font-weight:600;">Todavía no está conectado</p>
        <p style="margin:0;">Cuando esté configurado, el sistema le pide las reservas a Opera
        cada media hora y las carga solo: mismos tours, mismos grupos y mismas entradas del
        SINAC que con el PDF. El PDF sigue funcionando igual, por si acaso.</p>
        <p style="margin:8px 0 0;font-size:12px;">Falta definir en el servidor:
        ${d.faltantes.map(v => `<strong>${escHtml(v)}</strong>`).join(", ")}.</p>
        <p style="margin:8px 0 0;font-size:12px;">Esos datos salen de la ficha de la
        aplicación en OHIP. Se ponen como variables de entorno en Railway — nunca dentro
        del sistema, para que no queden guardados en ningún archivo.</p>
      </div>`;
    return;
  }

  const c = d.config, u = d.ultimo_ciclo;
  const [clase, texto] = TEXTO_CICLO_OPERA[u.resultado] || ["badge-tour", u.resultado];
  caja.innerHTML = `
    <div style="background:${c.activo ? "var(--ok-bg)" : "var(--warn-bg)"};color:${c.activo ? "var(--ok-text)" : "var(--warn-text)"};border-radius:var(--r-sm);padding:11px 13px;font-size:13px;margin-bottom:12px;">
      ${c.activo
        ? `Encendida · consulta Opera cada <strong>${c.intervalo_minutos}</strong> minutos`
        : `<strong>Apagada</strong> · la conexión funciona, pero no está trayendo nada todavía`}
      <br>Ventana: del <strong>${escHtml(d.ventana.desde)}</strong> al
      <strong>${escHtml(d.ventana.hasta)}</strong>
      (${c.dias_atras} día(s) atrás y ${c.dias_adelante} adelante)
    </div>

    <p style="font-weight:600;font-size:13px;margin:0 0 6px;">Último intento</p>
    <p style="font-size:13px;margin:0 0 14px;">
      <span class="badge ${clase}">${escHtml(texto)}</span>
      ${u.ultimo_intento ? ` · ${escHtml(u.ultimo_intento.replace("T", " "))}` : ""}
      ${u.resultado === "OK" ? `<br>${u.reservas_cargadas} reservas cargadas${u.descartadas ? ` · ${u.descartadas} descartadas` : ""}` : ""}
      ${u.detalle ? `<br><span style="font-size:11.5px;color:var(--muted);">${escHtml(u.detalle.slice(0, 200))}</span>` : ""}
      ${u.completo === false ? `<br><span style="font-size:11.5px;color:var(--muted);">La descarga vino incompleta, así que no se canceló ninguna reserva.</span>` : ""}
    </p>

    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button class="btn" onclick="operaProbar()">Probar la conexión</button>
      <button class="btn" onclick="operaVistaPrevia()">Ver qué llegaría</button>
      <button class="btn btn-primary" onclick="operaSincronizar()">Sincronizar ahora</button>
      <button class="btn" onclick="operaEncender(${c.activo ? "false" : "true"})">
        ${c.activo ? "Apagar la sincronización" : "Encender la sincronización"}
      </button>
    </div>
    <p style="font-size:11.5px;color:var(--muted);margin:8px 0 0;">
      Antes de encenderla conviene usar <strong>Ver qué llegaría</strong>: eso descarga de
      Opera y muestra lo que entraría, sin guardar nada.
    </p>
    <div id="opera-resultado"></div>`;
}

function operaTrabajando(mensaje) {
  const caja = document.getElementById("opera-resultado") || document.getElementById("opera-estado");
  if (caja) caja.innerHTML = `<div class="trabajando"><div class="giro"></div><p>${escHtml(mensaje)}</p></div>`;
}

async function operaProbar() {
  operaTrabajando("Autenticando contra Opera…");
  const r = await (await fetchAuth(`${API}/api/opera/probar`, { method: "POST" })).json();
  if (r.estado === "OK") avisar("Conexión correcta con Opera Cloud");
  else if (r.estado === "SIN_CONFIGURAR") avisar("Faltan credenciales: " + r.faltantes.join(", "), true);
  else avisar("No se pudo conectar: " + (r.detalle || ""), true);
  pintarEstadoOpera();
}

async function operaVistaPrevia() {
  operaTrabajando("Consultando Opera… (no se guarda nada)");
  const r = await (await fetchAuth(`${API}/api/opera/vista-previa`, { method: "POST" })).json();
  pintarEstadoOpera();
  const caja = document.getElementById("opera-resultado");
  if (!caja) return;
  if (r.estado !== "VISTA_PREVIA") {
    avisar(r.mensaje || r.detalle || "No se pudo consultar Opera", true);
    return;
  }
  caja.innerHTML = `
    <p style="font-weight:600;font-size:13px;margin:16px 0 6px;">
      Esto es lo que entraría (todavía no se guardó nada)
    </p>
    <pre style="background:var(--sand);border:1px solid var(--border);border-radius:var(--r-sm);
                padding:12px;font-size:11.5px;overflow-x:auto;white-space:pre;">${escHtml(r.diagnostico)}</pre>
    <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0;">
      Si algún campo aparece vacío en TODAS las reservas, es que ese dato viene con otro
      nombre en esta propiedad y hay que ajustarlo. Avísale a quien lleva el sistema.
    </p>`;
}

async function operaSincronizar() {
  operaTrabajando("Trayendo reservas de Opera…");
  const r = await (await fetchAuth(`${API}/api/opera/sincronizar`, { method: "POST" })).json();
  if (r.estado === "OK") {
    // No hace falta recargar esta pantalla: fetchAuth ya avisó del cambio de datos,
    // y las demás pantallas se ponen al día solas cuando se entra a ellas.
    avisar(`${r.reservas_cargadas} reservas cargadas desde Opera`);
  } else {
    avisar(r.mensaje || r.detalle || "No se pudo sincronizar", true);
  }
  pintarEstadoOpera();
}

async function operaEncender(activo) {
  const res = await fetchAuth(`${API}/api/opera/config`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ activo }),
  });
  const r = await res.json();
  if (!res.ok) { avisar(r.detail || "No se pudo guardar", true); return; }
  avisar(activo ? "Sincronización encendida" : "Sincronización apagada");
  pintarEstadoOpera();
}

async function revisarBuzonAhora() {
  const caja = document.getElementById("buzon-estado");
  caja.innerHTML = `<div class="trabajando"><div class="giro"></div><p>Revisando el buzón…</p></div>`;
  const res = await fetchAuth(`${API}/api/buzon/revisar`, { method: "POST" });
  const r = await res.json();
  if (!res.ok) { avisar(r.detail || "No se pudo revisar", true); pintarEstadoBuzon(); return; }
  if (r.fallo) avisar("No se pudo entrar al buzón: " + r.fallo, true);
  else if (r.importados) avisar(`${r.importados} reporte(s) · ${r.reservas} reservas importadas`);
  else avisar(r.correos ? "Sin reportes nuevos que importar" : "No hay correos nuevos");
  pintarEstadoBuzon();
}

// ---------- Permisos por pantalla ----------
// La misma rejilla se usa al crear el usuario y al editarle los permisos después, para
// que las dos entradas ofrezcan exactamente las mismas opciones.
function permisosDe(u) {
  try { return JSON.parse(u.permisos_json || "{}") || {}; } catch (e) { return {}; }
}

function gridPermisos(prefijo, actuales) {
  const cat = window._catPermisos || { pantallas: [], perfiles: {} };
  return `
    <div class="filterbar" style="margin-bottom:10px;">
      <span style="font-size:12.5px;">Aplicar un perfil:</span>
      ${Object.keys(cat.perfiles).map(p =>
        `<button class="btn" onclick="aplicarPerfilA('${prefijo}','${p}')">${p}</button>`).join("")}
      <button class="btn" onclick="aplicarPerfilA('${prefijo}','__NADA__')">Limpiar todo</button>
    </div>
    <div class="filterbar" style="margin-bottom:10px;">
      <span style="font-size:12.5px;color:var(--muted);">Los perfiles los armas vos:</span>
      <button class="btn" onclick="guardarComoPerfil('${prefijo}')">Guardar esta combinación como perfil</button>
      ${Object.keys(cat.perfiles).length ? `<select id="${prefijo}-borrar-perfil" style="font-size:12px;">
          <option value="">— borrar un perfil —</option>
          ${Object.keys(cat.perfiles).map(p => `<option value="${p}">${p}</option>`).join("")}
        </select>
        <button class="btn" onclick="borrarPerfil('${prefijo}')">Borrar</button>` : ""}
    </div>
    <table>
      <tr><th>Pantalla (botón del menú)</th><th>Sin acceso</th><th>Solo ver</th><th>Ver y modificar</th></tr>
      ${cat.pantallas.map(p => {
        const nivel = actuales[p.clave] || "";
        const opcion = (valor, etiqueta) => `<td style="text-align:center;">
          <label style="font-size:12px;cursor:pointer;">
            <input type="radio" name="${prefijo}-${p.clave}" value="${valor}" ${nivel === valor ? "checked" : ""}>
            ${etiqueta}</label></td>`;
        return `<tr><td><strong>${p.nombre}</strong></td>
          ${opcion("", "—")}${opcion("ver", "ver")}${opcion("escribir", "modificar")}</tr>`;
      }).join("")}
    </table>`;
}

function leerPermisos(prefijo) {
  const permisos = {};
  document.querySelectorAll(`input[type=radio][name^="${prefijo}-"]:checked`).forEach(r => {
    if (r.value) permisos[r.name.slice(prefijo.length + 1)] = r.value;
  });
  return permisos;
}

function aplicarPerfilA(prefijo, nombre) {
  const p = nombre === "__NADA__" ? {} : (window._catPermisos.perfiles[nombre] || {});
  document.querySelectorAll(`input[type=radio][name^="${prefijo}-"]`).forEach(r => {
    r.checked = (p[r.name.slice(prefijo.length + 1)] || "") === r.value;
  });
}

async function guardarComoPerfil(prefijo) {
  const permisos = leerPermisos(prefijo);
  if (!Object.keys(permisos).length) {
    avisar("Marca al menos una pantalla antes de guardar el perfil", true);
    return;
  }
  const nombre = prompt("Nombre del perfil (ej. Salonero, Housekeeping):");
  if (!nombre || !nombre.trim()) return;
  const res = await fetchAuth(`${API}/api/permisos/perfiles`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ nombre: nombre.trim(), permisos }),
  });
  if (!res.ok) { avisar((await res.json()).detail || "No se pudo guardar el perfil", true); return; }
  avisar(`Perfil "${nombre.trim()}" guardado`);
  // Se recarga la pantalla para que el perfil nuevo aparezca en los botones.
  document.getElementById("modal-pm")?.remove();
  loadUsuarios();
}

async function borrarPerfil(prefijo) {
  const sel = document.getElementById(`${prefijo}-borrar-perfil`);
  const nombre = sel && sel.value;
  if (!nombre) { avisar("Elige el perfil a borrar", true); return; }
  if (!confirm(`¿Borrar el perfil "${nombre}"? Los usuarios que ya lo tenían aplicado no cambian.`)) return;
  await fetchAuth(`${API}/api/permisos/perfiles/${encodeURIComponent(nombre)}`, { method: "DELETE" });
  avisar(`Perfil "${nombre}" borrado`);
  document.getElementById("modal-pm")?.remove();
  loadUsuarios();
}

function resumenPermisos(u) {
  const actuales = permisosDe(u);
  const claves = Object.keys(actuales);
  if (!claves.length) {
    return `<span class="badge badge-warn" style="font-size:10.5px;">sin acceso a nada</span>`;
  }
  const cat = window._catPermisos || { pantallas: [] };
  const nombre = c => (cat.pantallas.find(p => p.clave === c) || {}).nombre || c;
  const partes = claves.map(c =>
    `<span class="badge ${actuales[c] === "escribir" ? "badge-ok" : "badge-tour"}"
       style="font-size:10.5px;">${nombre(c)}${actuales[c] === "escribir" ? " ✎" : ""}</span>`);
  return partes.join(" ");
}

          </tr>`).join("")}
      </table>
      <p style="font-size:11.5px;color:var(--muted);margin-top:10px;">
        ✎ = puede modificar en esa pantalla. Sin marca = solo la ve.
        El rol es solo una etiqueta: lo que cada persona puede hacer sale <strong>únicamente</strong>

async function crearUsuario() {
  const payload = {
    username: document.getElementById("nu-username").value.trim(),
    nombre_completo: document.getElementById("nu-nombre").value.trim(),
    password: document.getElementById("nu-password").value,
    rol: document.getElementById("nu-rol").value,
    permisos: leerPermisos("nu"),
  };
  const errEl = document.getElementById("nu-error");
  if (!payload.username || !payload.nombre_completo || !payload.password) {
    errEl.textContent = "Completa todos los campos.";
    return;
  }
  const res = await fetchAuth(`${API}/api/usuarios`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) {
    const err = await res.json();
    errEl.textContent = err.detail || "No se pudo crear el usuario.";
    return;
  }
  loadUsuarios();
}

async function guardarEdicionUsuario(userId) {
  const res = await fetchAuth(`${API}/api/usuarios/${userId}/editar`, {

async function cambiarPassword(id) {

  setActive(12);
  const F = FILTROS.publicacion;
  if (fechaNueva) F.fecha = fechaNueva;

  const R = d.resumen || {};
  // La configuración se ajusta una sola vez, así que arranca cerrada. Solo se abre
  // sola cuando falta la dirección, que es justo lo que hay que ir a poner ahí.
  const abierto = !d.configurado;

  const movTxt = { ENTRA: "Entra", SALE: "Sale", EN_CASA: "En casa", PROXIMO: "Próximo ingreso" };
  const claseFila = (m, tiene) => m === "ENTRA" ? "fila-entra"

    <div class="card">

        No hay nada que publicar: el itinerario se arma en el momento en que el huésped
        escanea su código, así que siempre muestra lo que hay ahora en el sistema.
      </div>` : `
      <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px;font-size:13px;">
        <p style="margin:0 0 4px;font-weight:600;">Falta indicar la dirección del sistema</p>
        <p style="margin:0;">Es la dirección por la que el celular del huésped alcanza este

      </div>`}

      <div class="stats" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="cursor:default;"><p class="stat-label">Habitaciones</p>
          <p class="stat-value">${R.habitaciones || 0}</p></div>

          <p class="stat-value">${R.con_huesped || 0}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Sin ocupante</p>
          <p class="stat-value">${R.sin_ocupante || 0}</p></div>
      </div>

      <div style="display:flex;gap:8px;flex-wrap:wrap;border-top:1px solid var(--border);padding-top:14px;margin-top:6px;">
        <button class="btn" onclick="descargarHojaQR()" ${d.base_url ? "" : "disabled"}>⬇ Hoja de códigos QR</button>
      </div>
      <p style="font-size:11px;color:var(--muted);margin:8px 0 0;">
        Los códigos QR se imprimen una sola vez y sirven para siempre: el enlace de cada
        habitación nunca cambia, solo cambia el huésped al que apunta.
      </p>
    </div>

    <div class="card">
      <div class="header">
        <p class="title">Revisión por fecha</p>
        <div class="filterbar">
          <button class="btn" onclick="loadPublicacion(shiftDate('${F.fecha}',-1))">‹</button>
          <input type="date" value="${F.fecha}" onchange="loadPublicacion(this.value)">
          <button class="btn" onclick="loadPublicacion(shiftDate('${F.fecha}',1))">›</button>
          <select onchange="loadPublicacion(null, this.value)">
            <option value="todas" ${F.filtro==="todas"?"selected":""}>Todas las habitaciones</option>
            <option value="movimiento" ${F.filtro==="movimiento"?"selected":""}>Solo entradas y salidas</option>
            <option value="con_huesped" ${F.filtro==="con_huesped"?"selected":""}>Solo con huésped</option>
          </select>
        </div>
      </div>
      <table>
        <tr><th>Hab.</th><th>Movimiento</th><th>Huésped</th><th>Estadía</th><th>Idioma</th><th></th></tr>
        ${d.detalle.map(h => `<tr class="${claseFila(h.movimiento, h.huesped)}">
          <td><strong>${h.room_no}</strong>${etiquetaGrupo(h.conf_no)}</td>
          <td>${movTxt[h.movimiento] || "—"}</td>
          <td>${h.huesped || '<span style="color:var(--muted);">sin ocupante</span>'}</td>
          <td>${h.arr_date ? `${h.arr_date} – ${h.dep_date || "?"}` : "—"}</td>
          <td>${h.huesped ? (h.idioma || "en").toUpperCase() : "—"}${h.editado ? ' <span class="badge badge-tour">editado</span>' : ""}</td>
          <td><button class="btn" onclick="verPaginaHuesped('${h.room_no}', '${h.url || ""}')">Ver</button></td>
        </tr>`).join("")}

      <p style="font-size:11px;color:var(--muted);margin-top:10px;">
        <span class="badge badge-warn">Entra ese día</span>
        <span class="badge" style="background:var(--danger-bg);color:var(--danger-text);">Sale ese día</span>
        <span class="badge badge-tour">Próximo ingreso</span>
      </p>
    </div>

    <div class="card">
      <p class="title" onclick="alternarConfigPublicacion()" style="cursor:pointer;user-select:none;"
         title="${abierto ? "Ocultar" : "Mostrar"} la configuración">
        <span id="pb-flecha">${abierto ? "▾" : "▸"}</span> Configuración
        <span style="font-weight:400;font-size:13px;color:var(--muted);">— dirección y habitaciones del hotel (se ajusta una sola vez)</span></p>
      <div id="pb-config" style="margin-top:12px;${abierto ? "" : "display:none;"}">
        <div class="filterbar" style="align-items:flex-start;">
          <label style="width:190px;font-size:13px;padding-top:6px;">Dirección del sistema</label>
          <input type="text" id="pb-url" value="${d.base_url || ""}" placeholder="https://itinerarios.milodge.com" style="flex:1;max-width:420px;">
        </div>
        <div class="filterbar" style="align-items:flex-start;margin-top:8px;">
          <label style="width:190px;font-size:13px;padding-top:6px;">Habitaciones del hotel</label>
          <input type="text" id="pb-habs" value="${(d.habitaciones||[]).join(', ')}" style="flex:1;max-width:420px;">
        </div>
        <div class="filterbar" style="align-items:flex-start;margin-top:8px;">
          <label style="width:190px;font-size:13px;">Enlaces con código</label>
          <label style="font-size:12.5px;"><input type="checkbox" id="pb-codigo" ${d.enlaces_con_codigo ? "checked" : ""}>
            Agrega un código secreto a cada enlace para que no se pueda adivinar el de otra habitación</label>
        </div>
        <div style="background:var(--ok-bg);color:var(--ok-text);border-radius:var(--r-sm);padding:10px 12px;margin-top:12px;font-size:12px;">
          <strong>Sobre la dirección:</strong> es por donde el celular del huésped alcanza este
          programa. Si el hotel tiene una dirección pública, ponla aquí. Si no, sirve la
          dirección en la red del hotel que muestra el programa al arrancar — pero entonces
          el QR solo funcionará conectado al WiFi del hotel.
        </div>
        <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:10px 12px;margin-top:8px;font-size:12px;">
          <strong>Cuidado con la lista de habitaciones y con los enlaces con código:</strong>
          determinan cuántos códigos QR hay y qué dirección lleva cada uno. Si cambias
          cualquiera de las dos, hay que <strong>reimprimir los códigos</strong>: los ya
          pegados en los cuartos dejan de funcionar.
        </div>
        <button class="btn btn-primary" style="margin-top:12px;" onclick="guardarConfigPublicacion()">Guardar datos</button>
      </div>
    </div>
  `;
}

function alternarConfigPublicacion() {
  const caja = document.getElementById("pb-config");
  if (!caja) return;
  const oculto = caja.style.display === "none";
  caja.style.display = oculto ? "block" : "none";
  const flecha = document.getElementById("pb-flecha");
  if (flecha) flecha.textContent = oculto ? "▾" : "▸";
}

async function guardarConfigPublicacion() {
  const habs = document.getElementById("pb-habs").value.split(",").map(s => s.trim()).filter(Boolean);
  const res = await fetchAuth(`${API}/api/publicacion/config`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      base_url: document.getElementById("pb-url").value.trim(),
      habitaciones: habs,
      enlaces_con_codigo: document.getElementById("pb-codigo").checked,
    }),
  });
  if (!res.ok) { avisar((await res.json()).detail || "No se pudo guardar", true); return; }
  avisar("Configuración guardada");
  loadPublicacion();
}

function verPaginaHuesped(roomNo, url) {
  // Se abre el mismo enlace que lleva impreso el código QR. Cuando los enlaces
  // llevan código secreto, la dirección corta ya no sirve ni para recepción.
  window.open(url || `${API}/i/${roomNo}`, "_blank");
}

async function descargarHojaQR() {
  const res = await fetchAuth(`${API}/api/publicacion/qr`);
  if (!res.ok) {
    // Se muestra el motivo del servidor (suele ser que falta la dirección base).
    let motivo = "No se pudo generar la hoja";
    try { motivo = (await res.json()).detail || motivo; } catch (e) {}
    avisar(motivo, true);
    return;
  }
  const blob = await res.blob();
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "codigos_qr_habitaciones.pdf";
  a.click();
}

// Confirmación visual: cualquier botón tocado se pinta de azul brevemente, así
// recepción sabe que el toque se registró aunque la acción tarde en responder.
document.addEventListener("click", (e) => {
  // Cerrar los resultados de búsqueda al tocar fuera
  if (!e.target.closest("#buscar-panel") && !e.target.closest("#buscador")) cerrarBusqueda();
  const b = e.target.closest("button, .stat, .pulsable");
  if (!b) return;
  b.classList.add("pulsado");
  setTimeout(() => b.classList.remove("pulsado"), 320);
}, true);

// ---------- Atajos de teclado ----------
// Ctrl+K buscar · flechas ← → cambiar de día · Esc cerrar
document.addEventListener("keydown", (e) => {
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("buscador")?.focus();
    return;
  }
  if (e.key === "Escape") {
    cerrarBusqueda();
    document.querySelector(".modal-fondo")?.remove();
    if (document.activeElement === document.getElementById("buscador")) {
      document.getElementById("buscador").blur();
    }
    return;
  }
  // Las flechas solo cambian el día si no se está escribiendo en un campo
  if (!escribiendo && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const campo = document.querySelector("#app input[type=date]");
    if (!campo) return;
    e.preventDefault();
    campo.value = shiftDate(campo.value, e.key === "ArrowRight" ? 1 : -1);
    campo.dispatchEvent(new Event("change", { bubbles: true }));
  }
});

// ---------- Si una pantalla falla, que se vea ----------
// Antes, cualquier error al cargar una pantalla la dejaba en blanco sin decir nada:
// desde afuera parecía que "el botón no funciona" y había que abrir la consola del
// navegador para saber por qué. La causa más común es un despliegue nuevo con el HTML
// viejo todavía en el navegador, y eso se arregla recargando sin caché.
function mostrarFalloPantalla(pantalla, error) {
  const app = document.getElementById("app");
  if (!app) return;
  // Si el refresco automático vuelve a fallar, se reemplaza el aviso anterior en vez
  // de ir apilando uno debajo de otro.
  document.getElementById("fallo-pantalla")?.remove();
  const aviso = document.createElement("div");
  aviso.id = "fallo-pantalla";
  aviso.className = "card";
  aviso.style.cssText = "background:var(--warn-bg);color:var(--warn-text);";
  aviso.innerHTML = `
    <p class="title" style="color:var(--warn-text);">No se pudo cargar esta pantalla</p>
    <p style="font-size:13px;margin:6px 0 0;">Casi siempre es que el navegador tiene guardada
       una versión anterior del sistema. Recarga sin caché y debería quedar bien.</p>
    <p style="font-size:12px;margin:8px 0 0;color:var(--muted);">Detalle técnico:
       <span id="fallo-detalle"></span></p>
    <button class="btn btn-primary" style="margin-top:12px;"
      onclick="location.replace(location.pathname + '?v=' + Date.now())">Recargar sin caché</button>
    <span style="font-size:12px;margin-left:8px;">o Ctrl+Shift+R</span>`;
  // El detalle va como texto, no como HTML: un mensaje de error puede traer '<' o
  // comillas y rompería el aviso justo cuando más falta hace que se lea.
  aviso.querySelector("#fallo-detalle").textContent =
    (error && (error.message || String(error))) || "error desconocido";
  // Se agrega arriba en vez de reemplazar: si la pantalla alcanzó a pintar algo, se
  // conserva, y si no, el aviso es lo único que se ve — que es justo lo correcto.
  app.prepend(aviso);
  avisar("No se pudo cargar " + pantalla, true);
  console.error(`[${pantalla}]`, error);
}

for (const nombre of ["loadDashboard", "loadReservas", "loadAgenda", "loadTransporte",
                      "loadEntradas", "loadAmenidades", "loadRestaurantes", "loadAnalitica",
                      "loadResumenOperacion", "loadImportarPDF", "loadUsuarios",
                      "loadCatalogoAdmin", "loadPublicacion"]) {
  const original = window[nombre];
  if (typeof original !== "function") continue;
  window[nombre] = async function (...args) {
    try {
      return await original.apply(this, args);
    } catch (e) {
      // La sesión vencida ya la maneja fetchAuth cerrando sesión; no es un fallo que
      // haya que explicarle a nadie.
      if (!(e && e.message === "Sesión expirada")) mostrarFalloPantalla(nombre, e);
    }
  };
}
