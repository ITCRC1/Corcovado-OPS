async function crearTour() {
  const codigo = document.getElementById("nt-codigo").value.trim().toUpperCase();
  const nombre = document.getElementById("nt-nombre").value.trim();
  const horario_inicio = document.getElementById("nt-inicio").value.trim();
  const horario_fin = document.getElementById("nt-fin").value.trim();
  const maxPax = document.getElementById("nt-maxpax").value.trim();
  const requiere_entrada_sinac = document.getElementById("nt-entrada").checked;
  if (!codigo || !nombre || !maxPax) { document.getElementById("nt-error").textContent = "Completa al menos código, nombre y máx. pax."; return; }
  const res = await fetchAuth(`${API}/api/catalogo/tour`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ codigo, nombre, horario_inicio, horario_fin, max_pax_guia: parseInt(maxPax), requiere_entrada_sinac }),
  });
  if (!res.ok) { document.getElementById("nt-error").textContent = (await res.json()).detail; return; }
  CATALOGO = null;
  avisar("Agregado al catálogo");
  loadCatalogoAdmin();
}

async function toggleCatalogo(tipo, id, activo) {
  await fetchAuth(`${API}/api/catalogo/${tipo}/${id}/estado?activo=${activo}`, { method: "POST" });
  CATALOGO = null;
  avisar(activo === "true" || activo === true ? "Activado" : "Desactivado");
  loadCatalogoAdmin();
}

// Confirmación visual: cualquier botón tocado se pinta de azul brevemente, así
// recepción sabe que el toque se registró aunque la acción tarde en responder.
document.addEventListener("click", (e) => {
  // Cerrar los resultados de búsqueda al tocar fuera
  if (!e.target.closest("#buscar-panel") && !e.target.closest("#buscador")) cerrarBusqueda();
  const b = e.target.closest("button, .stat, .pulsable");
  if (!b) return;
  b.classList.add("pulsado");
  setTimeout(() => b.classList.remove("pulsado"), 320);
}, true);

// ---------- Atajos de teclado ----------
// Ctrl+K buscar · flechas ← → cambiar de día · Esc cerrar
document.addEventListener("keydown", (e) => {
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || "");

  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") {
    e.preventDefault();
    document.getElementById("buscador")?.focus();
    return;
  }
  if (e.key === "Escape") {
    cerrarBusqueda();
    document.querySelector(".modal-fondo")?.remove();
    if (document.activeElement === document.getElementById("buscador")) {
      document.getElementById("buscador").blur();
    }
    return;
  }
  // Las flechas solo cambian el día si no se está escribiendo en un campo
  if (!escribiendo && (e.key === "ArrowLeft" || e.key === "ArrowRight")) {
    const campo = document.querySelector("#app input[type=date]");
    if (!campo) return;
    e.preventDefault();
    campo.value = shiftDate(campo.value, e.key === "ArrowRight" ? 1 : -1);
    campo.dispatchEvent(new Event("change", { bubbles: true }));
  }
});

// ---------- Si una pantalla falla, que se vea ----------
// Antes, cualquier error al cargar una pantalla la dejaba en blanco sin decir nada:
// desde afuera parecía que "el botón no funciona" y había que abrir la consola del
// navegador para saber por qué. La causa más común es un despliegue nuevo con el HTML
// viejo todavía en el navegador, y eso se arregla recargando sin caché.
function mostrarFalloPantalla(pantalla, error) {
  const app = document.getElementById("app");
  if (!app) return;
  // Si el refresco automático vuelve a fallar, se reemplaza el aviso anterior en vez
  // de ir apilando uno debajo de otro.
  document.getElementById("fallo-pantalla")?.remove();
  const aviso = document.createElement("div");
  aviso.id = "fallo-pantalla";
  aviso.className = "card";
  aviso.style.cssText = "background:var(--warn-bg);color:var(--warn-text);";
  // SIN SEÑAL NO SE DICE «RECARGA SIN CACHÉ». Es el consejo contrario al que sirve: la
  // caché es lo ÚNICO que queda, y borrarla en el puesto del parque deja al guía sin
  // pasaportes y sin tiquetes. Esta pantalla no se pudo cargar porque nunca se abrió con
  // internet, y lo que hay que decirle es exactamente eso.
  const sinSenal = !navigator.onLine
    || (error && String(error.message || error).includes("Sin señal"));
  aviso.innerHTML = sinSenal
    ? `<p class="title" style="color:var(--warn-text);">Esta pantalla no está disponible sin señal</p>
       <p style="font-size:13px;margin:6px 0 0;">Solo se puede ver lo que ya se había
          abierto con internet. Lo que el guía necesita en el parque —los pasaportes y los
          tiquetes del día— se descarga solo al abrir la Agenda en el lodge.</p>
       <p style="font-size:12px;margin:8px 0 0;color:var(--muted);">Detalle técnico:
          <span id="fallo-detalle"></span></p>`
    : `<p class="title" style="color:var(--warn-text);">No se pudo cargar esta pantalla</p>
       <p style="font-size:13px;margin:6px 0 0;">Casi siempre es que el navegador tiene guardada
          una versión anterior del sistema. Recarga sin caché y debería quedar bien.</p>
       <p style="font-size:12px;margin:8px 0 0;color:var(--muted);">Detalle técnico:
          <span id="fallo-detalle"></span></p>
       <button class="btn btn-primary" style="margin-top:12px;"
         onclick="location.replace(location.pathname + '?v=' + Date.now())">Recargar sin caché</button>
       <span style="font-size:12px;margin-left:8px;">o Ctrl+Shift+R</span>`;
  // El detalle va como texto, no como HTML: un mensaje de error puede traer '<' o
  // comillas y rompería el aviso justo cuando más falta hace que se lea.
  aviso.querySelector("#fallo-detalle").textContent =
    (error && (error.message || String(error))) || "error desconocido";
  // Se agrega arriba en vez de reemplazar: si la pantalla alcanzó a pintar algo, se
  // conserva, y si no, el aviso es lo único que se ve — que es justo lo correcto.
  app.prepend(aviso);
  avisar("No se pudo cargar " + pantalla, true);
  console.error(`[${pantalla}]`, error);
}

// ====================== PASAPORTES ======================
//
// El guardaparques pide identificación en San Pedrillo, Sirena y la Isla del Caño, y eso
// obligaba al huésped a llevarse el documento a la selva o a un bote. Se fotografía una
// vez y el guía lo enseña desde el teléfono.
//
// NO HAY PANTALLA PROPIA. Se entra por los dos sitios donde la gente ya está: la columna
// de Reservas, para tomar la foto al recibir, y un botón por salida en la Agenda de
// tours, para enseñarla. Una pantalla aparte era una cosa más que abrir.
//
// SIN SEÑAL, Y SIN BOTÓN DE DESCARGA. En el puesto del parque no hay internet, y una
// foto solo se puede enseñar si sus bytes ya están en el teléfono — eso no se puede
// esquivar. Lo que sí se quita es el paso que había que acordarse de dar: la Agenda pide
// las fotos del día CALLADAMENTE al abrirse con señal (ver precargarPasaportes), el
// programa de servicio las guarda, y después las sirve sin red. Para cuando el guía
// llega al muelle ya están.
//
// ES UN DOCUMENTO DE IDENTIDAD. No se enseñan miniaturas en ninguna lista: las listas
// dicen quién tiene foto y quién no, y el documento solo aparece cuando alguien lo abre
// a propósito.

// Las fotos del día, pedidas una vez y guardadas para el resto de la pantalla.
async function pasaportesDelDia(fecha) {
  const res = await fetchAuth(`${API}/api/pasaportes/dia?fecha=${fecha}`);
  if (!res.ok) throw new Error("no se pudieron cargar los pasaportes");
  const d = await res.json();
  window._pasDia = d;
  return d;
}

// LO QUE HACE QUE ESTO SIRVA EN EL PARQUE. Se piden las imágenes una vez, en silencio,
// mientras hay señal. El programa de servicio las guarda y luego las sirve del teléfono.
//
// No avisa de nada ni bloquea la pantalla: si falla, el guía no pierde nada que tuviera
// antes, y al abrir la foto se le dirá con claridad que no quedó copia. Cuesta poco
// repetirlo porque las imágenes se sirven del teléfono: la segunda vez no toca la red.
async function precargarPasaportes(d) {
  const ids = [];
  for (const s of (d.salidas || [])) {
    for (const h of s.habitaciones) {
      for (const g of h.gente) for (const f of (g.fotos || [])) ids.push(f.id);
    }
  }
  for (const id of ids) {
    try {
      const res = await fetchAuth(`${API}/api/pasaportes/${id}/imagen`);
      if (res.ok) await res.blob();
    } catch (e) { /* sin señal: ya habrá otra vuelta con red */ }
  }
}

// Las salidas de un tour ese día. Se junta por CÓDIGO y no por grupo operativo porque
// así es como se lee la tarjeta del resumen —y porque la entrada al parque es del tour,
// no del grupo: los del grupo B enseñan el pasaporte en el mismo puesto que los del A.
function salidasDeTour(codigo) {
  return ((window._pasDia || {}).salidas || []).filter(s => s.tour_codigo === codigo);
}

// El botón que va en la tarjeta de cada tour del resumen de la Agenda.
function botonPasaportesTour(codigo) {
  if (!puedeVer("pasaportes")) return "";
  const salidas = salidasDeTour(codigo);
  if (!salidas.length) return "";
  const con = salidas.reduce((n, s) => n + s.con_foto, 0);
  const sin = salidas.reduce((n, s) => n + s.sin_foto, 0);
  const parque = salidas.some(s => s.requiere_entrada_sinac);
  const color = sin ? "var(--warn-text)" : "var(--ok-text)";
  // onclick con stopPropagation: la tarjeta entera ya abre el detalle del tour, y sin
  // esto tocar el botón abriría las dos cosas a la vez.
  return `<button class="btn" style="margin-top:6px;font-size:10.5px;padding:4px 8px;color:${color};"
      onclick="event.stopPropagation(); abrirPasaportesTour('${escaparHTML(codigo)}')"
      title="${parque ? "Este tour entra al parque: el guardaparques pide identificación" : "Pasaportes de este tour"}"
    >🛂 ${sin ? `faltan ${sin}` : `${con} listos`}</button>`;
}

function abrirPasaportesTour(codigo) {
  const d = window._pasDia || {};
  const salidas = salidasDeTour(codigo);
  if (!salidas.length) { avisar("No hay pasaportes para ese tour", true); return; }
  const puede = puedeEscribir("pasaportes");
  const parque = salidas.some(s => s.requiere_entrada_sinac);
  const pax = salidas.reduce((n, s) => n + s.pax, 0);
  const modal = document.createElement("div");
  modal.className = "modal-fondo";
  modal.onclick = (e) => { if (e.target === modal) cerrarCuadroPasaportes(modal); };
  modal.innerHTML = `
    <div class="modal-caja" style="max-width:720px;">
      <button class="modal-cerrar" onclick="cerrarCuadroPasaportes(this.closest('.modal-fondo'))">×</button>
      <p style="font-weight:600;font-size:18px;margin:0;color:var(--forest-dark);">
        Pasaportes · ${escaparHTML(codigo)}
        ${parque ? ` <span class="badge badge-warn">parque</span>` : ""}
      </p>
      <p style="font-size:13px;color:var(--muted);margin:2px 0 10px;">
        ${escaparHTML(d.fecha || "")} · ${pax} pax ·
        ${salidas.map(s => `${s.grupo_operativo !== "A" ? `grupo ${escaparHTML(s.grupo_operativo)}: ` : ""}${s.guia_nombre ? escaparHTML(s.guia_nombre) : "sin guía"}`).join(" · ")}
      </p>
      <p style="font-size:11.5px;color:var(--muted);margin:0 0 12px;">
        Se abren uno por uno para enseñarlos. Al abrir esta pantalla con señal quedan
        guardados en este teléfono y se ven igual en el puesto del parque, sin internet.
      </p>
      ${salidas.map(s => s.habitaciones.map(h => cajaHabitacionPasaporte(h, puede)).join("")).join("")}
    </div>`;
  document.body.appendChild(modal);
}

function cajaHabitacionPasaporte(h, puedeTomar) {
  return `
    <div style="border-top:1px solid var(--border);padding:9px 0;">
      <p style="margin:0 0 5px;font-size:13px;font-weight:600;">
        Hab. ${escaparHTML(h.room_no || "—")} · ${escaparHTML(h.nombre_principal || "")}
      </p>
      <div id="pas-gente-${h.conf_no}">
        ${h.gente.length ? h.gente.map(g => lineaPersonaPasaporte(h.conf_no, g, puedeTomar)).join("")
          : `<p style="font-size:12px;color:var(--muted);margin:0 0 6px;">Esta reserva no trae lista de huéspedes.</p>`}
      </div>
      ${puedeTomar ? `<button class="btn" style="font-size:12px;" onclick="agregarPersonaPasaporte('${h.conf_no}')">+ Agregar persona</button>` : ""}
    </div>`;
}

function lineaPersonaPasaporte(confNo, g, puedeTomar) {
  const tiene = (g.fotos || []).length;
  const ultima = tiene ? g.fotos[g.fotos.length - 1] : null;
  return `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;">
      <span style="flex:1 1 150px;font-size:13px;">
        ${escaparHTML(g.nombre)}
        ${g.pasaporte ? `<span style="color:var(--muted);font-size:11.5px;"> · ${escaparHTML(g.pasaporte)}</span>` : ""}
        ${g.en_rooming ? "" : `<span class="badge badge-warn" style="font-size:10px;" title="No viene en la lista del PMS: se agregó a mano">a mano</span>`}
      </span>
      ${tiene ? `
        <button class="btn btn-primary" style="font-size:12px;"
          onclick="verPasaporte(${ultima.id}, ${JSON.stringify(g.nombre).replace(/"/g, "&quot;")}, ${JSON.stringify(g.pasaporte || "").replace(/"/g, "&quot;")})">🛂 Ver</button>
        ${puedeTomar ? `<button class="btn" style="font-size:12px;" onclick="quitarPasaporte('${confNo}', ${ultima.id})" title="Borrar la foto">🗑</button>` : ""}
      ` : `<span class="badge badge-warn" style="font-size:11px;">sin foto</span>`}
      ${puedeTomar ? `
        <label class="btn" style="font-size:12px;cursor:pointer;margin:0;">
          📷 ${tiene ? "Retomar" : "Tomar"}
          <input type="file" accept="image/*" capture="environment" style="display:none;"
            onchange="mandarPasaporte(this, '${confNo}', ${JSON.stringify(g.nombre).replace(/"/g, "&quot;")}, ${JSON.stringify(g.pasaporte || "").replace(/"/g, "&quot;")})">
        </label>` : ""}
    </div>`;
}

// LA CÁMARA ES LA DEL TELÉFONO, no una dentro de la página. 'capture' abre la cámara
// nativa que la persona ya sabe usar, funciona igual en iPhone y Android, y no se rompe
// si el navegador niega el permiso de cámara a la página. Una cámara propia habría que
// dibujarla, pedirle permiso aparte y mantenerla.
async function mandarPasaporte(input, confNo, nombre, pasaporte) {
  const archivo = input.files && input.files[0];
  input.value = "";                     // para poder repetir la misma foto si hace falta
  if (!archivo) return;
  avisar("Preparando la foto…");
  try {
    const foto = await achicarFoto(archivo);
    const cuerpo = new FormData();
    cuerpo.append("nombre", nombre);
    if (pasaporte) cuerpo.append("pasaporte", pasaporte);
    cuerpo.append("foto", foto, "pasaporte.jpg");
    const res = await fetchAuth(`${API}/api/reservas/${confNo}/pasaportes`, {
      method: "POST", body: cuerpo });
    if (!res.ok) {
      const e = await res.json().catch(() => ({}));
      avisar(e.detail || "No se pudo guardar la foto", true);
      return;
    }
    avisar("Pasaporte guardado");
    pintarGentePasaporte(confNo, (await res.json()).gente);
  } catch (e) {
    avisar("No se pudo guardar la foto: " + (e.message || e), true);
  }
}

// Se repinta SOLO la reserva que cambió, no la pantalla entera: recargar cerraría el
// cuadro y el guía perdería el sitio justo cuando va por la tercera foto de ocho.
//
// Los contadores de fuera —la columna de Reservas, el botón de la salida— sí se quedan
// viejos, así que se anota el cambio y se refrescan al cerrar el cuadro.
function pintarGentePasaporte(confNo, gente) {
  window._pasCambio = true;
  const caja = document.getElementById(`pas-gente-${confNo}`);
  if (!caja) return;
  const puede = puedeEscribir("pasaportes");
  caja.innerHTML = (gente || []).length
    ? gente.map(g => lineaPersonaPasaporte(confNo, g, puede)).join("")
    : `<p style="font-size:12px;color:var(--muted);margin:0 0 6px;">Esta reserva no trae lista de huéspedes.</p>`;
}

function cerrarCuadroPasaportes(modal) {
  modal.remove();
  if (!window._pasCambio) return;
  window._pasCambio = false;
  // Con el filtro que la pantalla tenga puesto, no el de hoy: quien está mirando el
  // jueves no quiere volver al lunes por haber tomado una foto.
  const recargar = cargadoresPantalla()[window._pantallaActiva];
  if (recargar) recargar();
}

// Una foto de celular pesa de 3 a 5 MB. Con el internet de Drake, un guía con ocho
// huéspedes abandona a la tercera. Reducida a 1600 px queda en unos 300 KB y un pasaporte
// se lee perfectamente. Si algo falla se manda el archivo tal cual: el servidor lo valida
// igual, y es mejor una foto pesada que ninguna.
//
// De paso resuelve el HEIC del iPhone: al dibujarla en un lienzo se reescribe como JPEG.
function achicarFoto(archivo, maxLado = 1600, calidad = 0.72) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(archivo);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const escala = Math.min(1, maxLado / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * escala);
      c.height = Math.round(img.height * escala);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob((b) => resolve(b && b.size ? b : archivo), "image/jpeg", calidad);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(archivo); };
    img.src = url;
  });
}

async function agregarPersonaPasaporte(confNo) {
  const nombre = prompt("Nombre completo de la persona del pasaporte:");
  if (!nombre || !nombre.trim()) return;
  const num = prompt("Número de pasaporte (opcional):") || "";
  // Se abre el selector de archivo con el nombre ya puesto: pedir el nombre DESPUÉS de
  // la foto haría que una cancelación perdiera la foto recién tomada.
  const input = document.createElement("input");
  input.type = "file";
  input.accept = "image/*";
  input.capture = "environment";
  input.onchange = () => mandarPasaporte(input, confNo, nombre.trim(), num.trim());
  input.click();
}

async function quitarPasaporte(confNo, id) {
  if (!confirm("¿Borrar esta foto de pasaporte? No se puede deshacer.")) return;
  const res = await fetchAuth(`${API}/api/pasaportes/${id}`, { method: "DELETE" });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    avisar(e.detail || "No se pudo borrar", true);
    return;
  }
  avisar("Foto borrada");
  pintarGentePasaporte(confNo, (await res.json()).gente);
}

// La imagen se pide con la sesión puesta, no con <img src>: una dirección que se abra
// sola serviría un documento de identidad a quien tenga el enlace.
async function verPasaporte(id, nombre, pasaporte) {
  const modal = document.createElement("div");
  modal.className = "modal-fondo";
  modal.onclick = (e) => { if (e.target === modal) cerrarPasaporte(modal); };
  modal.innerHTML = `
    <div class="modal-caja" style="max-width:980px;">
      <button class="modal-cerrar" onclick="cerrarPasaporte(this.closest('.modal-fondo'))">×</button>
      <p style="font-weight:600;font-size:17px;margin:0;">${escaparHTML(nombre)}</p>
      <p style="font-size:13px;color:var(--muted);margin:2px 0 10px;">
        ${pasaporte ? escaparHTML(pasaporte) : "sin número en la reserva"}</p>
      <div id="pas-imagen" style="text-align:center;min-height:120px;">
        <p class="empty" style="padding:30px 0;">Abriendo la foto…</p>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const res = await fetchAuth(`${API}/api/pasaportes/${id}/imagen`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
    const url = URL.createObjectURL(await res.blob());
    modal._url = url;
    // SE MIRA, NO SE GUARDA. 'solo-ver' apaga el menú de «guardar imagen» del teléfono;
    // la copia vive en el almacén de la app y se borra con ella. Un pantallazo nadie lo
    // puede impedir, pero el documento no acaba en la galería sin querer.
    modal.querySelector("#pas-imagen").innerHTML =
      `<img class="solo-ver" draggable="false" src="${url}" alt=""
            style="max-width:100%;border-radius:var(--r-sm);">`;
  } catch (e) {
    // Sin señal Y sin copia guardada. Se dice exactamente eso, porque es accionable: las
    // fotos del día se guardan solas al abrir la Agenda con internet, antes de salir.
    modal.querySelector("#pas-imagen").innerHTML =
      `<p class="empty" style="padding:24px 0;">No se pudo abrir la foto.
        <small>${escaparHTML(String(e.message || e))}<br>
        Sin señal solo se ven las fotos que ya se habían descargado. Se descargan solas
        al abrir la Agenda del día en el lodge.</small></p>`;
  }
}

function cerrarPasaporte(modal) {
  if (modal._url) URL.revokeObjectURL(modal._url);
  modal.remove();
}

// El botón de la columna de Reservas. Dice el ESTADO, no enseña la foto: una fila de
// miniaturas de pasaportes en la pantalla del mostrador es exponer documentos a quien
// pase por delante, y a ese tamaño además no se lee nada.
function botonPasaportes(confNo, estado) {
  const esperadas = estado ? estado.esperadas : 0;
  const tiene = estado ? estado.con_foto : 0;
  if (!esperadas && !tiene) {
    return `<button class="btn" onclick="abrirPasaportesReserva('${confNo}')">—</button>`;
  }
  const completo = tiene >= esperadas && esperadas > 0;
  const estilo = completo
    ? "background:var(--ok-bg);border-color:#A5C8A5;color:var(--ok-text);"
    : (tiene ? "background:var(--warn-bg);border-color:#E5C07B;color:var(--warn-text);" : "");
  return `<button class="btn" style="${estilo}font-weight:600;"
    onclick="abrirPasaportesReserva('${confNo}')"
    title="${completo ? "Todos los pasaportes fotografiados" : "Faltan fotos de pasaporte"}"
    >${tiene}/${esperadas}</button>`;
}

// ---------- Pasaportes desde la ficha de una reserva ----------
async function abrirPasaportesReserva(confNo) {
  const res = await fetchAuth(`${API}/api/reservas/${confNo}/pasaportes`);
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    avisar(e.detail || "No se pudieron abrir los pasaportes", true);
    return;
  }
  const d = await res.json();
  const puede = puedeEscribir("pasaportes");
  const modal = document.createElement("div");
  modal.className = "modal-fondo";
  modal.id = "modal-pasaportes";
  modal.onclick = (e) => { if (e.target === modal) cerrarCuadroPasaportes(modal); };
  modal.innerHTML = `
    <div class="modal-caja" style="max-width:640px;">
      <button class="modal-cerrar" onclick="cerrarCuadroPasaportes(this.closest('.modal-fondo'))">×</button>
      <p style="font-weight:600;font-size:18px;margin:0;color:var(--forest-dark);">Pasaportes</p>
      <p style="font-size:13px;color:var(--muted);margin:2px 0 12px;">Reserva ${escaparHTML(confNo)}</p>
      <div id="pas-gente-${confNo}">
        ${d.gente.length ? d.gente.map(g => lineaPersonaPasaporte(confNo, g, puede)).join("")
          : `<p class="empty" style="padding:14px 0;">Esta reserva no trae lista de huéspedes.<small>Se puede agregar a mano la persona del pasaporte.</small></p>`}
      </div>
      ${puede ? `<button class="btn" style="margin-top:10px;" onclick="agregarPersonaPasaporte('${confNo}')">+ Agregar persona</button>` : ""}
    </div>`;
  document.body.appendChild(modal);
}

for (const nombre of ["loadDashboard", "loadReservas", "loadAgenda", "loadTransporte",
                      "loadEntradas", "loadAmenidades", "loadRestaurantes", "loadAnalitica",
                      "loadResumenOperacion", "loadImportarPDF", "loadUsuarios",
                      "loadCatalogoAdmin", "loadPublicacion"]) {
  const original = window[nombre];
  if (typeof original !== "function") continue;
  window[nombre] = async function (...args) {
    try {
      return await original.apply(this, args);
    } catch (e) {
      // La sesión vencida ya la maneja fetchAuth cerrando sesión; no es un fallo que
      // haya que explicarle a nadie.
      if (!(e && e.message === "Sesión expirada")) mostrarFalloPantalla(nombre, e);
    }
  };
}

document.getElementById("login-pass").addEventListener("keydown", e => { if (e.key === "Enter") doLogin(); });
marcarConexion(navigator.onLine);
tryAutoLogin();
</script>
