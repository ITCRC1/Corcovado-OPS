// ---------- AGENDA DE TOURS ----------
let CATALOGO = null;
async function getCatalogo() {
  if (!CATALOGO) CATALOGO = await (await fetchAuth(`${API}/api/catalogo`)).json();
  return CATALOGO;
}

async function loadAgenda(fecha, desde, hasta) {
  setActive(2);
  window._agendaSinGuardar = new Set();
  const F = FILTROS.agenda;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desde) F.desde = desde;
  if (hasta) F.hasta = hasta;
  if (fecha === null) F.modo = "rango";              // se pidió ver un rango
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  let url = fecha ? `${API}/api/tours/agenda?fecha=${fecha}` : `${API}/api/tours/agenda?desde=${F.desde}&hasta=${F.hasta}`;
  // Las corridas de bote se COORDINAN en Transporte: el bote, el capitán y el ayudante
  // se eligen allá. Aquí se piden solo para poder ponerles el GUÍA, que es lo que esta
  // pantalla decide. Es el reparto que pidió el lodge: cada dato se escribe en un lugar
  // y se lee en los dos.
  const urlTrasAg = fecha ? `${API}/api/traslados?fecha=${fecha}`
                          : `${API}/api/traslados?desde=${F.desde}&hasta=${F.hasta}`;
  const [rows, cat, tras] = await Promise.all([
    fetchAuth(url).then(r => r.json()),
    getCatalogo(),
    fetchAuth(urlTrasAg).then(r => r.json())
      .catch(e => ({ detail: "No hubo respuesta del servidor (" + e.message + ")." })),
  ]);
  // Se guardan para el detalle de cada tipo de tour: la pantalla ya los tiene, así que
  // desplegarlo no cuesta otra consulta y no puede contradecir a la tabla de abajo.
  window._agendaRows = rows;

  // LOS PASAPORTES DEL DÍA. Solo en la vista de un día: «los pasaportes de los que lo
  // necesitan ESE día» no tiene sentido sobre un mes, y precargar un mes de fotos por el
  // internet del lodge sería peor que no tenerlas.
  //
  // La precarga va SIN await a propósito: la Agenda no puede quedarse esperando fotos.
  // Mientras el guía reparte guías, las imágenes se van guardando solas en el teléfono y
  // para cuando llega al muelle ya están.
  window._pasDia = null;
  if (fecha && puedeVer("pasaportes")) {
    try {
      const d = await pasaportesDelDia(fecha);
      precargarPasaportes(d);
    } catch (e) { /* sin permiso o sin red: la Agenda funciona igual */ }
  }

  // Conflictos de horario y quién está libre ese día
  let conflictos = [], dispo = {};
  if (fecha) {
    try {
      conflictos = (await (await fetchAuth(`${API}/api/agenda/conflictos?fecha=${fecha}`)).json()).conflictos || [];
      const codigos = [...new Set(rows.flatMap(r => r.tours.map(t => t.tour_codigo)))];
      for (const cod of codigos) {
        dispo[cod] = await (await fetchAuth(`${API}/api/agenda/disponibilidad?fecha=${fecha}&tour_codigo=${cod}`)).json();
      }
    } catch (e) {}
  }
  // Los desplegables marcan quién ya está ocupado en ese horario
  const opcionesGuia = (cod, actual) => {
    const d = dispo[cod] || {};
    const ocup = new Set(d.guias_ocupados || []);
    return cat.guias.map(g => {
      const marca = ocup.has(g.nombre) && g.nombre !== actual ? " (ocupado)" : "";
      return `<option value="${g.nombre}"${g.nombre === actual ? " selected" : ""}>${g.nombre}${marca}</option>`;
    }).join("");
  };
  // El bote, el capitán y el ayudante ya NO se eligen aquí: se ponen en Transporte y
  // esta pantalla los enseña. Por eso es texto y no un desplegable — un control que se
  // puede tocar pero no guarda nada es peor que no tenerlo.
  const soloLectura = (valor, falta) => valor
    ? escaparHTML(valor)
    : `<span style="color:${falta ? 'var(--warn-text)' : 'var(--muted)'};font-size:11.5px;">${falta ? 'sin asignar' : '—'}</span>`;
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Agenda de tours ${fecha ? etiquetaFecha(fecha) : ''}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadAgenda(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha || ""}" onchange="loadAgenda(this.value)">
          <button class="btn" onclick="loadAgenda(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadAgenda(hoyISO())">Hoy</button>
          <button class="btn" onclick="loadAgenda(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="ag-desde" value="${F.desde}">
          <input type="date" id="ag-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadAgenda(null, document.getElementById('ag-desde').value, document.getElementById('ag-hasta').value)">Ver rango</button>
          <button class="btn" onclick="descargar('agenda', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('agenda', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      <div id="ag-alertas"></div>
      ${conflictos.length ? `
        <div style="background:var(--danger-bg);color:var(--danger-text);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:13px;">
          <p style="margin:0 0 6px;font-weight:600;">⚠ ${conflictos.length} conflicto${conflictos.length>1?'s':''} de asignación</p>
          ${conflictos.map(x => `<p style="margin:0 0 3px;">${x.mensaje}</p>`).join("")}
        </div>` : ""}
      ${resumenPorTour(rows)}
      ${rows.length ? `
      <table>
        <tr><th>Huésped / Hab.</th><th>Tour</th><th>Fecha del tour</th><th>Grupo</th><th>Guía</th><th>Bote</th><th>Capitán</th><th>Ayudante</th><th>Pax</th>${puedeEscribir("agenda") ? "<th></th>" : ""}</tr>
        ${rows.map(r => r.tours.map((t, i) => `
          <tr>
            ${i === 0 ? `<td rowspan="${r.tours.length}">${r.nombre_principal} · ${r.room_no}</td>` : ''}
            <td>${t.tour_codigo}${t.es_privado ? `<br>${insigniaPrivado()}` : ""}</td>
            <td>${puedeEscribir("agenda")
              ? `<input type="date" value="${t.fecha || r.fecha}"
                   min="${r.estadia_desde || ""}" max="${r.estadia_hasta || ""}"
                   title="Solo dentro de la estadía: ${r.estadia_desde || "?"} a ${r.estadia_hasta || "?"}"
                   style="font-size:11.5px;padding:3px 5px;width:130px;${t.fuera_de_estadia ? 'border:2px solid var(--danger-text);' : ''}"
                   onchange="cambiarFechaTour(${t.id}, this.value, '${t.fecha || r.fecha}')">
                 ${t.fuera_de_estadia ? `<br><span style="font-size:10.5px;color:var(--danger-text);">fuera de la estadía — ponle un día</span>` : ""}`
              : `${t.fecha || r.fecha}${t.fuera_de_estadia ? ' <span style="font-size:10.5px;color:var(--danger-text);">(fuera de la estadía)</span>' : ""}`}</td>
            <td>${puedeEscribir("agenda") ? `<select id="gr-${t.id}" onchange="cambiarGrupo(${t.id}, this.value)" style="width:60px;">
                ${["A","B","C","D"].map(g => `<option value="${g}" ${(t.grupo_operativo||"A")===g?"selected":""}>${g}</option>`).join("")}
              </select>` : (t.grupo_operativo || "A")}</td>
            <td>${puedeEscribir("agenda") ? `<select id="g-${t.id}" onchange="marcarSinGuardar(${t.id})">${'<option value="">Sin asignar</option>' + opcionesGuia(t.tour_codigo, t.guia_nombre)}</select>` : (t.guia_nombre || "Sin asignar")}</td>
            <td>${soloLectura(t.bote_nombre, t.requiere_bote)}</td>
            <td>${soloLectura(t.capitan_nombre, t.requiere_bote)}</td>
            <td>${soloLectura(t.ayudante_nombre, false)}</td>
            <td>${celdaPaxTour(t)}</td>
            ${puedeEscribir("agenda") ? `<td><button class="btn" onclick="guardarAsignacion(${t.id})">Guardar</button></td>` : ''}
          </tr>`).join("")).join("")}
      </table>
      <p style="font-size:11px;color:var(--muted);margin-top:8px;">
        <strong>Grupo:</strong> si un tour excede la capacidad de un guía, cambia algunas reservas al grupo B, C o D — cada grupo lleva su propio guía.
        Pueden compartir el mismo bote (si cabe) o usar botes distintos: el sistema valida el guía por grupo, y el bote sumando todos los grupos que lo comparten.
        <br><strong>El bote, el capitán y el ayudante se eligen en Transporte</strong> y aparecen aquí solos en cuanto se asignan.
      </p>` : `<p class="empty">No hay tours para esta fecha.<small>Si esperabas alguno, revisa que el PDF de reservas esté importado y que la fecha sea la correcta.</small></p>`}
      ${seccionGuiasDeCorridas(tras)}
    </div>
  `;

  // El detalle abierto se vuelve a abrir. Guardar un guía redibuja la pantalla entera, y
  // sin esto el panel se cerraba justo después de asignar — que es cuando se quiere
  // mirar si el guía quedó bien puesto.
  if (window._tourAbierto) {
    const sigue = rows.some(r => (r.tours || [])
      .some(t => claveTipoTour(t) === window._tourAbierto));
    const clave = window._tourAbierto;
    window._tourAbierto = null;              // para que detalleTipoDeTour lo abra, no lo cierre
    if (sigue) detalleTipoDeTour(clave);
  }
}

// ---------- EL GUÍA DE CADA CORRIDA (lado Agenda) ----------
//
// La misma lista de corridas que se ve en Transporte, pero aquí solo se puede tocar el
// GUÍA. Lo pidió el lodge así: una corrida de muelle no tiene tour detrás del cual sacar
// el guía, y la Agenda es la pantalla donde se reparte la gente. El bote y la tripulación
// se ven, pero se eligen en Transporte.
function seccionGuiasDeCorridas(d) {
  if (!d || !d.corridas) {
    return `<div style="margin-top:18px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 6px;">Guía de los ingresos y salidas</p>
      <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:10px 12px;font-size:12.5px;">
        No se pudieron cargar las corridas.
        ${d && d.detail ? `<br><span style="font-size:11.5px;">${escaparHTML(d.detail)}</span>`
                        : `<br><span style="font-size:11.5px;">Revisá la conexión y volvé a entrar a la pantalla.</span>`}
      </div></div>`;
  }
  if (!(d.corridas || []).length) {
    return `<div style="margin-top:18px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 6px;">Guía de los ingresos y salidas</p>
      <p class="empty" style="padding:14px 12px;">Nadie entra ni sale en estas fechas.<small>Las corridas salen de las reservas: aparecen solas en cuanto haya un ingreso o una salida con su punto.</small></p>
    </div>`;
  }
  const puedo = puedeEscribir("agenda");
  const R = d.resumen || {};
  const opcG = (actual) => `<option value="">Sin asignar</option>` + (d.guias || [])
    .map(g => `<option value="${escaparHTML(g.nombre)}"${g.nombre === actual ? " selected" : ""}>${escaparHTML(g.nombre)}</option>`).join("");
  const tripulacion = (c) => {
    const partes = [c.bote_nombre, c.capitan_nombre, c.ayudante_nombre].filter(Boolean);
    return partes.length
      ? `<span style="font-size:11.5px;color:var(--muted);">${escaparHTML(partes.join(" · "))}</span>`
      : `<span style="font-size:11.5px;color:var(--warn-text);">sin bote — se pone en Transporte</span>`;
  };
  const fila = (c) => {
    const k = [c.fecha, c.tipo, c.punto, c.hora].map(x => encodeURIComponent(x)).join("|");
    const quienes = c.huespedes.map(h =>
      `${escaparHTML(h.room_no || "?")} ${escaparHTML((h.nombre || "").split(",")[0])}`).join(" · ");
    return `<tr>
      <td>${escaparHTML(c.fecha)}</td>
      <td><span class="badge ${c.tipo === "entrada" ? "badge-ok" : "badge-warn"}">${c.tipo === "entrada" ? "Entra" : "Sale"}</span></td>
      <td><strong>${escaparHTML(c.punto)}</strong></td>
      <td>${c.hora
            ? escaparHTML(c.hora)
            : `<span style="color:var(--warn-text);font-size:11.5px;">${escaparHTML(c.hora_origen || "sin hora")}</span>`}</td>
      <td>${c.huespedes.length} hab.
        <br><span style="font-size:10.5px;color:var(--muted);">${quienes}</span></td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;"><strong>${c.pax}</strong></td>
      <td>${puedo
            ? `<select onchange="asignarTraslado('${k}','guia',this.value,'agenda')">${opcG(c.guia_nombre)}</select>`
            : escaparHTML(c.guia_nombre || "Sin asignar")}</td>
      <td>${tripulacion(c)}</td>
    </tr>`;
  };
  return `
    <div style="margin-top:20px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 2px;">
        Guía de los ingresos y salidas · ${R.corridas} corrida${R.corridas === 1 ? "" : "s"} · ${R.pax} pax
        ${R.sin_guia ? `<span style="color:var(--warn-text);"> · ${R.sin_guia} sin guía</span>` : ""}
      </p>
      <p style="font-size:11.5px;color:var(--muted);margin:0 0 8px;">
        Quién acompaña a los que llegan al muelle de Sierpe o a la pista de Drake. Esta
        corrida no tiene tour detrás, así que su guía se pone aquí.
        <strong>El bote y la tripulación se eligen en Transporte.</strong>
      </p>
      <table style="font-size:12.5px;">
        <tr><th style="width:88px;">Fecha</th><th style="width:64px;">Dir.</th>
            <th style="width:74px;">Punto</th><th style="width:64px;">Hora</th>
            <th>Habitaciones</th><th style="width:50px;text-align:right;">Pax</th>
            <th style="width:150px;">Guía</th><th style="width:200px;">Bote / tripulación</th></tr>
        ${d.corridas.map(fila).join("")}
      </table>
    </div>`;
}

// ---------- INGRESOS Y SALIDAS POR LOCACIÓN ----------
//
// Una CORRIDA es un viaje del bote: fecha + dirección + punto + hora. Lo que la separa
// de otra del mismo día y punto es la HORA, no un grupo: el lodge manda el mismo bote con
// el mismo guía varias veces, sobre todo por Drake, donde cada vuelo llega a una hora.
//
// Las corridas las arma el servidor a partir de las reservas, así que aquí no se crean ni
// se borran: solo se les pone quién va. Ver backend/traslados.py.
function seccionTraslados(d) {
  // Si la petición no trajo corridas, hay que decir POR QUÉ. Antes esto devolvía "" y
  // la sección entera desaparecía de la pantalla sin dejar rastro: quien la buscara
  // pensaría que el sistema no se actualizó, cuando lo que pasó fue que se cayó la red
  // o que su usuario no tiene el permiso. Una sección que se esconde sola es
  // indistinguible de una que no existe.
  if (!d || !d.corridas) {
    return `<div style="margin-bottom:16px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 6px;">Ingresos y salidas por locación</p>
      <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:10px 12px;font-size:12.5px;">
        No se pudieron cargar los traslados.
        ${d && d.detail ? `<br><span style="font-size:11.5px;">${escaparHTML(d.detail)}</span>`
                        : `<br><span style="font-size:11.5px;">Revisá la conexión y volvé a entrar a la pantalla.</span>`}
      </div></div>`;
  }
  const R = d.resumen || {};
  if (!(d.corridas || []).length) {
    return `<div style="margin-bottom:16px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 6px;">Ingresos y salidas por locación</p>
      <p class="empty" style="padding:14px 12px;">Nadie entra ni sale en estas fechas.<small>Las corridas salen de las reservas: aparecen solas en cuanto haya un ingreso o una salida con su punto.</small></p>
    </div>`;
  }

  const puedo = puedeEscribir("transporte");
  // El GUÍA no se elige aquí: se pone en la Agenda de tours y esta pantalla lo enseña.
  // Lo pidió el lodge así —«que se jale automático a transporte, pero que en transporte
  // no sea editable»— y evita que las dos pantallas puedan decir cosas distintas.
  const celdaGuia = (actual) => actual
    ? escaparHTML(actual)
    : `<span style="color:var(--warn-text);font-size:11.5px;">sin guía — se pone en la Agenda</span>`;
  // Capitán y ayudante salen de la MISMA lista: en el lodge la misma persona hace de
  // una cosa o de la otra según con quién le toque el bote. Se le quita al selector la
  // persona que ya está puesta en el otro puesto de ESA corrida, para que no se pueda
  // dejar la misma dos veces —el servidor también lo rechaza, pero ofrecerlo y después
  // decir que no es peor que no ofrecerlo—.
  const opcC = (actual, ocupado) => `<option value="">Sin asignar</option>` + (d.capitanes || [])
    .filter(c => c.nombre !== ocupado || c.nombre === actual)
    .map(c => `<option value="${escaparHTML(c.nombre)}"${c.nombre === actual ? " selected" : ""}>${escaparHTML(c.nombre)}</option>`).join("");
  const opcB = (actual) => `<option value="">Sin asignar</option>` + (d.botes || [])
    .filter(b => b.gestionado_por_hotel || b.nombre === actual)
    .map(b => `<option value="${escaparHTML(b.nombre)}"${b.nombre === actual ? " selected" : ""}>${escaparHTML(b.nombre)}${b.capacidad_max ? ` (${b.capacidad_max})` : ""}</option>`).join("");

  const fila = (c) => {
    // La clave de la corrida viaja en el propio control: no hay id porque la corrida no
    // existe como fila hasta que se le asigna algo.
    const k = [c.fecha, c.tipo, c.punto, c.hora].map(x => encodeURIComponent(x)).join("|");
    const quienes = c.huespedes.map(h =>
      `${escaparHTML(h.room_no || "?")} ${escaparHTML((h.nombre || "").split(",")[0])}`).join(" · ");
    // El BT es un viaje EXTRA que pidió una reserva, no la llegada ni la salida de
    // nadie. Se marca distinto porque se coordina distinto: suele engancharse con otro
    // operador a una hora concreta, y lo que dice la reserva está en la nota.
    const esBT = c.tipo === "extra";
    const etiqueta = esBT ? "BT" : (c.tipo === "entrada" ? "Entra" : "Sale");
    const clase = esBT ? "" : (c.tipo === "entrada" ? "badge-ok" : "badge-warn");
    return `<tr>
      <td>${escaparHTML(c.fecha)}</td>
      <td><span class="badge ${clase}" ${esBT ? 'style="background:var(--forest, #2C4A3E);color:#fff;" title="Boat transfer: viaje extra que pidió la reserva"' : ""}>${etiqueta}</span></td>
      <td><strong>${esBT ? "hab. " + escaparHTML(c.punto) : escaparHTML(c.punto)}</strong></td>
      <td>${c.hora
            ? escaparHTML(c.hora)
            : `<span style="color:var(--warn-text);font-size:11.5px;">${escaparHTML(c.hora_origen || "sin hora")}</span>`}</td>
      <td>${c.huespedes.length} hab.
        <br><span style="font-size:10.5px;color:var(--muted);">${quienes}</span>
        ${c.nota_bt ? `<br><span style="font-size:10.5px;color:var(--forest, #2C4A3E);"
             title="${escaparHTML(c.nota_bt)}">${escaparHTML(c.nota_bt.slice(0, 95))}${c.nota_bt.length > 95 ? "…" : ""}</span>` : ""}</td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;"><strong>${c.pax}</strong></td>
      <td>${celdaGuia(c.guia_nombre)}</td>
      <td>${puedo
            ? `<select onchange="asignarTraslado('${k}','bote',this.value)">${opcB(c.bote_nombre)}</select>`
            : escaparHTML(c.bote_nombre || "Sin asignar")}
        ${c.aviso_capacidad ? `<br><span style="font-size:10.5px;color:var(--danger-text);">no cabe</span>` : ""}</td>
      <td>${puedo
            ? `<select onchange="asignarTraslado('${k}','capitan',this.value)">${opcC(c.capitan_nombre, c.ayudante_nombre)}</select>`
            : escaparHTML(c.capitan_nombre || "Sin asignar")}</td>
      <td>${puedo
            ? `<select onchange="asignarTraslado('${k}','ayudante',this.value)">${opcC(c.ayudante_nombre, c.capitan_nombre)}</select>`
            : escaparHTML(c.ayudante_nombre || "—")}</td>
    </tr>`;
  };

  const avisos = (d.conflictos || []).concat(
    (d.corridas || []).map(c => c.aviso_capacidad).filter(Boolean));

  return `
    <div style="margin-bottom:18px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 2px;">
        Ingresos y salidas por locación · ${R.corridas} corrida${R.corridas === 1 ? "" : "s"} · ${R.pax} pax
        ${R.sin_guia ? `<span style="color:var(--warn-text);"> · ${R.sin_guia} sin guía</span>` : ""}
        ${R.sin_bote ? `<span style="color:var(--warn-text);"> · ${R.sin_bote} sin bote</span>` : ""}
        ${R.sin_capitan ? `<span style="color:var(--warn-text);"> · ${R.sin_capitan} sin capitán</span>` : ""}
      </p>
      <p style="font-size:11.5px;color:var(--muted);margin:0 0 8px;">
        Quién va al muelle de Sierpe o a la pista de Drake. Los que se mueven a la misma
        hora van en la misma corrida; el mismo bote puede hacer varios viajes al día.
        ${R.sin_hora ? `<strong>${R.sin_hora} corrida${R.sin_hora === 1 ? "" : "s"} sin hora:</strong> falta el vuelo de esos huéspedes y hasta que se sepa no se les puede poner viaje.` : ""}
      </p>
      ${avisos.length ? `
        <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:8px;padding:10px 12px;margin-bottom:10px;font-size:12.5px;">
          ${avisos.map(a => `<p style="margin:0 0 3px;">⚠ ${escaparHTML(a)}</p>`).join("")}
        </div>` : ""}
      <table style="font-size:12.5px;">
        <tr><th style="width:88px;">Fecha</th><th style="width:64px;">Dir.</th>
            <th style="width:74px;">Punto</th><th style="width:64px;">Hora</th>
            <th>Habitaciones</th><th style="width:50px;text-align:right;">Pax</th>
            <th style="width:130px;">Guía</th><th style="width:130px;">Bote</th>
            <th style="width:130px;">Capitán</th><th style="width:130px;">Ayudante</th></tr>
        ${d.corridas.map(fila).join("")}
      </table>
    </div>`;
}

async function asignarTraslado(clave, campo, valor, volver) {
  const [fecha, tipo, punto, hora] = clave.split("|").map(decodeURIComponent);
  const cuerpo = { fecha, tipo, punto, hora };
  cuerpo[campo] = valor;                    // vacío = quitar la asignación
  const res = await fetchAuth(`${API}/api/traslados/asignar`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cuerpo),
  });
  if (!res.ok) {
    avisar((await res.json().catch(() => ({}))).detail || "No se pudo asignar", true);
    return;
  }
  const d = await res.json();
  const COMO_SE_LLAMA = { guia: "Guía", bote: "Bote", capitan: "Capitán",
                          ayudante: "Ayudante" };
  avisar(valor ? `${COMO_SE_LLAMA[campo] || campo} asignado` : "Asignación quitada");
  const panel = document.getElementById("ag-alertas");
  if (panel) {
    panel.innerHTML = (d.alertas || []).length
      ? `<div style="background:var(--warn-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${d.alertas.map(a => `⚠ ${escaparHTML(a)}`).join("<br>")}</div>`
      : "";
  }
  // Se recarga LA PANTALLA DESDE LA QUE SE LLAMÓ. Las corridas se tocan desde las dos
  // —el guía desde la Agenda, el bote y la tripulación desde Transporte—, así que
  // recargar siempre la misma mandaría al usuario a otra pantalla cada vez que asigna.
  if (volver === "agenda") loadAgenda(); else loadTransporte();
}

// ---------- LOS TOURS QUE VAN EN BOTE (lado Transporte) ----------
//
// Un tour acuático es un viaje de bote igual que una corrida de muelle, y el lodge pidió
// verlos juntos: «se asignan en la parte de transportes, lo que son tours acuáticos que
// necesitan bote». Aquí se elige el bote, el capitán y el ayudante; el guía viene de la
// Agenda y solo se enseña.
//
// La unidad es (fecha, tour, grupo), no la reserva: el grupo es lo que el lodge usa para
// partir un tour que no cabe en un bote, y todo el grupo sube al mismo.
function seccionToursEnBote(d) {
  if (!d || !d.tours) return "";
  if (!d.tours.length) {
    return `<div style="margin-bottom:18px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 6px;">Tours que van en bote</p>
      <p class="empty" style="padding:14px 12px;">Ningún tour con bote en estas fechas.<small>Salen de la agenda: aparecen solos en cuanto haya un tour acuático con fecha.</small></p>
    </div>`;
  }
  const puedo = puedeEscribir("transporte");
  const opcC = (actual, ocupado) => `<option value="">Sin asignar</option>` + (d.capitanes || [])
    .filter(c => c.nombre !== ocupado || c.nombre === actual)
    .map(c => `<option value="${escaparHTML(c.nombre)}"${c.nombre === actual ? " selected" : ""}>${escaparHTML(c.nombre)}</option>`).join("");
  const opcB = (actual) => `<option value="">Sin asignar</option>` + (d.botes || [])
    .filter(b => b.gestionado_por_hotel || b.nombre === actual)
    .map(b => `<option value="${escaparHTML(b.nombre)}"${b.nombre === actual ? " selected" : ""}>${escaparHTML(b.nombre)}${b.capacidad_max ? ` (${b.capacidad_max})` : ""}</option>`).join("");
  const celdaGuia = (actual) => actual
    ? escaparHTML(actual)
    : `<span style="color:var(--warn-text);font-size:11.5px;">sin guía — se pone en la Agenda</span>`;

  const fila = (t) => {
    // La MODALIDAD viaja en la clave: el bote del PNC privado no es el del compartido.
    // Y si es privada, también SU reserva: dos privadas del mismo día son dos salidas.
    const k = [t.fecha, t.tour_codigo, t.grupo, t.privado ? "1" : "0", t.conf_no || ""]
      .map(x => encodeURIComponent(x)).join("|");
    const quienes = t.habitaciones.map(h =>
      `${escaparHTML(h.room_no || "?")} ${escaparHTML((h.nombre || "").split(",")[0])}`).join(" · ");
    return `<tr>
      <td>${escaparHTML(t.fecha)}</td>
      <td><strong>${escaparHTML(t.tour_codigo)}</strong>${t.grupo && t.grupo !== "A" ? ` <span class="badge">${escaparHTML(t.grupo)}</span>` : ""}
        ${t.privado ? ` ${insigniaPrivado()}` : ""}
        <br><span style="font-size:10.5px;color:var(--muted);">${escaparHTML(t.tour_nombre || "")}</span></td>
      <td>${t.hora ? escaparHTML(t.hora) : `<span style="color:var(--muted);font-size:11.5px;">sin horario</span>`}</td>
      <td>${t.habitaciones.length} hab.
        <br><span style="font-size:10.5px;color:var(--muted);">${quienes}</span></td>
      <td style="text-align:right;font-variant-numeric:tabular-nums;"><strong>${t.pax}</strong></td>
      <td>${celdaGuia(t.guia_nombre)}</td>
      <td>${puedo
            ? `<select onchange="asignarTourBote('${k}','bote',this.value)">${opcB(t.bote_nombre)}</select>`
            : escaparHTML(t.bote_nombre || "Sin asignar")}</td>
      <td>${puedo
            ? `<select onchange="asignarTourBote('${k}','capitan',this.value)">${opcC(t.capitan_nombre, t.ayudante_nombre)}</select>`
            : escaparHTML(t.capitan_nombre || "Sin asignar")}</td>
      <td>${puedo
            ? `<select onchange="asignarTourBote('${k}','ayudante',this.value)">${opcC(t.ayudante_nombre, t.capitan_nombre)}</select>`
            : escaparHTML(t.ayudante_nombre || "—")}</td>
    </tr>`;
  };

  const sinBote = d.tours.filter(t => !t.bote_nombre).length;
  const sinCapitan = d.tours.filter(t => !t.capitan_nombre).length;
  return `
    <div style="margin-bottom:18px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 2px;">
        Tours que van en bote · ${d.tours.length} salida${d.tours.length === 1 ? "" : "s"} · ${d.tours.reduce((s, t) => s + t.pax, 0)} pax
        ${sinBote ? `<span style="color:var(--warn-text);"> · ${sinBote} sin bote</span>` : ""}
        ${sinCapitan ? `<span style="color:var(--warn-text);"> · ${sinCapitan} sin capitán</span>` : ""}
      </p>
      <p style="font-size:11.5px;color:var(--muted);margin:0 0 8px;">
        El bote se le pone al grupo entero: todos los del mismo grupo suben al mismo.
        <strong>El guía se elige en la Agenda de tours.</strong>
      </p>
      <table style="font-size:12.5px;">
        <tr><th style="width:88px;">Fecha</th><th style="width:120px;">Tour</th>
            <th style="width:64px;">Hora</th><th>Habitaciones</th>
            <th style="width:50px;text-align:right;">Pax</th>
            <th style="width:130px;">Guía</th><th style="width:130px;">Bote</th>
            <th style="width:130px;">Capitán</th><th style="width:130px;">Ayudante</th></tr>
        ${d.tours.map(fila).join("")}
      </table>
    </div>`;
}

async function asignarTourBote(clave, campo, valor) {
  const [fecha, tour_codigo, grupo, priv, conf_no] = clave.split("|").map(decodeURIComponent);
  const cuerpo = { fecha, tour_codigo, grupo, privado: priv === "1", conf_no };
  cuerpo[campo] = valor;                    // vacío = quitar la asignación
  const res = await fetchAuth(`${API}/api/traslados/tour`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(cuerpo),
  });
  if (!res.ok) {
    avisar((await res.json().catch(() => ({}))).detail || "No se pudo asignar", true);
    return;
  }
  const d = await res.json();
  const COMO_SE_LLAMA = { bote: "Bote", capitan: "Capitán", ayudante: "Ayudante" };
  avisar(valor ? `${COMO_SE_LLAMA[campo] || campo} asignado` : "Asignación quitada");
  const panel = document.getElementById("ag-alertas");
  if (panel) {
    panel.innerHTML = (d.alertas || []).length
      ? `<div style="background:var(--warn-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${d.alertas.map(a => `⚠ ${escaparHTML(a)}`).join("<br>")}</div>`
      : "";
  }
  loadTransporte();
}

// ---------- LA MODALIDAD PRIVADA ----------
//
// Un tour privado NO se suma con el compartido del mismo día: lleva su propio guía y su
// propio bote, que es exactamente lo que el huésped pagó. Juntarlos daría una salida
// donde hay dos, y el día del tour faltaría un guía.
//
// Las dos funciones viven aquí, juntas y usadas por todas las pantallas, para que la
// marca se vea igual en Agenda, Transporte y el detalle de la reserva: si cada una la
// dibujara a su manera, la misma salida parecería tres cosas distintas.

function insigniaPrivado() {
  return `<span class="badge" style="background:var(--forest, #2C4A3E);color:#fff;font-size:10px;">PRIVADO</span>`;
}

// La identidad de una «casilla» de tour: el código Y la modalidad. Es la clave con la
// que se agrupa el resumen y la que se compara al abrir el detalle.
function claveTipoTour(t) {
  return `${t.tour_codigo || "—"}${t.es_privado ? "|PRIV" : ""}`;
}

// Cuántas salidas hay de cada tour, con su pax y lo que falta por asignar.
//
// Cuánta gente de la reserva va a ESTE tour, editable.
//
// Antes la celda mostraba el pax de la RESERVA repetido con rowspan sobre todos sus
// tours, así que no había ni dónde verlo distinto ni dónde corregirlo: si de dos
// huéspedes uno no iba al manglar, el bote y la entrada del parque contaban dos.
//
// Se guarda al salir del campo, sin botón: el botón «Guardar» de la fila es el del guía
// y el bote, y mezclar dos cosas en un botón hace que se pierda una de las dos.
function celdaPaxTour(t) {
  const tope = t.pax_habitacion || 0;
  if (!puedeEscribir("agenda")) {
    return `${t.pax}${t.pax_editado_a_mano && tope ? `<span style="font-size:10.5px;color:var(--muted);"> de ${tope}</span>` : ""}`;
  }
  // El aviso «de N» sale solo cuando el número NO es la habitación entera: es la señal
  // de que alguien lo tocó a propósito y no un descuadre que haya que ir a arreglar.
  const distinto = tope && t.pax !== tope;
  return `<input type="number" id="px-${t.id}" value="${t.pax}" min="1" ${tope ? `max="${tope}"` : ""}
            onchange="cambiarPaxTour(${t.id}, this.value)"
            title="Cuántos de esta reserva van a este tour.${tope ? ` En la habitación hay ${tope}.` : ""} Vacío = todos."
            style="width:52px;font-size:12px;padding:3px 4px;${distinto ? 'border:1px solid var(--warn-text);font-weight:600;' : ''}">
          ${distinto ? `<br><span style="font-size:10px;color:var(--warn-text);">de ${tope}</span>` : ""}`;
}

async function cambiarPaxTour(tourId, valor) {
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/pax?pax=${encodeURIComponent(valor)}`,
                              { method: "POST" });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    avisar(e.detail || "No se pudo cambiar el pax", true);
    // Se recarga para que el campo vuelva al número que SÍ está guardado: dejarlo con
    // el número rechazado a la vista hace creer que quedó puesto.
    loadAgenda();
    return;
  }
  const d = await res.json();
  let msg = `Pax actualizado a ${d.pax}`;
  if (d.sinac) msg += ` · entrada del SINAC recalculada a ${d.sinac.pax_total}`;
  avisar(msg);
  const caja = document.getElementById("ag-alertas");
  if (caja && (d.alertas || []).length) {
    caja.innerHTML = d.alertas.map(a => `<p style="margin:2px 0;">${a}</p>`).join("");
  }
  // Recarga: el resumen por tipo de tour y los avisos de capacidad se calculan con
  // TODAS las filas, así que cambiar una a mano en sitio los dejaría mintiendo.
  loadAgenda();
}

// Se cuenta aquí y no en el servidor a propósito: la pantalla ya tiene todos los tours
// cargados, así que sumarlos no cuesta una consulta más ni cambia la API. Y así el
// resumen siempre cuadra con la tabla de abajo, porque sale de los mismos datos.
//
// El pax se cuenta por TOUR: de una reserva de 3 pueden ir los 3 al nocturno y solo 1 al
// manglar. Es lo que hace falta para saber si cabe en el bote.
function resumenPorTour(rows) {
  const porTour = {};
  let fueraTotal = 0;
  rows.forEach(r => r.tours.forEach(t => {
    // UN TOUR PRIVADO ES OTRA CASILLA. Lo pidió el lodge: «que no se sume de manera
    // automática con los tours normales sino en una casilla resumen aparte». Y es lo
    // correcto operativamente: lleva su propio guía y su propio bote, así que sumarlo
    // con el compartido daría un pax que ningún bote va a llevar junto.
    const k = claveTipoTour(t);
    const x = porTour[k] = porTour[k] || {
      clave: k, codigo: t.tour_codigo || "—", privado: !!t.es_privado,
      salidas: 0, pax: 0, sinGuia: 0, sinBote: 0, fuera: 0,
      horario: t.horario_inicio,
    };
    x.salidas += 1;
    x.pax += (t.pax != null ? t.pax : r.pax) || 0;
    if (!t.guia_nombre) x.sinGuia += 1;
    // UN TOUR TERRESTRE NO FALTA DE BOTE. La cabalgata, el claro del bosque o el
    // pajareo no llevan ninguno, y la tarjeta decía «2 sin bote» igual: un aviso que
    // sale siempre se deja de mirar, y el día que falta un bote de verdad se pierde
    // entre los que nunca lo necesitaron.
    if (t.requiere_bote && !t.bote_nombre) x.sinBote += 1;
    if (t.fuera_de_estadia) { x.fuera += 1; fueraTotal += 1; }
  }));
  const lista = Object.values(porTour).sort((a, b) =>
    (a.horario || "99:99").localeCompare(b.horario || "99:99")
    || a.codigo.localeCompare(b.codigo)
    || (a.privado ? 1 : 0) - (b.privado ? 1 : 0));
  if (!lista.length) return "";

  const totalPax = lista.reduce((s, x) => s + x.pax, 0);
  const totalSalidas = lista.reduce((s, x) => s + x.salidas, 0);

  return `
    <div style="margin-bottom:14px;">
      <p style="font-weight:600;font-size:13px;margin:0 0 8px;">
        Por tipo de tour · ${totalSalidas} salida${totalSalidas === 1 ? "" : "s"} · ${totalPax} pax
        <span style="font-weight:400;color:var(--muted);font-size:12px;">(toca un tour para ver guías y fechas)</span>
        ${fueraTotal ? `<span style="color:var(--danger-text);font-weight:600;"> · ${fueraTotal} fuera de la estadía</span>` : ""}
      </p>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">
        ${lista.map(x => `
          <div class="pulsable" onclick="detalleTipoDeTour('${x.clave}')" id="tarjeta-tour-${x.clave}"
               style="border:1px solid var(--linea, #d8d8d0);border-radius:8px;padding:8px 11px;min-width:120px;cursor:pointer;
                      ${x.fuera ? 'border-color:var(--danger-text);' : x.privado ? 'border-color:var(--forest, #2C4A3E);border-width:2px;' : ''}">
            <p style="margin:0;font-weight:600;font-size:12.5px;">${x.codigo}
              ${x.horario ? `<span style="font-weight:400;color:var(--muted);font-size:11px;">${x.horario}</span>` : ""}</p>
            ${x.privado ? `<p style="margin:2px 0 0;">${insigniaPrivado()}</p>` : ""}
            <p style="margin:2px 0 0;font-size:17px;font-weight:600;">${x.pax} <span style="font-size:11px;font-weight:400;color:var(--muted);">pax</span></p>
            <p style="margin:1px 0 0;font-size:11px;color:var(--muted);">${x.salidas} reserva${x.salidas === 1 ? "" : "s"}</p>
            ${x.sinGuia || x.sinBote ? `<p style="margin:3px 0 0;font-size:10.5px;color:var(--warn-text);">
              ${x.sinGuia ? `${x.sinGuia} sin guía` : ""}${x.sinGuia && x.sinBote ? " · " : ""}${x.sinBote ? `${x.sinBote} sin bote` : ""}</p>` : ""}
            ${x.fuera ? `<p style="margin:3px 0 0;font-size:10.5px;color:var(--danger-text);">${x.fuera} fuera de la estadía</p>` : ""}
            ${botonPasaportesTour(x.codigo)}
          </div>`).join("")}
      </div>
      <div id="detalle-tipo-tour"></div>
    </div>`;
}

// '2026-09-12' -> 'Sáb 12/09'. El día de la semana importa aquí: quien mira qué días se
// dio un tour está buscando patrones —«los nocturnos caen siempre en sábado»— y con la
// fecha sola hay que ir contando.
const DIAS_CORTOS = ["Dom", "Lun", "Mar", "Mié", "Jue", "Vie", "Sáb"];
function diaConNombre(iso) {
  const p = String(iso || "").split("-");
  if (p.length !== 3) return iso || "—";
  // Se construye con la hora del mediodía para que el huso horario no corra el día.
  const d = new Date(+p[0], +p[1] - 1, +p[2], 12);
  return `${DIAS_CORTOS[d.getDay()]} ${p[2]}/${p[1]}`;
}

// Quién guió cada salida de ESE tour y qué día.
//
// Sale de los tours que la pantalla ya tiene cargados —no de otra consulta— por lo mismo
// que el resumen de arriba: así no puede decir una cosa la tarjeta y otra el detalle.
//
// Se agrupa por FECHA y no por reserva: la pregunta es «¿quién dio este tour y cuándo?»,
// y un mismo día puede llevar varias habitaciones con el mismo guía. Agrupado por
// reserva habría que ir sumando de cabeza.
function detalleTipoDeTour(codigo) {
  const caja = document.getElementById("detalle-tipo-tour");
  if (!caja) return;
  const antes = window._tourAbierto;
  window._tourAbierto = (antes === codigo) ? null : codigo;
  document.querySelectorAll('[id^="tarjeta-tour-"]').forEach(el => {
    const suyo = el.id === `tarjeta-tour-${window._tourAbierto}`;
    el.style.background = suyo ? "var(--sand, #F5F1E8)" : "";
    el.style.borderColor = suyo ? "var(--forest, #2C4A3E)" : "";
  });
  if (!window._tourAbierto) { caja.innerHTML = ""; return; }
  caja.innerHTML = vistaDeTipoDeTour(codigo);
  adaptarTablasMovil();
}

function vistaDeTipoDeTour(clave) {
  // La clave trae la modalidad pegada: el detalle del PNC privado no puede enseñar las
  // salidas del PNC compartido, que es gente distinta en otro bote.
  const privado = clave.endsWith("|PRIV");
  const codigo = privado ? clave.slice(0, -5) : clave;
  const salidas = [];
  (window._agendaRows || []).forEach(r => (r.tours || []).forEach(t => {
    if (claveTipoTour(t) !== clave) return;
    salidas.push({
      fecha: t.fecha || r.fecha,
      guia: t.guia_nombre, bote: t.bote_nombre,
      grupo: t.grupo_operativo || "A",
      hab: r.room_no, nombre: r.nombre_principal,
      pax: (t.pax != null ? t.pax : r.pax) || 0,
      fuera: t.fuera_de_estadia,
    });
  }));
  if (!salidas.length) return "";

  const porFecha = {};
  salidas.forEach(s => (porFecha[s.fecha] = porFecha[s.fecha] || []).push(s));
  const fechas = Object.keys(porFecha).sort();
  const guiasTodos = [...new Set(salidas.map(s => s.guia).filter(Boolean))];
  const pax = salidas.reduce((a, s) => a + s.pax, 0);

  return `
    <div class="detail-panel" style="margin-top:10px;">
      <p style="font-weight:600;margin:0 0 2px;">${codigo} ${privado ? insigniaPrivado() : ""}
        <span style="font-weight:400;color:var(--muted);">— ${salidas.length} salida${salidas.length === 1 ? "" : "s"} ·
        ${pax} pax · ${fechas.length} día${fechas.length === 1 ? "" : "s"}</span></p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">
        ${guiasTodos.length
          ? `Guías que lo dieron: <strong style="color:var(--texto);">${guiasTodos.join(" · ")}</strong>`
          : `<span style="color:var(--warn-text);">Todavía sin guía asignado.</span>`}
      </p>
      ${fechas.map(f => {
        const dia = porFecha[f];
        const guiasDia = [...new Set(dia.map(s => s.guia).filter(Boolean))];
        const paxDia = dia.reduce((a, s) => a + s.pax, 0);
        return `
          <p style="margin:10px 0 4px;font-weight:600;font-size:13px;">
            ${diaConNombre(f)} ${etiquetaFecha(f)}
            <span style="font-weight:400;color:var(--muted);">— ${paxDia} pax,
              ${dia.length} reserva${dia.length === 1 ? "" : "s"}</span>
            ${guiasDia.length
              ? `<span class="badge badge-tour" style="margin-left:6px;">${guiasDia.join(" · ")}</span>`
              : `<span class="badge badge-warn" style="margin-left:6px;">sin guía</span>`}
          </p>
          <table>
            <tr><th>Guía</th><th>Bote</th><th>Grupo</th><th>Hab.</th><th>Huésped</th><th>Pax</th></tr>
            ${dia.map(s => `<tr>
              <td>${s.guia || '<span style="color:var(--warn-text);">sin asignar</span>'}</td>
              <td>${s.bote || '<span style="color:var(--warn-text);">sin asignar</span>'}</td>
              <td>${s.grupo}</td>
              <td><strong>${s.hab || '—'}</strong></td>
              <td>${s.nombre || '—'}${s.fuera ? ' <span class="badge badge-warn">fuera de la estadía</span>' : ''}</td>
              <td>${s.pax}</td>
            </tr>`).join("")}
          </table>`;
      }).join("")}
    </div>`;
}

async function cambiarFechaTour(tourId, fecha, fechaAnterior) {
  if (!fecha) { avisar("Fecha vacía", true); return; }
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/fecha?fecha=${fecha}`, { method: "POST" });
  if (!res.ok) {
    const e = await res.json();
    avisar(e.detail || "No se pudo cambiar la fecha", true);
    loadAgenda();
    return;
  }
  const d = await res.json();
  if (d.sin_cambios) return;

  let msg = `Tour movido al ${d.a}`;
  if (d.entrada_sinac_movida) msg += " · entrada SINAC actualizada";
  if (d.itinerario === "actualizado" || d.itinerario === "regenerado") msg += " · itinerario actualizado";
  avisar(msg);

  const panel = document.getElementById("ag-alertas");
  let avisos = [];
  if (d.itinerario === "requiere revisión manual") {
    avisos.push("El itinerario de esta reserva fue editado a mano y no se pudo ajustar solo. Revísalo antes de enviarlo.");
  }
  avisos = avisos.concat(d.alertas || []);
  if (panel) {
    panel.innerHTML = avisos.length
      ? `<div style="background:var(--warn-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${avisos.map(a => `⚠ ${a}`).join("<br>")}</div>`
      : `<div style="background:var(--ok-bg);border-radius:var(--r-sm);padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ok-text);">Tour movido del ${d.de} al ${d.a}. Todo lo relacionado quedó actualizado.</div>`;
  }
  loadAgenda();
}

async function cambiarGrupo(tourId, grupo) {
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/grupo?grupo=${grupo}`, { method: "POST" });
  const data = await res.json();
  const panel = document.getElementById("ag-alertas");
  if (data.alertas && data.alertas.length) {
    panel.innerHTML = `<div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${data.alertas.map(a => `⚠ ${a}`).join("<br>")}</div>`;
  } else {
    panel.innerHTML = `<div style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ok-text);">Movido al grupo ${data.grupo}. Asigna su guía y bote.</div>`;
  }
  loadAgenda();
}

// Marca visualmente la fila cuando se cambia un guía o bote y aún no se ha guardado
function marcarSinGuardar(tourId) {
  const fila = document.getElementById(`g-${tourId}`)?.closest("tr");
  if (fila) fila.classList.add("sin-guardar");
  window._agendaSinGuardar = window._agendaSinGuardar || new Set();
  window._agendaSinGuardar.add(tourId);
  const btn = document.querySelector(`button[onclick="guardarAsignacion(${tourId})"]`);
  if (btn) { btn.textContent = "Guardar *"; btn.classList.add("btn-primary"); }
}

async function guardarAsignacion(tourId) {
  const guia = document.getElementById(`g-${tourId}`).value;
  // Solo el GUÍA. El bote se elige en Transporte, y mandarlo desde aquí lo pisaría: el
  // servidor distingue «no me mandaron el dato» de «lo dejaron en Sin asignar», así que
  // mandar un campo vacío que ni siquiera está en la pantalla borraría el bote que
  // Transporte acaba de poner. Se manda vacío a propósito cuando el guía se quita.
  const params = new URLSearchParams();
  params.append("guia", guia);
  const res = await fetchAuth(`${API}/api/tours/agenda/${tourId}/asignar?${params.toString()}`, { method: "POST" });
  const data = await res.json();
  // La fila deja de estar marcada como pendiente de guardar
  const fila = document.getElementById(`g-${tourId}`)?.closest("tr");
  if (fila) fila.classList.remove("sin-guardar");
  window._agendaSinGuardar?.delete(tourId);
  const btn = document.querySelector(`button[onclick="guardarAsignacion(${tourId})"]`);
  if (btn) { btn.textContent = "Guardar"; btn.classList.remove("btn-primary"); }
  avisar(data.alertas && data.alertas.length ? "Guardado, revisa el aviso de capacidad" : "Asignación guardada");
  const panel = document.getElementById("ag-alertas");
  if (data.alertas && data.alertas.length) {
    panel.innerHTML = `<div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--warn-text);">${data.alertas.map(a => `⚠ ${a}`).join("<br>")}</div>`;
  } else {
    panel.innerHTML = `<div style="background:var(--ok-bg);border-radius:8px;padding:10px 12px;margin-bottom:12px;font-size:13px;color:var(--ok-text);">Asignación guardada, sin conflictos de capacidad.</div>`;
  }
}

// ---------- VISTA PREVIA DE LA HOJA DEL DÍA ----------
//
// Se enseña EL PDF DE VERDAD, no un dibujo parecido hecho en HTML. Esta hoja se imprime
// y se fotografía para mandarla al grupo, así que una vista previa que no sea el
// documento final podría mentir justo en lo que se va a repartir: una columna que
// allá se recorta, una fila que se va a la segunda página.
//
// El PDF se pide UNA vez y se reutiliza para ver, imprimir y descargar, así que lo que
// se mira y lo que se manda son el mismo archivo, no dos generaciones distintas.
// `fecha` para la hoja de UN día; `desde`/`hasta` para la del periodo. Es el mismo
// visor porque es el mismo documento: cambia la unidad de cada renglón, no el papel.
async function vistaPreviaHoja(fecha, desde, hasta) {
  avisar("Preparando la hoja…");
  const rango = !fecha && desde && hasta;
  // La FECHA, no solo la insignia: `etiquetaFecha` devuelve «Hoy» o nada, y un título
  // que pone «Hoja de operación» a secas no dice de qué día es el papel que se va a
  // imprimir. En un rango no dice nada en absoluto.
  const titulo = rango ? `${desde} — ${hasta}`
                       : `${fecha} ${etiquetaFecha(fecha)}`;
  let blob;
  try {
    const res = await fetchAuth(
      rango ? `${API}/api/export/resumen-operacion?desde=${desde}&hasta=${hasta}&formato=pdf`
            : `${API}/api/export/resumen-operacion?fecha=${fecha}&formato=pdf`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
    blob = await res.blob();
  } catch (e) {
    avisar("No se pudo generar la hoja: " + e.message, true);
    return;
  }
  mostrarPDF({
    blob,
    titulo: `Hoja de operación ${titulo}`,
    subtitulo: `Así se va a imprimir. Es el mismo archivo que se descarga.${
      rango ? " Es la hoja de siempre con una columna de fecha, y lleva "
              + "<strong>solo las entradas y salidas</strong> del periodo." : ""}`,
    archivo: rango ? `operacion-${desde}_a_${hasta}.pdf` : `operacion-${fecha}.pdf`,
  });
}

// EL VISOR, UNO SOLO para todo lo que se imprime. Lo usan la hoja de operación y la
// tarjeta de alergias, y lo usará lo próximo: si cada pantalla armara el suyo, una
// acabaría sin liberar el objeto al cerrar —son megabytes por cada vez que se abre— o
// imprimiendo la página en vez del PDF.
function mostrarPDF({ blob, titulo, subtitulo, archivo, ancho }) {
  const url = URL.createObjectURL(blob);
  const fondo = document.createElement("div");
  fondo.className = "modal-fondo";
  fondo.id = "modal-hoja";
  const cerrar = () => { URL.revokeObjectURL(url); fondo.remove(); };
  fondo.onclick = (e) => { if (e.target === fondo) cerrar(); };
  fondo.innerHTML = `
    <div class="modal-caja" style="max-width:${ancho || "1180px"};">
      <div class="modal-encabezado">
        <div>
          <p class="title">${titulo}</p>
          <p class="subtitle">${subtitulo || ""}</p>
        </div>
        <button class="modal-cerrar" id="hoja-x" title="Cerrar">×</button>
      </div>
      <iframe id="hoja-marco" src="${url}#toolbar=0&navpanes=0"
              style="width:100%;height:68vh;min-height:420px;border:1px solid var(--linea,#d8d8d0);
                     border-radius:8px;background:#fff;margin-top:10px;"></iframe>
      <p style="margin:10px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
        <button class="btn btn-primary" id="hoja-imprimir">🖨 Imprimir</button>
        <button class="btn" id="hoja-descargar">⬇ Descargar PDF</button>
        <span style="font-size:11.5px;color:var(--muted);">
          Si el recuadro sale en blanco —pasa en algunos teléfonos, que no traen visor de
          PDF— descárgalo y se abre igual.</span>
      </p>
    </div>`;
  document.body.appendChild(fondo);

  fondo.querySelector("#hoja-x").onclick = cerrar;
  fondo.querySelector("#hoja-imprimir").onclick = () => {
    // Se imprime el PDF que ya está cargado, no la página: imprimir la pantalla daría
    // el menú, las tarjetas y los botones.
    const marco = document.getElementById("hoja-marco");
    try {
      marco.contentWindow.focus();
      marco.contentWindow.print();
    } catch (e) {
      // Algunos navegadores no dejan imprimir dentro de un iframe de blob. Abrirlo en
      // su propia pestaña siempre funciona, y desde ahí se imprime.
      window.open(url, "_blank");
    }
  };
  fondo.querySelector("#hoja-descargar").onclick = () => {
    const a = document.createElement("a");
    a.href = url;
    a.download = archivo || "documento.pdf";
    document.body.appendChild(a); a.click(); a.remove();
  };
}

// ---------- TRANSPORTE ----------
async function loadTransporte(fecha, desde, hasta) {
  setActive(3);
  const F = FILTROS.transporte;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desde) F.desde = desde;
  if (hasta) F.hasta = hasta;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  let url = fecha ? `${API}/api/transporte?fecha=${fecha}` : `${API}/api/transporte?desde=${F.desde}&hasta=${F.hasta}`;
  const res = await fetchAuth(url);
  const d = await res.json();
  // Los pendientes van con EL MISMO filtro que la tabla de arriba. Sin esto la pantalla
  // mostraba un día arriba y las 56 pendientes de toda la base abajo.
  const pendientes = await (await fetchAuth(
    fecha ? `${API}/api/transporte/pendientes?fecha=${fecha}`
          : `${API}/api/transporte/pendientes?desde=${F.desde}&hasta=${F.hasta}`)).json();
  // Las corridas de bote: qué viajes hay que cubrir y quién va en cada uno. Estaban en
  // Agenda de tours y el lodge las mandó aquí, que es donde se coordina el movimiento.
  //
  // El fallo se DEVUELVE, no se traga: seccionTraslados lo muestra. Devolviendo null la
  // sección desaparecía de la pantalla y no había forma de saber que existía.
  const urlTras = fecha ? `${API}/api/traslados?fecha=${fecha}`
                        : `${API}/api/traslados?desde=${F.desde}&hasta=${F.hasta}`;
  const tras = await fetchAuth(urlTras).then(r => r.json())
    .catch(e => ({ detail: "No hubo respuesta del servidor (" + e.message + ")." }));
  const app = document.getElementById("app");
  // La hora la resuelve el servidor con las reglas del lodge: por Sierpe el horario
  // fijo del bote, por Drake el vuelo o el bote calculado desde él. Se marca de dónde
  // sale cada una, para distinguir lo confirmado de lo que falta de verdad.
  const celdaHora = r => r.hora_efectiva
    ? `${r.hora_efectiva}${r.hora_origen === "del PDF" ? ""
        : ` <span style="font-size:10px;color:var(--muted);">${r.hora_origen}</span>`}`
    : `<span style="color:var(--warn-text);">${r.hora_origen}</span>`;
  // Quién lo lleva. Se asigna en la Agenda de tours —«Ingresos y salidas por locación»—
  // y se muestra aquí porque esta es la pantalla que se mira el día del movimiento:
  // decir el punto y la hora sin decir quién va es justo lo que había que preguntar
  // por radio. Si falta, se dice en rojo: es alguien que puede quedarse esperando.
  const celdaQuien = r => {
    const g = r.guia_traslado, b = r.bote_traslado;
    if (!g && !b) return `<span style="color:var(--warn-text);font-size:11.5px;">sin asignar</span>`;
    return `${g ? escaparHTML(g) : `<span style="color:var(--warn-text);">sin guía</span>`}`
         + `<br><span style="font-size:10.5px;color:var(--muted);">`
         + `${b ? escaparHTML(b) : `<span style="color:var(--warn-text);">sin bote</span>`}</span>`;
  };
  const filaE = r => `<tr><td>${r.arr_date}</td><td>${r.room_no}${etiquetaGrupo(r.conf_no)}</td><td>${r.nombre_principal}</td><td>${r.punto_entrada||"-"}</td><td>${celdaHora(r)}</td><td>${celdaQuien(r)}</td><td>${r.adl+r.chl}</td></tr>`;
  const filaS = r => `<tr><td>${r.dep_date}</td><td>${r.room_no}${etiquetaGrupo(r.conf_no)}</td><td>${r.nombre_principal}</td><td>${r.punto_salida||"-"}</td><td>${celdaHora(r)}</td><td>${celdaQuien(r)}</td><td>${r.adl+r.chl}</td></tr>`;
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Transporte ${fecha ? etiquetaFecha(fecha) : ''}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadTransporte(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha||""}" onchange="loadTransporte(this.value)">
          <button class="btn" onclick="loadTransporte(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadTransporte(hoyISO())">Hoy</button>
          <button class="btn" onclick="loadTransporte(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="tr-desde" value="${F.desde}">
          <input type="date" id="tr-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadTransporte(null, document.getElementById('tr-desde').value, document.getElementById('tr-hasta').value)">Ver rango</button>
          <button class="btn" onclick="descargar('transporte', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('transporte', {fecha: '${fecha||''}', desde: '${fecha?'':F.desde}', hasta: '${fecha?'':F.hasta}'}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      ${seccionTraslados(tras)}
      ${seccionToursEnBote(tras)}
      <p style="font-weight:600;font-size:14px;">Entradas</p>
      ${d.entradas.length ? `<table><tr><th>Fecha</th><th>Hab.</th><th>Huésped</th><th>Punto</th><th>Hora</th><th>Guía / bote</th><th>Pax</th></tr>${d.entradas.map(filaE).join("")}</table>` : `<p class="empty">Nadie ingresa este día.<small>Cambia la fecha con las flechas para revisar otro día.</small></p>`}
      <p style="font-weight:600;font-size:14px;margin-top:16px;">Salidas</p>
      ${d.salidas.length ? `<table><tr><th>Fecha</th><th>Hab.</th><th>Huésped</th><th>Punto</th><th>Hora</th><th>Guía / bote</th><th>Pax</th></tr>${d.salidas.map(filaS).join("")}</table>` : `<p class="empty">Nadie sale este día.</p>`}
      ${pendientes.length && puedeEscribir("transporte") ? `
        <p style="font-weight:600;font-size:14px;margin-top:20px;color:var(--warn-text);">⚠ Pendientes de confirmar (${pendientes.length})</p>
        <p style="font-size:12px;color:var(--muted);margin:0 0 8px;">De ${fecha ? "este día" : "este rango"}. La reserva menciona un ingreso o salida, pero no dice si es por Sierpe o Drake.</p>
        ${pendientes.map(p => `
          ${p.punto_entrada_sin_confirmar ? `
            <div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;">
              <span style="color:var(--warn-text);"><strong>Entrada</strong> · ${p.nombre_principal} (hab. ${p.room_no}, ${p.arr_date}): "${p.punto_entrada_sin_confirmar}"</span>
              <button class="btn" style="margin-left:8px;" onclick="confirmarTransporte('${p.conf_no}','entrada','Sierpe')">Es Sierpe</button>
              <button class="btn" onclick="confirmarTransporte('${p.conf_no}','entrada','Drake')">Es Drake</button>
            </div>` : ""}
          ${p.punto_salida_sin_confirmar ? `
            <div style="background:var(--warn-bg);border-radius:8px;padding:10px 12px;margin-bottom:8px;font-size:13px;">
              <span style="color:var(--warn-text);"><strong>Salida</strong> · ${p.nombre_principal} (hab. ${p.room_no}, ${p.dep_date}): "${p.punto_salida_sin_confirmar}"</span>
              <button class="btn" style="margin-left:8px;" onclick="confirmarTransporte('${p.conf_no}','salida','Sierpe')">Es Sierpe</button>
              <button class="btn" onclick="confirmarTransporte('${p.conf_no}','salida','Drake')">Es Drake</button>
            </div>` : ""}
        `).join("")}` : ""}
    </div>
  `;
}

async function confirmarTransporte(confNo, tipo, punto) {
  await fetchAuth(`${API}/api/reservas/${confNo}/transporte?tipo=${tipo}&punto=${punto}`, { method: "POST" });
  avisar(`Confirmado: ${tipo} por ${punto}`);
  loadTransporte();
}

// ---------- ENTRADAS SINAC ----------
async function loadEntradas(desde, hasta) {
  setActive(4);
  // Esta pantalla mantiene su propio rango, mirando hacia adelante: lo útil es ver
  // qué falta comprar en los próximos meses, no lo que ya pasó.
  if (desde) FILTROS.sinac.desde = desde;
  if (hasta) FILTROS.sinac.hasta = hasta;
  desde = FILTROS.sinac.desde; hasta = FILTROS.sinac.hasta;
  // Las dos peticiones salen juntas: son del mismo rango y la pantalla las necesita a
  // la vez. Los tiquetes se piden con tolerancia —si fallan, la pantalla sale igual—
  // porque un comprobante que no carga no debería dejar a recepción sin ver qué falta
  // comprar, que es para lo que esta pantalla existía antes.
  const [res, resTq] = await Promise.all([
    fetchAuth(`${API}/api/entradas-sinac?desde=${desde}&hasta=${hasta}`),
    fetchAuth(`${API}/api/tiquetes-sinac?desde=${desde}&hasta=${hasta}`).catch(() => null),
  ]);
  const rows = await res.json();
  const dTq = (resTq && resTq.ok) ? await resTq.json().catch(() => null) : null;
  const tiquetes = (dTq && dTq.tiquetes) || [];
  const vencidas = rows.filter(e => e.urgencia === "VENCIDA").length;
  const urgentes = rows.filter(e => e.urgencia === "URGENTE").length;
  const aTiempo  = rows.filter(e => e.urgencia === "A_TIEMPO").length;
  const compradas = rows.filter(e => e.estado === "COMPRADA").length;
  window._sinacRows = rows;
  window._sinacTiquetes = tiquetes;
  window._sinacPuedeSubir = !!(dTq && dTq.puede_subir);
  // Sin esperar: deja en el teléfono los comprobantes de los próximos días mientras hay
  // señal, para que se abran en el puesto del parque. Ver precargarTiquetes.
  precargarTiquetes(tiquetes);
  const colorUrg = { VENCIDA:"fila-sale", URGENTE:"fila-entra", A_TIEMPO:"", OK:"", PASADA:"fila-salio", SIN_FECHA:"" };

    if (e.estado === "COMPRADA") return "—";

    if (e.dias_para_limite < 0) return `VENCIÓ hace ${Math.abs(e.dias_para_limite)} d`;
    if (e.dias_para_limite === 0) return "Vence HOY";
    return `Faltan ${e.dias_para_limite} d`;
  };
  const app = document.getElementById("app");
  app.innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Entradas SINAC</p>
        <div class="filterbar">
