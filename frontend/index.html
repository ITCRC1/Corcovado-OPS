          <button class="btn" onclick="descargar('entradas-sinac', {desde, hasta}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('entradas-sinac', {desde, hasta}, 'pdf')">⬇ PDF</button>
        </div>
      </div>
      <p class="subtitle" style="margin-bottom:10px;">Compra requerida 15 días antes del tour · mostrando ${desde} a ${hasta}</p>
      <div class="stats" style="grid-template-columns:repeat(5,1fr);">
        <div class="stat" onclick="detalleSinac('VENCIDA')"><p class="stat-label">Plazo vencido</p><p class="stat-value" style="color:var(--danger-text);">${vencidas}</p></div>
        <div class="stat" onclick="detalleSinac('URGENTE')"><p class="stat-label">Urgentes (≤7 días)</p><p class="stat-value" style="color:var(--warn-text);">${urgentes}</p></div>
        <div class="stat" onclick="detalleSinac('A_TIEMPO')"><p class="stat-label">A tiempo</p><p class="stat-value">${aTiempo}</p></div>
        <div class="stat" onclick="detalleSinac('OK')"><p class="stat-label">Ya compradas</p><p class="stat-value" style="color:var(--ok-text);">${compradas}</p></div>
        <div class="stat" id="tarjeta-tiquetes" onclick="detalleTiquetes()" title="Los comprobantes del SINAC, para enseñarlos en el puesto del parque">
          <p class="stat-label">🎟 Tiquets adquiridos</p>
          <p class="stat-value" style="color:var(--forest);">${tiquetesHoyManana(tiquetes).length}</p>
          <p style="font-size:11px;color:var(--muted);margin:2px 0 0;">hoy y mañana${
            tiquetes.length > tiquetesHoyManana(tiquetes).length
              ? ` · ${tiquetes.length} en el rango` : ""}</p></div>
      </div>
      <div id="sinac-detalle"></div>
      ${rows.some(e => e.huerfana) ? `
        <div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:11px 13px;margin-bottom:12px;font-size:12.5px;">
          <p style="margin:0 0 4px;font-weight:600;">⚠ ${rows.filter(e => e.huerfana).length} entrada(s) comprada(s) sin reservas asignadas</p>
          <p style="margin:0;">Se pagaron y después el tour cambió de fecha o la reserva se canceló,
          así que ya no le corresponden a nadie. Aparecen marcadas <strong>sin reservas</strong>
          en la tabla. Revisá si se pueden reutilizar antes de comprar otra.</p>
        </div>` : ""}
      <table>
        <tr><th>Fecha tour</th><th>Actividad</th><th>Reservas</th><th>Pax + guía</th><th>Comprar antes de</th><th>Plazo</th><th>Conf.</th><th>Estado</th>${puedeEscribir("sinac") ? "<th></th>" : ""}</tr>
        ${rows.map(e => `
          <tr class="${colorUrg[e.urgencia] || ''}">
            <td>${e.fecha}</td><td>${e.tour_codigo}</td>
            <td style="font-size:12px;">${(e.reservas && e.reservas.length)
                ? e.reservas.map(x => `Hab.${x.room_no} ${x.nombre_principal.split(",")[0]}`).join("<br>")
                : `<span class="badge badge-warn" style="font-size:10px;">sin reservas</span>`}</td>
            <td><strong>${e.pax_total_grupo}</strong><br><span style="font-size:11px;color:var(--muted);">${e.pax_huespedes || 0} pax + guía</span></td>
            <td>${e.fecha_limite_compra || "—"}</td>
            <td><strong>${textoUrg(e)}</strong></td>
            <td>${e.conf_entrada || "-"}${marcaTiquete(e)}</td>
            <td><span class="badge ${e.estado === "COMPRADA" ? "badge-ok" : "badge-warn"}">${e.estado.replace("_"," ")}</span></td>
            ${puedeEscribir("sinac") ? `<td>${e.estado !== "COMPRADA" ? `<button class="btn" onclick="marcarEntrada(${e.id})">Marcar comprada</button>` : ""}</td>` : ""}
          </tr>`).join("") || `<tr><td colspan="9" class="empty">Sin entradas SINAC en estas fechas. Amplía el rango para ver las de los próximos meses.</td></tr>`}
      </table>
      <div class="leyenda">
        <span><i style="background:#FDE8E8;"></i>Plazo de compra vencido</span>
        <span><i style="background:#FFF8DC;"></i>Urgente (7 días o menos)</span>
        <span><i style="background:#F2F2F0;"></i>Tour ya pasó</span>
      </div>
    </div>
  `;
}

function detalleSinac(urgencia) {
  const panel = document.getElementById("sinac-detalle");
  if (window._sinacAbierto === urgencia) {
    window._sinacAbierto = null;
    panel.innerHTML = "";
    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._sinacAbierto = urgencia;
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");
  const titulos = {
    VENCIDA: "Plazo de compra vencido",
    URGENTE: "Urgentes — quedan 7 días o menos",
    A_TIEMPO: "A tiempo",
    OK: "Ya compradas",
  };
  const lista = (window._sinacRows || []).filter(e => e.urgencia === urgencia);
  if (!lista.length) {
    panel.innerHTML = `<div class="detail-panel">No hay entradas en esta categoría.</div>`;
    return;
  }
  // Se agrupa por reserva para ver, huésped por huésped, qué entradas le corresponden
  const porReserva = {};
  lista.forEach(e => (e.reservas || []).forEach(r => {
    const k = r.conf_no;
    if (!porReserva[k]) porReserva[k] = { ...r, entradas: [] };
    porReserva[k].entradas.push(e);
  }));
  const reservas = Object.values(porReserva);
  const totalEntradas = lista.reduce((s, e) => s + (e.pax_total_grupo || 0), 0);

  panel.innerHTML = `
    <div class="detail-panel">
      <p style="font-weight:600;margin:0 0 4px;">${titulos[urgencia]} — ${lista.length} salidas · ${totalEntradas} entradas en total</p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Toca el número de reserva para ver toda su información.</p>
      ${reservas.length ? reservas.map(r => `
        <div style="border-bottom:1px solid var(--border);padding:8px 0;">
          <p style="margin:0;font-weight:600;">
            <a href="#" onclick="verDetalleReserva('${r.conf_no}'); return false;" style="color:var(--forest);text-decoration:underline;">${r.conf_no}</a>
            · Hab. ${r.room_no} · ${r.nombre_principal}
            <span style="font-weight:400;color:var(--muted);">(${r.adl + r.chl} pax)</span>
          </p>
          ${r.entradas.map(e => `<p style="margin:3px 0 0;font-size:12px;">
              <span class="badge badge-tour">${e.tour_codigo}</span> ${e.fecha}
              · comprar antes de <strong>${e.fecha_limite_compra || "—"}</strong>
              ${e.dias_para_limite !== null && e.estado !== "COMPRADA"
                ? (e.dias_para_limite < 0 ? ` · <span style="color:var(--danger-text);">venció hace ${Math.abs(e.dias_para_limite)} d</span>`
                                          : ` · faltan ${e.dias_para_limite} d`)
                : ""}
              ${e.conf_entrada ? ` · conf. ${e.conf_entrada}` : ""}
            </p>`).join("")}
        </div>`).join("")
      : `<p style="font-size:13px;color:var(--muted);">Estas entradas no tienen reservas asociadas visibles.</p>`}
    </div>`;
}

// ---------- TIQUETS ADQUIRIDOS ----------
//
// El comprobante que el SINAC manda al comprar la entrada. Vivía en el correo de
// recepción, y en el puesto del parque no hay señal: el guía salía con una impresión,
// con una captura, o sin nada.
//
// VA AQUÍ, en la pantalla de Entradas SINAC, con el mismo filtro de fechas que ya tiene
// y con la misma forma que los otros cuatro recuadros. No es una pantalla nueva: es
// donde recepción ya mira qué falta comprar, y es un sitio menos que abrir para el guía.
//
// QUIÉN HACE QUÉ. Recepción sube y borra ('sinac' en escribir); el guía solo abre
// ('sinac' en ver, que es lo que el perfil «Guías» pasa a llevar). Nadie descarga nada:
// se abre para enseñarlo, igual que los pasaportes.
//
// CUÁL SIRVE PARA CUÁL LO DECIDE EL SERVIDOR. Cada fila de la tabla ya viene con la
// lista de tiquetes que la cubren (ver tiquetes.cubre en el backend). Esa regla está
// escrita UNA vez: repetirla aquí en JavaScript es cómo las dos acaban diciendo cosas
// distintas sin que nadie se entere.

// La marca que va en la celda de confirmación cuando esa entrada ya tiene comprobante.
function marcaTiquete(e) {
  const ids = e.tiquetes || [];
  if (!ids.length) return "";
  return ` <a href="#" onclick="verTiquete(${ids[0]}); return false;"
    title="Ver el tiquete de esta entrada" style="text-decoration:none;">🎟</a>`;
}

// ---------- TIQUETS ADQUIRIDOS ----------
//
// ABRE EN HOY Y MAÑANA, y lo demás por rango. Lo pidió el lodge: «mostrar solo los del
// día en curso y los del día siguiente, los demás que aparezcan por rango de fechas a
// seleccionar».
//
// Y es lo que pide el uso: esta pantalla la mira recepción con un rango de MESES —para
// ver qué falta comprar— así que la lista de comprobantes salía con decenas de archivos
// de enero cuando el guía busca el de mañana. El guía no filtra: abre y enseña.
//
// EL RANGO POR DEFECTO NO PIDE NADA A LA RED. Se filtra la lista que la pantalla ya
// trajo, que es lo que hace que esto siga funcionando en el puesto del parque sin señal.
// Solo cuando alguien pide OTRAS fechas se va al servidor, y eso es una acción de
// oficina, con internet.
function rangoTiquetesPorDefecto() {
  const hoy = hoyISO();
  return { desde: hoy, hasta: shiftDate(hoy, 1) };
}

function tiquetesHoyManana(lista) {
  const r = rangoTiquetesPorDefecto();
  return (lista || []).filter(t => t.fecha >= r.desde && t.fecha <= r.hasta);
}

function detalleTiquetes() {
  const panel = document.getElementById("sinac-detalle");
  if (window._sinacAbierto === "TIQUETES") {
    window._sinacAbierto = null;
    panel.innerHTML = "";
    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._sinacAbierto = "TIQUETES";
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");
  window._tqRango = rangoTiquetesPorDefecto();
  pintarTiquetes();
}

// Los comprobantes que ya están en memoria dentro del rango pedido.
function tiquetesDelRango() {
  const r = window._tqRango || rangoTiquetesPorDefecto();
  return (window._sinacTiquetes || [])
    .filter(t => t.fecha >= r.desde && t.fecha <= r.hasta);
}

async function cargarTiquetesDelRango() {
  const r = window._tqRango || rangoTiquetesPorDefecto();
  // Si el rango pedido cae DENTRO de lo que la pantalla ya trajo, no se pide nada: se
  // filtra lo que hay. Así mirar «la semana que viene» funciona igual sin señal.
  if (r.desde >= FILTROS.sinac.desde && r.hasta <= FILTROS.sinac.hasta) {
    pintarTiquetes();
    return;
  }
  pintarTiquetes("buscando");
  try {
    const res = await fetchAuth(
      `${API}/api/tiquetes-sinac?desde=${r.desde}&hasta=${r.hasta}`);
    const d = await res.json();
    // Se MEZCLAN por id, no se reemplazan: los de hoy y mañana ya están descargados en
    // este teléfono y tirarlos obligaría a volver a bajarlos para enseñarlos.
    const porId = {};
    for (const t of (window._sinacTiquetes || []).concat(d.tiquetes || [])) porId[t.id] = t;
    window._sinacTiquetes = Object.values(porId);
    pintarTiquetes();
  } catch (e) {
    pintarTiquetes(String(e.message || e));
  }
}

function verTiquetesDeOtrasFechas() {
  const desde = document.getElementById("tq-desde").value;
  const hasta = document.getElementById("tq-hasta").value;
  if (!desde || !hasta) return;
  window._tqRango = { desde, hasta: hasta < desde ? desde : hasta };
  cargarTiquetesDelRango();
}

function tiquetesVolverAHoy() {
  window._tqRango = rangoTiquetesPorDefecto();
  pintarTiquetes();
}

function pintarTiquetes(aviso) {
  const panel = document.getElementById("sinac-detalle");
  if (!panel) return;
  const r = window._tqRango || rangoTiquetesPorDefecto();
  const porDefecto = r.desde === rangoTiquetesPorDefecto().desde
                  && r.hasta === rangoTiquetesPorDefecto().hasta;
  const lista = tiquetesDelRango();
  const puede = window._sinacPuedeSubir;
  // Agrupados por día: es como se usan. El guía busca «lo de mañana», no un archivo.
  const porDia = {};
  lista.forEach(t => (porDia[t.fecha] = porDia[t.fecha] || []).push(t));
  const dias = Object.keys(porDia).sort();

  panel.innerHTML = `
    <div class="detail-panel">
      <p style="font-weight:600;margin:0 0 4px;">
        Tiquets adquiridos — ${lista.length} comprobante(s)
        ${porDefecto ? "de hoy y mañana"
                     : `entre ${escaparHTML(r.desde)} y ${escaparHTML(r.hasta)}`}</p>
      <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">
        Se abren para enseñarlos en el puesto del parque. Al abrir esta pantalla con señal
        quedan guardados en este teléfono y se ven igual sin internet.
      </p>
      <div class="filterbar" style="margin-bottom:10px;">
        <button class="btn${porDefecto ? " btn-primary" : ""}" onclick="tiquetesVolverAHoy()">Hoy y mañana</button>
        <span style="color:var(--muted);">o buscar otras fechas:</span>
        <input type="date" id="tq-desde" value="${escaparHTML(r.desde)}">
        <input type="date" id="tq-hasta" value="${escaparHTML(r.hasta)}">
        <button class="btn${porDefecto ? "" : " btn-primary"}" onclick="verTiquetesDeOtrasFechas()">Ver</button>
      </div>
      ${aviso === "buscando"
        ? `<p style="font-size:13px;color:var(--muted);margin:0 0 10px;">Buscando…</p>`
        : aviso ? `<p style="font-size:13px;color:var(--danger-text);margin:0 0 10px;">
             No se pudieron traer esos comprobantes. <small>${escaparHTML(aviso)}</small></p>` : ""}
      ${puede ? formularioTiquete() : ""}
      ${dias.length ? dias.map(f => `
        <div style="border-top:1px solid var(--border);padding:8px 0;">
          <p style="margin:0 0 5px;font-weight:600;font-size:13px;">${escaparHTML(f)}${
            f === hoyISO() ? ' <span class="badge badge-hoy">Hoy</span>' : ""}${
            f === shiftDate(hoyISO(), 1) ? ' <span class="badge badge-tour">Mañana</span>' : ""}</p>
          ${porDia[f].map(t => lineaTiquete(t, puede)).join("")}
        </div>`).join("")
      : `<p style="font-size:13px;color:var(--muted);margin:10px 0 0;">
           ${porDefecto ? "No hay comprobantes subidos para hoy ni para mañana."
                        : "No hay comprobantes subidos en esas fechas."}
           ${puede ? "Subí el que manda el SINAC al comprar la entrada." : ""}</p>`}
    </div>`;
}

function lineaTiquete(t, puede) {
  const titulo = t.titulo || `${t.tour_codigo || "Entrada"} ${t.fecha}`;
  const esPdf = t.tipo === "application/pdf";
  return `
    <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:4px 0;">
      <span style="flex:1 1 180px;font-size:13px;">
        ${esPdf ? "📄" : "🖼"} ${escaparHTML(titulo)}
        ${t.tour_codigo ? ` <span class="badge badge-tour">${escaparHTML(t.tour_codigo)}</span>` : ""}
        ${t.conf_entrada ? `<span style="color:var(--muted);font-size:11.5px;"> · conf. ${escaparHTML(t.conf_entrada)}</span>` : ""}
        ${t.pax ? `<span style="color:var(--muted);font-size:11.5px;"> · ${t.pax} entradas</span>` : ""}
        <br><span style="color:var(--muted);font-size:11px;">
          ${t.subido_por ? `subido por ${escaparHTML(t.subido_por)}` : "subido"}
          ${t.subido_en ? ` · ${escaparHTML(String(t.subido_en).slice(0, 16))}` : ""}
        </span>
      </span>
      <button class="btn btn-primary" style="font-size:12px;" onclick="verTiquete(${t.id})">🎟 Ver</button>
      ${puede ? `<button class="btn" style="font-size:12px;" onclick="quitarTiquete(${t.id})" title="Borrar el comprobante">🗑</button>` : ""}
    </div>`;
}

// El formulario de recepción. La lista de entradas del rango va en un desplegable para
// que no haya que copiar a mano la fecha, el tour y el número de confirmación: elegir la
// entrada los rellena los tres, que es donde se equivoca uno al teclear.
function formularioTiquete() {
  const rows = window._sinacRows || [];
  return `
    <div style="background:var(--card);border:1px solid var(--border);border-radius:var(--r-sm);padding:10px;margin-bottom:10px;">
      <p style="margin:0 0 8px;font-size:12.5px;font-weight:600;">Subir un comprobante</p>
      <div class="filterbar" style="margin-bottom:8px;">
        ¿De cuál entrada?
        <select id="tq-entrada" onchange="tiqueteEligeEntrada()" style="max-width:340px;">
          <option value="">Todo un día (sin tour concreto)</option>
          ${rows.map((e, i) => `<option value="${i}">${escaparHTML(e.fecha)} · ${escaparHTML(e.tour_codigo || "")}${e.conf_entrada ? ` · conf. ${escaparHTML(e.conf_entrada)}` : ""} · ${e.pax_total_grupo} pax</option>`).join("")}
        </select>
        Día del tour <input type="date" id="tq-fecha" value="${escaparHTML(FILTROS.sinac.desde)}">
      </div>
      <div class="filterbar">
        <input type="text" id="tq-titulo" placeholder="Nombre para reconocerlo (opcional)" style="flex:1 1 220px;">
        <input type="file" id="tq-archivo" accept="image/*,application/pdf" multiple>
        <button class="btn btn-primary" onclick="subirTiquete()">Subir</button>
      </div>
      <p style="font-size:11.5px;color:var(--muted);margin:6px 0 0;">
        Sirve el PDF que manda el SINAC, o una foto del comprobante. Se pueden elegir
        varios archivos a la vez; todos quedan en el día que diga la casilla.
      </p>
    </div>`;
}

function tiqueteEligeEntrada() {
  const sel = document.getElementById("tq-entrada");
  const e = (window._sinacRows || [])[Number(sel.value)];
  if (!e) return;
  document.getElementById("tq-fecha").value = e.fecha;
}

async function subirTiquete() {
  const sel = document.getElementById("tq-entrada");
  const e = (window._sinacRows || [])[Number(sel.value)];
  const fecha = document.getElementById("tq-fecha").value;
  const titulo = document.getElementById("tq-titulo").value.trim();
  const archivos = document.getElementById("tq-archivo").files;
  if (!fecha) { avisar("Falta el día del tour que cubre el tiquete", true); return; }
  if (!archivos || !archivos.length) { avisar("Elegí el archivo del comprobante", true); return; }

  let subidos = 0;
  for (const archivo of archivos) {
    const cuerpo = new FormData();
    cuerpo.append("fecha", fecha);
    // Lo del desplegable solo se manda si la fecha SIGUE siendo la de esa entrada: si
    // recepción eligió una entrada y después cambió el día a mano, mandar el tour y el
    // número de la otra pegaría el comprobante a una fila que no es.
    if (e && e.fecha === fecha) {
      if (e.tour_codigo) cuerpo.append("tour_codigo", e.tour_codigo);
      if (e.conf_entrada) cuerpo.append("conf_entrada", e.conf_entrada);
      if (e.pax_total_grupo) cuerpo.append("pax", e.pax_total_grupo);
    }
    if (titulo) cuerpo.append("titulo", archivos.length > 1 ? `${titulo} · ${archivo.name}` : titulo);
    cuerpo.append("archivo", archivo, archivo.name);
    const res = await fetchAuth(`${API}/api/tiquetes-sinac`, { method: "POST", body: cuerpo });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      avisar(err.detail || `No se pudo subir ${archivo.name}`, true);
      break;
    }
    subidos++;
  }
  if (!subidos) return;
  avisar(subidos === 1 ? "Tiquete guardado" : `${subidos} tiquetes guardados`);
  await recargarConTiquetesAbiertos(fecha);
}

// Se recarga la pantalla entera y se vuelve a abrir el panel: así el comprobante recién
// subido aparece en su día y la marca 🎟 sale en la fila que le toca, sin que recepción
// tenga que volver a buscar el botón.
//
// Y SE ABRE EN EL DÍA DEL COMPROBANTE, no en hoy y mañana. Recepción compra con semanas
// de antelación: si al subir el de enero el panel volviera a hoy, el archivo acabaría de
// guardarse y no se vería por ninguna parte — que es exactamente como se vuelve a subir
// dos veces lo mismo.
async function recargarConTiquetesAbiertos(fecha) {
  await loadEntradas();
  window._sinacAbierto = "TIQUETES";
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  const tarjeta = document.getElementById("tarjeta-tiquetes");
  if (tarjeta) tarjeta.classList.add("selected");
  const r = rangoTiquetesPorDefecto();
  window._tqRango = (fecha && (fecha < r.desde || fecha > r.hasta))
    ? { desde: fecha, hasta: fecha } : r;
  await cargarTiquetesDelRango();
}

async function quitarTiquete(id) {
  if (!confirm("¿Borrar este comprobante? No se puede deshacer.")) return;
  // La fecha se guarda ANTES de borrar: después la fila ya no está y el panel no sabría
  // a qué día volver.
  const fecha = ((window._sinacTiquetes || []).find(x => x.id === id) || {}).fecha;
  const res = await fetchAuth(`${API}/api/tiquetes-sinac/${id}`, { method: "DELETE" });
  if (!res.ok) {
    const e = await res.json().catch(() => ({}));
    avisar(e.detail || "No se pudo borrar", true);
    return;
  }
  avisar("Comprobante borrado");
  await recargarConTiquetesAbiertos(fecha);
}

// El archivo se pide con la sesión puesta, no con <img src> ni <iframe src>: una
// dirección que se abra sola serviría el comprobante a quien tenga el enlace.
async function verTiquete(id) {
  const t = (window._sinacTiquetes || []).find(x => x.id === id) || {};
  const titulo = t.titulo || `Tiquete ${t.tour_codigo || ""} ${t.fecha || ""}`.trim();
  const modal = document.createElement("div");
  modal.className = "modal-fondo";
  modal.onclick = (ev) => { if (ev.target === modal) cerrarTiquete(modal); };
  modal.innerHTML = `
    <div class="modal-caja" style="max-width:980px;">
      <button class="modal-cerrar" onclick="cerrarTiquete(this.closest('.modal-fondo'))">×</button>
      <p style="font-weight:600;font-size:17px;margin:0;">${escaparHTML(titulo)}</p>
      <p style="font-size:13px;color:var(--muted);margin:2px 0 10px;">
        ${escaparHTML(t.fecha || "")}${t.conf_entrada ? ` · conf. ${escaparHTML(t.conf_entrada)}` : ""}${t.pax ? ` · ${t.pax} entradas` : ""}
      </p>
      <div id="tq-vista" style="text-align:center;min-height:120px;">
        <p class="empty" style="padding:30px 0;">Abriendo el tiquete…</p>
      </div>
    </div>`;
  document.body.appendChild(modal);
  try {
    const res = await fetchAuth(`${API}/api/tiquetes-sinac/${id}/archivo`);
    if (!res.ok) throw new Error((await res.json().catch(() => ({}))).detail || res.status);
    const blob = await res.blob();
    const url = URL.createObjectURL(blob);
    modal._url = url;
    // El PDF va en un marco. Agrandarlo se hace DENTRO de la app y no con
    // window.open(blob:…): en Android eso se lo pasa al gestor de descargas y el
    // comprobante acaba en la carpeta de Descargas del teléfono, que es justo lo que el
    // lodge pidió evitar. El visor del sistema queda como último recurso, dicho con todas
    // las letras, porque en iPhone el marco a veces sale en blanco y sin esa salida el
    // guía se queda sin poder enseñar nada.
    modal.querySelector("#tq-vista").innerHTML = (blob.type === "application/pdf")
      ? `<iframe id="tq-marco" src="${url}" style="width:100%;height:68vh;border:1px solid var(--border);border-radius:var(--r-sm);"></iframe>
         <p style="margin:8px 0 0;display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
           <button class="btn" onclick="tiqueteAPantallaCompleta(this)">Agrandar</button>
           <span style="font-size:11.5px;color:var(--muted);">
             ¿sale en blanco? <a href="#" onclick="abrirTiqueteFuera('${url}');return false;"
             >ábrelo con el visor del teléfono</a> — ojo, así algunos teléfonos lo guardan
             en Descargas.</span></p>`
      : `<img class="solo-ver" draggable="false" src="${url}" alt=""
              style="max-width:100%;border-radius:var(--r-sm);">`;
  } catch (e) {
    modal.querySelector("#tq-vista").innerHTML =
      `<p class="empty" style="padding:24px 0;">No se pudo abrir el tiquete.
        <small>${escaparHTML(String(e.message || e))}<br>
        Sin señal solo se ven los comprobantes que ya se habían descargado. Los de los
        próximos tres días se descargan solos al abrir la pantalla de SINAC en el
        lodge.</small></p>`;
  }
}

// Agrandar DENTRO de la app: el mismo marco ocupando la pantalla. No abre nada fuera, así
// que no hay forma de que el comprobante caiga en la carpeta de Descargas.
function tiqueteAPantallaCompleta(boton) {
  const caja = boton.closest(".modal-caja");
  const marco = caja.querySelector("#tq-marco");
  const grande = marco.style.height !== "88vh";
  marco.style.height = grande ? "88vh" : "68vh";
  caja.style.maxWidth = grande ? "100%" : "980px";
  boton.textContent = grande ? "Reducir" : "Agrandar";
}

function abrirTiqueteFuera(url) {
  window.open(url, "_blank");
}

function cerrarTiquete(modal) {
  if (modal._url) URL.revokeObjectURL(modal._url);
  modal.remove();
}

// LO QUE HACE QUE ESTO SIRVA EN EL PARQUE. Se piden los archivos una vez, en silencio,
// mientras hay señal; el programa de servicio los guarda y después los sirve del
// teléfono. Igual que con los pasaportes, y por la misma razón.
//
// SOLO LOS DE LOS PRÓXIMOS DÍAS. El rango de esta pantalla son meses —recepción mira qué
// falta comprar— y bajar cincuenta PDF con el internet del lodge para que el guía use
// uno sería gastar la mañana. Lo que hace falta llevar al muelle es lo de hoy y lo de
// pasado mañana.
async function precargarTiquetes(lista) {
  // hoyISO() y shiftDate(), no toISOString() sobre la hora actual: eso da la fecha en
  // UTC, y el lodge va seis horas por detrás. Después de las 6 de la tarde el «hoy» de
  // UTC ya es mañana, y la precarga se saltaría justo los tiquetes del día siguiente —
  // los que el guía necesita— la tarde en que se preparan.
  const desde = hoyISO();
  const tope = shiftDate(desde, 3);
  for (const t of (lista || [])) {
    if (t.fecha < desde || t.fecha > tope) continue;
    try {
      const res = await fetchAuth(`${API}/api/tiquetes-sinac/${t.id}/archivo`);
      if (res.ok) await res.blob();
    } catch (e) { /* sin señal: ya habrá otra vuelta con red */ }
  }
}

async function marcarEntrada(id) {
  await fetchAuth(`${API}/api/entradas-sinac/${id}/marcar?estado=COMPRADA`, { method: "POST" });
  avisar("Entrada marcada como comprada");
  loadEntradas();
}

// ---------- ANALITICA ----------
// ---------- AMENIDADES / TAREAS ----------
// Mismo manejo de fechas que Agenda y Transporte: abre en el día de hoy y desde ahí
// se puede mover de día o pasar a un rango. `fecha` nula significa "ver rango".
async function loadAmenidades(fecha, desdeNuevo, hastaNuevo, estadoNuevo) {
  setActive(5);
  const F = FILTROS.amenidades;
  if (fecha) { F.fecha = fecha; F.modo = "dia"; }
  if (desdeNuevo) F.desde = desdeNuevo;
  if (hastaNuevo) F.hasta = hastaNuevo;
  if (fecha === null) F.modo = "rango";
  if (fecha === undefined) fecha = F.modo === "dia" ? F.fecha : null;
  // El servidor filtra por la fecha de llegada del huésped, que es cuando hay que
  // tener la amenidad lista: en vista de día son las de quien entra ese día.
  const desde = fecha || F.desde, hasta = fecha || F.hasta;
  const estado = estadoNuevo !== undefined ? estadoNuevo : (window._amenEstado || "");
  window._amenEstado = estado;

  const qs = new URLSearchParams({ desde, hasta });
  if (estado) qs.append("estado", estado);
  const rows = await (await fetchAuth(`${API}/api/amenidades?${qs}`)).json();
  // Se guardan para poder abrir el editor de la descripción con los valores actuales sin
  // volver a pedirlos, y para poder cancelar y dejar la celda como estaba.
  window._amenidades = rows;
  // El estado de los avisos se guarda para no pedirlo en cada refresco (esta pantalla se
  // vuelve a dibujar cada pocos segundos), pero SOLO cuando ya están funcionando.
  //
  // Mientras estén apagados se vuelve a preguntar cada vez, y esa es la parte importante:
  // el día que se pongan las llaves en el servidor, la pantalla lo nota sola. Antes se
  // guardaba también el "no configurado", así que quien tuviera la app abierta seguiría
  // viendo ese aviso para siempre —hasta recargar la página entera— sin entender por qué.
  if (!_avisosEstado || !_avisosEstado.activo) await cargarEstadoAvisos();
  await cargarDepartamentos();
  const pend = rows.filter(a => a.estado === "PENDIENTE").length;
  const hechas = rows.filter(a => a.estado === "HECHA").length;

  // Agrupar por área responsable, que es como trabaja el staff.
  //
  // Un requerimiento de VARIOS departamentos aparece en el grupo de CADA UNO, con el
  // estado de ese departamento. Antes, al no poder asignar varios, esto se resolvía con
  // nombres compuestos ("Gerencia/Recepción") que creaban un grupo propio: la tarea no
  // le salía en la lista a ninguna de las dos áreas.
  const porArea = {};
  rows.forEach(a => {
    const areas = (a.areas && a.areas.length)
      ? a.areas
      : [{ area: a.area_responsable, estado: a.estado }];
    areas.forEach(x => {
      (porArea[x.area] = porArea[x.area] || []).push({ ...a, _area: x.area, _estado: x.estado });
    });
  });
  // Los departamentos en orden alfabético: con varios en juego, un orden estable es lo
  // que permite buscar el suyo sin leer todos.
  const areasOrdenadas = Object.keys(porArea).sort((a, b) => a.localeCompare(b, "es"));

  document.getElementById("app").innerHTML = `
    <div class="card">
      <div class="header">
        <p class="title">Amenidades y tareas ${fecha ? etiquetaFecha(fecha) : ""}</p>
        <div class="filterbar">
          <button class="btn" onclick="loadAmenidades(shiftDate('${fecha || F.fecha}',-1))">‹ Día ant.</button>
          <input type="date" value="${fecha || ""}" onchange="loadAmenidades(this.value)">
          <button class="btn" onclick="loadAmenidades(shiftDate('${fecha || F.fecha}',1))">Día sig. ›</button>
          <button class="btn" onclick="loadAmenidades(hoyISO())">Hoy</button>
          <button class="btn" onclick="loadAmenidades(masDiasISO(1))">Mañana</button>
          <span style="color:var(--muted);">o rango:</span>
          <input type="date" id="am-desde" value="${F.desde}">
          <input type="date" id="am-hasta" value="${F.hasta}">
          <button class="btn" onclick="loadAmenidades(null, document.getElementById('am-desde').value, document.getElementById('am-hasta').value)">Ver rango</button>
          <select id="am-estado" onchange="loadAmenidades(undefined, undefined, undefined, this.value)">
            <option value="" ${estado===""?"selected":""}>Todas</option>
            <option value="PENDIENTE" ${estado==="PENDIENTE"?"selected":""}>Solo pendientes</option>
            <option value="HECHA" ${estado==="HECHA"?"selected":""}>Solo hechas</option>
          </select>
          <button class="btn" onclick="descargar('amenidades', {desde:'${desde}', hasta:'${hasta}'}, 'xlsx')">⬇ Excel</button>
          <button class="btn" onclick="descargar('amenidades', {desde:'${desde}', hasta:'${hasta}'}, 'pdf')">⬇ PDF</button>
          ${puedeEscribir("amenidades") ? `<button class="btn btn-primary" onclick="mostrarFormAmenidad()">+ Agregar requerimiento</button>` : ""}
        </div>
      </div>
      <div id="form-amenidad"></div>
      ${panelAvisos()}
      <!-- Se dice adónde se fueron. Quien las buscaba aquí tiene que poder encontrarlas
           sin preguntar: una pantalla que deja de mostrar algo sin explicarlo se lee
           como que el dato se perdió. -->
      <p style="font-size:12px;color:var(--muted);margin:6px 0 10px;">
        Las restricciones alimentarias y alergias no salen en esta hoja: aquí van las
        tareas que hay que <strong>preparar</strong>. Se ven en
        <a href="#" onclick="loadRestaurantes(); return false;" style="color:var(--forest);">Restaurantes → Alergias</a>,
        que es donde cocina las mira antes de servir.
      </p>
      <div class="stats" style="grid-template-columns:repeat(3,1fr);">
        <div class="stat" style="cursor:default;"><p class="stat-label">Total</p><p class="stat-value">${rows.length}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Pendientes</p><p class="stat-value" style="color:var(--warn-text);">${pend}</p></div>
        <div class="stat" style="cursor:default;"><p class="stat-label">Hechas</p><p class="stat-value" style="color:var(--ok-text);">${hechas}</p></div>
      </div>
      <p class="subtitle" style="margin-bottom:12px;">Se muestran según el día en que hay que tenerlas listas: el de la columna «Para el día», o el de llegada del huésped si no se le puso uno.</p>
      ${rows.length ? areasOrdenadas.map(area => `
        <p style="font-weight:600;font-size:14px;margin:16px 0 6px;color:var(--forest);">${escaparHTML(area)} (${porArea[area].length})</p>
        <table>
          <tr><th>Llegada</th><th>Hab.</th><th>Huésped</th><th>Amenidad</th><th>Para el día</th><th>Tarea</th><th>Estado</th>${puedeEscribir("amenidades")?"<th></th>":""}</tr>
          ${porArea[area].map(a => `
            <tr class="${a._estado === 'HECHA' ? 'fila-salio' : ''}">
              <td>${a.arr_date}</td>
              <td>${a.room_no}${etiquetaGrupo(a.conf_no)}</td>
              <td>${a.nombre_principal}</td>
              <td><span class="badge badge-tour">${a.amenidad}</span>${a.origen === 'MANUAL' ? ' <span style="font-size:10px;color:var(--muted);">(manual)</span>' : ''}</td>
              <td>${celdaFechaAmenidad(a)}</td>
              <td style="font-size:12px;color:var(--muted);" id="am-txt-${a.id}">${celdaTextoAmenidad(a)}</td>
              <td><span class="badge ${a._estado === 'HECHA' ? 'badge-ok' : 'badge-warn'}">${a._estado}</span>${otrosDepartamentos(a)}</td>
              ${puedeEscribir("amenidades") ? `<td><button class="btn" onclick="marcarAmenidad(${a.id}, '${a._estado === 'HECHA' ? 'PENDIENTE' : 'HECHA'}', ${JSON.stringify(a._area).replace(/"/g, "&quot;")})">${a._estado === 'HECHA' ? 'Reabrir' : 'Marcar hecha'}</button><button class="btn" onclick="editarAreasAmenidad(${a.id})" title="Cambiar los departamentos" style="font-size:10px;padding:1px 5px;">Deptos.</button>${a.origen === 'MANUAL' ? `<button class="btn" onclick="eliminarAmenidad(${a.id})">Eliminar</button>` : ''}</td>` : ""}
            </tr>`).join("")}
        </table>`).join("") : `<p class="empty">No hay amenidades en estas fechas.<small>Se detectan al importar el PDF, y puedes agregar requerimientos a mano con el botón de arriba.</small></p>`}
    </div>
  `;
}

/* ---------- Los departamentos de un requerimiento ----------
 *
 * Antes era un selector de UNO solo, y por eso el catálogo llegó a tener nombres
 * compuestos como "Gerencia/Recepción": la necesidad de asignar varios ya existía y se
 * resolvía inventando etiquetas. El problema de esas etiquetas es que la tarea quedaba
 * en un grupo propio, así que ninguna de las dos áreas la veía en su lista.
 *
 * Ahora son casillas —se marcan varias— y hay un campo para escribir uno que no esté.
 * El que se escriba queda disponible para todos la próxima vez, porque la lista se arma
 * con los de siempre MÁS los que ya estén en uso en la base.
 */
let _departamentos = null;

async function cargarDepartamentos() {
  if (_departamentos) return _departamentos;
  try {
    const res = await fetchAuth(`${API}/api/amenidades/departamentos`);
    _departamentos = res.ok ? (await res.json()).departamentos : [];
  } catch (e) {
    _departamentos = [];
  }
  return _departamentos;
}

function casillasDepartamentos(prefijo, marcados) {
  const puestos = (marcados || []).map(x => String(x).toLowerCase());
  // Un departamento que ya tenía este requerimiento pero que no está en la lista general
  // se agrega igual: si no, editar los departamentos lo borraría sin que nadie lo note.
  const lista = (_departamentos || []).slice();
  (marcados || []).forEach(m => {
    if (!lista.some(x => x.toLowerCase() === String(m).toLowerCase())) lista.push(m);
  });
  return `
    <div style="display:flex;flex-wrap:wrap;gap:4px 14px;">
      ${lista.map((a, i) => `
        <label style="font-size:12px;white-space:nowrap;">
          <input type="checkbox" class="${prefijo}-area" value="${escaparHTML(a)}"
            ${puestos.includes(a.toLowerCase()) ? "checked" : ""}> ${escaparHTML(a)}
        </label>`).join("")}
    </div>
    <div class="filterbar" style="margin-top:6px;">
      <input type="text" id="${prefijo}-area-nueva" placeholder="Otro departamento…"
        style="width:190px;font-size:12px;"
        onkeydown="if(event.key==='Enter'){event.preventDefault();agregarDepartamento('${prefijo}');}">
      <button class="btn" onclick="agregarDepartamento('${prefijo}')"
        style="font-size:11px;padding:2px 8px;">+ Agregar</button>
    </div>`;
}

function departamentosMarcados(prefijo) {
  return Array.from(document.querySelectorAll(`.${prefijo}-area:checked`))
    .map(c => c.value);
}

function agregarDepartamento(prefijo) {
  const campo = document.getElementById(`${prefijo}-area-nueva`);
  const nombre = (campo.value || "").trim().replace(/\s+/g, " ").slice(0, 60);
  if (!nombre) return;
  if ((_departamentos || []).some(x => x.toLowerCase() === nombre.toLowerCase())) {
    // Ya existe: en vez de duplicarlo, se marca el que hay. Si no, aparecerían dos
    // casillas iguales y una tarea repartida entre las dos.
    document.querySelectorAll(`.${prefijo}-area`).forEach(c => {
      if (c.value.toLowerCase() === nombre.toLowerCase()) c.checked = true;
    });
    campo.value = "";
    avisar(`${nombre} ya estaba en la lista: quedó marcado`);
    return;
  }
  const marcados = departamentosMarcados(prefijo).concat([nombre]);
  _departamentos = (_departamentos || []).concat([nombre]);
  document.getElementById(`${prefijo}-areas`).innerHTML =
    casillasDepartamentos(prefijo, marcados);
}

async function crearAmenidad() {
  const payload = {
    conf_no: document.getElementById("na-conf").value.trim(),
    amenidad: document.getElementById("na-tipo").value,
    detalle: document.getElementById("na-detalle").value.trim(),
    areas: departamentosMarcados("na"),
  };
  const error = document.getElementById("na-error");
  if (!payload.conf_no) { error.textContent = "Indica el número de reserva."; return; }
  if (!payload.areas.length) {
    error.textContent = ("Marca al menos un departamento: un requerimiento sin "
                       + "departamento no le aparece a nadie.");
    return;
  }
  payload.tarea = payload.detalle || payload.amenidad;
  // Solo se manda la fecha si la escribieron. Si no viene el campo, el servidor aplica
  // su regla: día de llegada, o sin día si es cena privada.
  const fechaElegida = document.getElementById("na-fecha").value;
  if (fechaElegida) payload.fecha = fechaElegida;
  const res = await fetchAuth(`${API}/api/amenidades`, {
    method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(payload),
  });
  if (!res.ok) { document.getElementById("na-error").textContent = (await res.json()).detail; return; }
  loadAmenidades();
}

// ---------- Avisos al celular ----------
// Activar esto tiene varios pasos que pueden fallar por separado: el navegador tiene que
// soportarlo, la persona tiene que dar permiso, el servidor tiene que tener las llaves,
// y en iPhone la app tiene que estar en la pantalla de inicio. Por eso cada paso avisa
// exactamente qué falta, en vez de un "no se pudo activar" que no dice nada.
let _avisosEstado = null;

function avisosSoportados() {
  return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;
}

// ¿Está la app instalada en la pantalla de inicio? En iPhone es la condición para que
// Apple entregue avisos; en Android no hace falta. Se reutiliza la comprobación que ya
// usa el aviso de instalación, para que no se separen.
const appInstalada = estaInstalada;

function esIOS() {
  return /iPad|iPhone|iPod/.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
}

// La llave pública viene en base64 de URL y el navegador la pide en bytes.
function bytesDeBase64Url(b64) {
  const relleno = "=".repeat((4 - (b64.length % 4)) % 4);
  const normal = (b64 + relleno).replace(/-/g, "+").replace(/_/g, "/");
  const crudo = atob(normal);
  return Uint8Array.from([...crudo].map(c => c.charCodeAt(0)));
}

function nombreDeAparato() {
  const ua = navigator.userAgent;
  const sistema = /iPhone|iPad/.test(ua) ? "iPhone/iPad"
    : /Android/.test(ua) ? "Android"
    : /Mac/.test(ua) ? "Mac" : /Windows/.test(ua) ? "Windows" : "Otro";
  return `${sistema}${appInstalada() ? " (app instalada)" : " (navegador)"}`;
}

async function cargarEstadoAvisos() {
  try {
    _avisosEstado = await (await fetchAuth(`${API}/api/avisos/estado`)).json();
  } catch (e) { _avisosEstado = null; }
  return _avisosEstado;
}

async function activarAvisos() {
  const est = _avisosEstado || await cargarEstadoAvisos();
  if (!est || !est.activo) {
    avisar(est?.motivo || "Los avisos no están configurados en el servidor.", true);
    return;
  }
  if (!avisosSoportados()) {
    avisar("Este navegador no puede recibir avisos.", true);
    return;
  }
  if (!direccionSirveParaAvisos()) {
    avisar("Desde esta dirección no se puede: hace falta abrir el sistema por su "
         + "dirección de internet (https).", true);
    return;
  }
  // El caso que más va a pasar, y el que más confunde si no se explica.
  if (esIOS() && !appInstalada()) {
    avisar("En iPhone hay que agregar la app a la pantalla de inicio primero", true);
    return;
  }
  const permiso = await Notification.requestPermission();
  if (permiso !== "granted") {
    avisar("No diste permiso para los avisos. Se puede cambiar en los ajustes del navegador.", true);
    return;
  }
  try {
    const reg = await navigator.serviceWorker.ready;

    // Si este navegador ya tenía una suscripción, se cancela antes de crear la nueva.
    // Hace falta de verdad: el navegador ata la suscripción a la llave del servidor, y
    // si las llaves cambiaron —o quedó una de una prueba anterior— se niega a crear otra
    // con un error que habla de 'applicationServerKey' y no dice qué hacer. Cancelar y
    // volver a suscribir es lo que lo resuelve, y es lo que va a pasar en el hotel el día
    // que se regeneren las llaves.
    const previa = await reg.pushManager.getSubscription();
    if (previa) {
      try {
        await fetchAuth(`${API}/api/avisos/baja`, {
          method: "POST", headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ endpoint: previa.endpoint }),
        });
      } catch (e) { /* si la de antes no estaba en el servidor, da igual */ }
      await previa.unsubscribe();
    }

    const suscripcion = await reg.pushManager.subscribe({
      userVisibleOnly: true,
      applicationServerKey: bytesDeBase64Url(est.clave_publica),
    });
    const res = await fetchAuth(`${API}/api/avisos/suscribir`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ suscripcion: suscripcion.toJSON(), aparato: nombreDeAparato() }),
    });
    if (!res.ok) { avisar((await res.json()).detail, true); return; }
    avisar("Avisos activados en este aparato");
    await cargarEstadoAvisos();
    loadAmenidades();
  } catch (e) {
    // Los mensajes del navegador son técnicos y en inglés. Se traducen los que se
    // repiten, para que la persona sepa qué hacer en vez de leer un error de programador.
    const t = String(e && e.message || e);
    let claro = t;
    if (/applicationServerKey|different|already exists/i.test(t)) {
      claro = "Este navegador tenía una activación anterior. Recarga la página (Ctrl+F5) y vuelve a intentarlo.";
    } else if (/permission|denied|NotAllowed/i.test(t)) {
      claro = "El navegador tiene bloqueados los avisos para este sitio. Se cambia en el candado de la barra de direcciones.";
    } else if (/push service|AbortError|registration/i.test(t)) {
      claro = "El navegador no pudo contactar su servicio de avisos. Revisa la conexión y vuelve a intentarlo.";
    }
    avisar(`No se pudo activar: ${claro}`, true);
  }
}

async function desactivarAvisos() {
  try {
    const reg = await navigator.serviceWorker.ready;
    const s = await reg.pushManager.getSubscription();
    if (s) {
      await fetchAuth(`${API}/api/avisos/baja`, {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ endpoint: s.endpoint }),
      });
      await s.unsubscribe();
    }
    avisar("Avisos desactivados en este aparato");
    await cargarEstadoAvisos();
    loadAmenidades();
  } catch (e) { avisar(`No se pudo desactivar: ${e.message}`, true); }
}

async function probarAviso() {
  const res = await fetchAuth(`${API}/api/avisos/prueba`, { method: "POST" });
  if (!res.ok) { avisar((await res.json()).detail, true); return; }
  avisar("Aviso de prueba enviado — debería llegarte en un momento");
}

// ¿Esta dirección puede recibir avisos? El navegador exige conexión segura para dar
// notificaciones: solo funciona en https, o en localhost (la propia computadora).
//
// ESTO ES LO QUE MÁS CONFUNDE, y hay que decirlo: abriendo el sistema desde el teléfono
// con la dirección de esta computadora (192.168.x.x:8000) el navegador NO registra nada
// y el botón de activar no puede funcionar. Para el teléfono hace falta la dirección de
// internet del hotel. Antes la pantalla no lo decía y parecía que el botón estaba roto.
function direccionSirveParaAvisos() {
  return window.isSecureContext === true
      || location.hostname === "localhost" || location.hostname === "127.0.0.1";
}

function panelAvisos() {
  const est = _avisosEstado;
  if (!est) return "";
  const caja = (color, contenido) =>
    `<div style="background:var(--${color}-bg);color:var(--${color}-text);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 12px;font-size:12.5px;line-height:1.55;">${contenido}</div>`;

  if (!est.activo) {
    return caja("warn", `🔔 <strong>Los avisos al celular no están funcionando.</strong><br>${est.motivo || ""}`);
  }

  // La dirección manda sobre todo lo demás: sin conexión segura no hay nada que activar.
  if (!direccionSirveParaAvisos()) {
    return caja("warn",
      `🔔 <strong>Desde esta dirección el teléfono no puede recibir avisos.</strong><br>
       El navegador solo entrega notificaciones por una conexión segura (https). Estás
       en <code>${location.host}</code>.<br>
       Para que le lleguen a un teléfono hay que abrir el sistema por la dirección de
       internet del hotel. En esta computadora sí se puede probar entrando por
       <code>localhost:8000</code>.`);
  }

  const mios = est.mis_aparatos || [];
  if (!avisosSoportados()) {
    return caja("warn", "🔔 Este navegador no puede recibir avisos. Prueba con Chrome, Edge o Safari.");
  }
  if (mios.length) {
    return caja("ok",
      `🔔 <strong>Avisos activos</strong> en ${mios.length} aparato(s):
       ${mios.map(a => a.aparato || "sin nombre").join(", ")}
       <button class="btn" onclick="probarAviso()" style="margin-left:6px;">Probar</button>
       <button class="btn" onclick="desactivarAvisos()">Desactivar aquí</button>
       <br><span style="opacity:.85;">Llega un aviso cuando entra un requerimiento
       nuevo, y un repaso de lo pendiente cada mañana. Cada persona los activa en su
       propio teléfono: activarlos aquí no los activa en los demás.</span>`);
  }

  // En iPhone Apple no entrega nada a una pestaña de Safari: la app tiene que estar en
  // la pantalla de inicio. Es el paso que nadie adivina, así que se explica cómo.
  if (esIOS() && !appInstalada()) {
    return caja("warn",
      `🔔 <strong>En iPhone hay que agregar la app a la pantalla de inicio.</strong><br>
       Apple no entrega avisos a una pestaña de Safari. En Safari: botón de compartir
       (el cuadro con la flecha) → <strong>Agregar a inicio</strong>. Después abre el
       sistema desde ese icono y vuelve aquí: aparecerá el botón para activarlos.`);
  }

  return caja("warn",
    `🔔 <strong>Avisos al celular</strong>
     <button class="btn btn-primary" onclick="activarAvisos()" style="margin-left:6px;">Activar en este aparato</button>
     <br><span style="opacity:.85;">El navegador va a pedir permiso: hay que aceptarlo.
     Se activa por aparato, así que cada persona lo hace en el suyo.</span>`);
}

// ---------- El día de cada amenidad ----------
// El selector queda acotado a la estadía del huésped, así que no se puede elegir un día
// en que no está. Antes esto solo existía para la cena privada, en la pantalla de
// Restaurantes, y solo permitía asignarle la noche que se estuviera viendo.
//
// Es el MISMO campo que lee la hoja de restaurantes: al ponerle la noche a una cena
// privada aquí, aparece sola en el comedor de esa noche, fija en Bar el Bosque.
function celdaFechaAmenidad(a) {
  if (!puedeEscribir("amenidades")) {
    return a.fecha
      ? `<span style="font-size:12px;">${a.fecha}</span>`
      : `<span style="font-size:11px;color:var(--warn-text);">sin día</span>`;
  }
  const aviso = a.es_cena_privada && !a.fecha
    ? `<br><span style="font-size:10.5px;color:var(--warn-text);">sin noche no llega al comedor</span>`
    : (a.es_cena_privada
        ? `<br><span style="font-size:10.5px;color:var(--muted);">va a Bar el Bosque esa noche</span>`
        : "");
  return `
    <input type="date" value="${a.fecha || ""}"
      min="${a.estadia_desde || ""}" max="${a.estadia_hasta || ""}"
      onchange="guardarFechaAmenidad(${a.id}, this.value)"
      title="Día en que hay que tenerla lista. Solo dentro de la estadía (${a.estadia_desde || "?"} a ${a.estadia_hasta || "?"})."
      style="font-size:11.5px;padding:2px 4px;width:124px;">
    ${a.fecha ? `<button class="btn" title="Quitar el día"
        onclick="guardarFechaAmenidad(${a.id}, '')"
        style="font-size:10px;padding:1px 5px;margin-left:3px;">×</button>` : ""}
    ${aviso}`;
}

/* ---------- La descripción de la amenidad, editable ----------
 *
 * Antes de una amenidad solo se podía cambiar el día. El texto venía del catálogo y no
 * se tocaba, así que cuando el huésped llamaba para decir que la alergia era también a
 * la lactosa, o que la decoración era de aniversario y no de cumpleaños, no había dónde
 * escribirlo: había que agregar un requerimiento nuevo al lado, y quedaban dos filas
 * diciendo cosas distintas de lo mismo.
 *
 * Son dos campos porque son dos cosas distintas, y el área responsable lee la segunda:
 *   · DETALLE — lo particular de este huésped: "sin gluten y sin mariscos"
 *   · TAREA   — la instrucción: "AVISAR A COCINA antes del check-in"
 */
function celdaTextoAmenidad(a) {
  const marca = a.editado_a_mano
    ? ` <span style="font-size:10px;color:var(--muted);" title="Editado a mano. El reporte no lo pisa.">✎</span>`
    : "";
  const texto = `${a.detalle ? `<strong style="color:var(--text);">${escaparHTML(a.detalle)}</strong><br>` : ""}${escaparHTML(a.tarea || "")}${marca}`;
  if (!puedeEscribir("amenidades")) return texto;
  return `${texto}
    <button class="btn" onclick="editarTextoAmenidad(${a.id})" title="Cambiar la descripción"
      style="font-size:10px;padding:1px 5px;margin-left:4px;">Editar</button>`;
}

function editarTextoAmenidad(id) {
  const a = (window._amenidades || []).find(x => x.id === id);
  if (!a) return;
  const celda = document.getElementById(`am-txt-${id}`);
  if (!celda) return;
  celda.innerHTML = `
    <input type="text" id="am-det-${id}" value="${(a.detalle || "").replace(/"/g, "&quot;")}"
      placeholder="Detalle (ej: sin gluten y sin mariscos)"
      style="width:100%;font-size:11.5px;padding:3px 4px;margin-bottom:3px;">
    <input type="text" id="am-tar-${id}" value="${(a.tarea || "").replace(/"/g, "&quot;")}"
      placeholder="Tarea para ${escaparHTML(a.area_responsable || "el área")}"
      style="width:100%;font-size:11.5px;padding:3px 4px;">
    <div style="margin-top:4px;">
      <button class="btn btn-primary" onclick="guardarTextoAmenidad(${id})"
        style="font-size:10px;padding:2px 7px;">Guardar</button>
      <button class="btn" onclick="document.getElementById('am-txt-${id}').innerHTML = celdaTextoAmenidad((window._amenidades||[]).find(x=>x.id===${id}))"
        style="font-size:10px;padding:2px 7px;">Cancelar</button>
    </div>`;
  const primero = document.getElementById(`am-det-${id}`);
  if (primero) primero.focus();
}

async function guardarTextoAmenidad(id) {
  const detalle = document.getElementById(`am-det-${id}`).value.trim();
  const tarea = document.getElementById(`am-tar-${id}`).value.trim();
  const res = await fetchAuth(`${API}/api/amenidades/${id}/texto`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ detalle, tarea }),
  });
  if (!res.ok) {
    avisar((await res.json()).detail || "No se pudo guardar", true);
    return;
  }
  const d = await res.json();
  // El aviso importa: reescribir el texto puede sacar una cena privada de la hoja de
  // restaurantes, y eso hay que verlo ahora y no la noche de la cena.
  if (d.aviso) alert(d.aviso);
  avisar("Descripción actualizada");
  loadAmenidades();
}

async function guardarFechaAmenidad(id, fecha) {
  const res = await fetchAuth(`${API}/api/amenidades/${id}/fecha`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ fecha: fecha || null }),
  });
  if (!res.ok) {
    // El servidor explica qué pasó ("esa fecha es después de que el huésped se vaya"),
    // así que se muestra tal cual en vez de un "error" que no ayuda.
    avisar((await res.json()).detail, true);
    loadAmenidades();
    return;
  }
  const d = await res.json();
  avisar(d.fecha
    ? (d.es_cena_privada ? `Cena privada la noche del ${d.fecha}` : `Para el ${d.fecha}`)
    : "Día quitado");
  loadAmenidades();
}

async function eliminarAmenidad(id) {
  if (!confirm("¿Eliminar este requerimiento?")) return;
  await fetchAuth(`${API}/api/amenidades/${id}`, { method: "DELETE" });
  avisar("Requerimiento eliminado");
  loadAmenidades();
}

async function marcarAmenidad(id, estado, area) {
  const qs = `estado=${estado}` + (area ? `&area=${encodeURIComponent(area)}` : "");
  const res = await fetchAuth(`${API}/api/amenidades/${id}/estado?${qs}`, { method: "POST" });
  if (!res.ok) {
    avisar((await res.json()).detail || "No se pudo cambiar", true);
    loadAmenidades();
    return;
  }
  const d = await res.json();
  // Se dice a quién le falta. Con varios departamentos, "marcada como hecha" a secas
  // haría creer que el requerimiento está cerrado cuando otra área no ha hecho lo suyo.
  if (estado === "HECHA" && (d.pendientes || []).length) {
    avisar(`${area || "Marcada"} listo · falta ${d.pendientes.join(" y ")}`);
  } else {
    avisar(estado === "HECHA" ? "Marcada como hecha" : "Reabierta");
  }
  loadAmenidades();
}

// Mostrar los demás departamentos y cómo va cada uno. Va junto al estado, en la fila del
// área que está mirando, para que nadie asuma que el requerimiento está cerrado porque
// su parte lo está.
function otrosDepartamentos(a) {
  const otros = (a.areas || []).filter(x => x.area !== a._area);
  if (!otros.length) return "";
  return `<br><span style="font-size:10px;color:var(--muted);">también: ${
    otros.map(x => `${escaparHTML(x.area)} ${x.estado === "HECHA" ? "✓" : "·pendiente"}`)
         .join(" / ")}</span>`;
}

async function editarAreasAmenidad(id) {
  await cargarDepartamentos();
  const a = (window._amenidades || []).find(x => x.id === id);
  if (!a) return;
  const puestos = (a.areas || []).map(x => x.area);
  const modal = document.createElement("div");
  modal.className = "modal-fondo";
  modal.id = "modal-deptos";
  modal.onclick = (e) => { if (e.target === modal) modal.remove(); };
  modal.innerHTML = `
    <div class="modal-caja" style="max-width:560px;">
      <button class="modal-cerrar" onclick="this.closest('.modal-fondo').remove()">×</button>
      <p style="font-weight:600;font-size:16px;margin:0;color:var(--forest-dark);">Departamentos del requerimiento</p>
      <p style="font-size:13px;color:var(--muted);margin:2px 0 14px;">
        Hab. ${escaparHTML(a.room_no || "")} · ${escaparHTML(a.nombre_principal || "")}<br>
        <strong>${escaparHTML(a.amenidad || "")}</strong>${a.detalle ? ` — ${escaparHTML(a.detalle)}` : ""}
      </p>
      <div id="ed-areas">${casillasDepartamentos("ed", puestos)}</div>
      <p style="font-size:11.5px;color:var(--muted);margin:10px 0 0;">
        Cada departamento marca su parte por separado. Lo que ya esté hecho no se reabre
        al cambiar esta lista; si quitas un departamento, su marca se va con él.</p>
      <div id="ed-error" style="color:var(--danger-text);font-size:12px;margin-top:6px;"></div>
      <div style="display:flex;justify-content:flex-end;gap:8px;border-top:1px solid var(--border);padding-top:12px;margin-top:14px;">
        <button class="btn" onclick="this.closest('.modal-fondo').remove()">Cancelar</button>
        <button class="btn btn-primary" onclick="guardarAreasAmenidad(${id})">Guardar</button>
      </div>
    </div>`;
  document.body.appendChild(modal);
}

async function guardarAreasAmenidad(id) {
  const areas = departamentosMarcados("ed");
  const error = document.getElementById("ed-error");
  if (!areas.length) {
    error.textContent = ("Tiene que quedar al menos uno: un requerimiento sin "
                       + "departamento no le aparece a nadie.");
    return;
  }
  const res = await fetchAuth(`${API}/api/amenidades/${id}/areas`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ areas }),
  });
  if (!res.ok) { error.textContent = (await res.json()).detail || "No se pudo guardar"; return; }
  const modal = document.getElementById("modal-deptos");
  if (modal) modal.remove();
  avisar(areas.length === 1 ? `Asignado a ${areas[0]}`
                            : `Asignado a ${areas.length} departamentos`);
  loadAmenidades();
}

async function abrirPermisos(userId, username) {
  // Se relee la lista para traer los permisos que el usuario tiene HOY. Antes esta
  // consulta no devolvía permisos_json, así que el editor abría siempre en blanco y
  // al guardar borraba lo que estuviera configurado.
  const usuarios = await (await fetchAuth(`${API}/api/usuarios`)).json();
  const u = usuarios.find(x => x.id === userId) || {};
  const actuales = permisosDe(u);
  const sinConfigurar = !Object.keys(actuales).length;

  const fondo = document.createElement("div");
  fondo.className = "modal-fondo"; fondo.id = "modal-pm";
  fondo.innerHTML = `<div class="modal-caja" style="max-width:760px;">
    <div class="modal-encabezado">
      <div><p class="title">Permisos de ${username}</p>
        <p class="subtitle">Botón por botón: si no entra, si solo mira o si puede modificar</p></div>
      <button class="btn" onclick="document.getElementById('modal-pm').remove()">Cerrar</button>
    </div>
    <div class="modal-cuerpo">
      ${sinConfigurar ? `<div style="background:var(--warn-bg);color:var(--warn-text);border-radius:var(--r-sm);padding:9px 12px;margin:0 0 10px;font-size:12.5px;">
        Este usuario no tiene ninguna pantalla marcada, así que hoy no puede entrar a
        nada. Aplica un perfil o marca las pantallas que necesite.</div>` : ""}
      ${gridPermisos("pm", actuales)}
      <div style="margin-top:14px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
        <button class="btn btn-primary" onclick="guardarPermisos(${userId})">Guardar permisos</button>
      </div>
    </div></div>`;
  document.body.appendChild(fondo);
}

async function guardarPermisos(userId) {
  const permisos = leerPermisos("pm");
  if (!Object.keys(permisos).length &&
      !confirm("No marcaste ninguna pantalla: el usuario quedará SIN ACCESO a nada del sistema. ¿Continuar?")) {
    return;
  }
  await fetchAuth(`${API}/api/usuarios/${userId}/permisos`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ permisos }),
  });
  document.getElementById("modal-pm")?.remove();
  avisar("Permisos guardados");
  loadUsuarios();
}

        <table>
          <tr><th style="width:70px;">Hab.</th><th>Huésped</th><th style="width:60px;">Pax</th><th>Detalle</th></tr>
          ${d.cenas_privadas_info.map(p => `<tr>

// ---------- Régimen de comidas ----------
// Quiénes comen en el lodge ese día son los mismos que aparecen en la cena: quien
// entra y quien está en casa. Los que salen no cuentan, el bote se va de madrugada.
// Así el conteo del día no necesita pedir nada más al servidor.
function enCasaHoy(d) {
  return [...d.cena.terra_kitchen, ...d.cena.bar_el_bosque];
}
function porRegimen(d, regimen) {
  return enCasaHoy(d).filter(x => (x.regimen || "SIN_DATO") === regimen);
}
function paxFullBoard(d) {
  return porRegimen(d, "PENSION_COMPLETA").reduce((s, x) => s + x.pax, 0);
}
function habsFullBoard(d) {
  return porRegimen(d, "PENSION_COMPLETA").length;
}

const ORDEN_REGIMEN = ["PENSION_COMPLETA", "DESAYUNO_CENA", "SOLO_DESAYUNO",
                       "COMEDOR_TRABAJADORES", "SIN_DATO"];
const NOMBRE_REGIMEN = {
  PENSION_COMPLETA: "Full board · comidas incluidas",
  DESAYUNO_CENA: "Solo desayuno y cena",
  SOLO_DESAYUNO: "Solo desayuno",
  COMEDOR_TRABAJADORES: "Come en el comedor de trabajadores",
  SIN_DATO: "El PDF no indicó el régimen",
};

// Las restricciones alimentarias de quien come esta noche.
//
// Se muestran POR ESTADÍA, no por la fecha de la amenidad: una alergia no es de un día.
// Si se filtrara por fecha aparecería solo el día que el huésped llega, que es justo
// cuando menos falta hace — la cocina necesita saberla cada noche que se sienta a comer.
function detalleAlergias() {
  const d = window._restData;
  const panel = document.getElementById("rest-detalle");
  const lista = d.restricciones || [];
  const quitadas = d.restricciones_quitadas || [];
  if (!lista.length) {
    // CON EL BOTÓN TAMBIÉN AQUÍ. Antes el día sin alergias era un callejón sin salida:
    // el único sitio para anotar una era esta lista, y la lista no existía. Justo
    // cuando hace más falta —alguien avisa de una alergia y no hay ninguna anotada—
    // no había dónde escribirla.
    panel.innerHTML = `<div class="detail-panel">
      <p style="margin:0;">Nadie de los que comen esta noche tiene una restricción anotada.</p>
      <p style="margin:6px 0 0;font-size:12px;color:var(--muted);">
        Llegan en el reporte del PMS. Si un huésped avisa por teléfono o al llegar,
        anótala aquí mismo.</p>
      ${puedeEscribir("restaurantes") || puedeEscribir("amenidades") ? `
        <p style="margin:10px 0 0;">
          <button class="btn btn-primary" onclick="agregarRestriccion()">+ Agregar alergia</button>
        </p>` : ""}
      ${panelQuitadas(quitadas)}
    </div>`;
    return;
  }
  // El servidor ya junta las que están escritas IGUAL en varias reservas: una familia en
  // dos habitaciones lleva la misma nota copiada en las dos, y la hoja enseñaba el mismo
  // texto dos veces como si fueran dos personas. Ver juntar_las_repetidas en
  // backend/restaurantes.py.
  const puedoEditar = puedeEscribir("restaurantes") || puedeEscribir("amenidades");

  panel.innerHTML = `<div class="detail-panel">
    <p style="margin:0 0 4px;font-weight:600;color:var(--warn-text);">
      ⚠ ${lista.length} restricción(es) entre quienes comen esta noche</p>
    <p style="margin:0 0 10px;font-size:12px;color:var(--muted);">
      Aplican toda la estadía, no solo el día que se anotaron. Revisar antes de servir.</p>
    <table>
      <tr><th>Hab.</th><th>Huésped</th><th>Restricción</th><th>Detalle</th><th>Estado</th>${puedoEditar ? "<th></th>" : ""}</tr>
      ${lista.map(x => {
        const habs = (x.habitaciones && x.habitaciones.length) ? x.habitaciones : [x.room_no];
        const nombres = (x.nombres && x.nombres.length) ? x.nombres : [x.nombre];
        const ids = (x.ids && x.ids.length) ? x.ids : [x.id];
        return `
        <tr>
          <td><strong>${habs.filter(Boolean).map(escaparHTML).join(" · ") || "—"}</strong>${etiquetaGrupo(x.conf_no)}</td>
          <td>${nombres.filter(Boolean).map(escaparHTML).join(" · ") || "—"}${x.tipo === "ENTRA" ? ' <span class="badge badge-warn" style="font-size:10px;">entra hoy</span>' : ""}
            ${x.en_cuantas_reservas > 1 ? `<br><span style="font-size:10.5px;color:var(--muted);">misma nota en ${x.en_cuantas_reservas} reservas</span>` : ""}</td>
          <td><span class="badge badge-warn">${escaparHTML(x.amenidad || "Restricción")}</span></td>
          <td style="font-size:12.5px;">${x.detalle
              ? `<strong>${escaparHTML(x.detalle)}</strong>`
              : `<span style="color:var(--muted);">sin detalle — revisar la reserva</span>`}
            ${x.editado_a_mano ? `<br><span style="font-size:10.5px;color:var(--muted);">editada a mano</span>` : ""}</td>
          <td><span class="badge ${x.estado === 'HECHA' ? 'badge-ok' : 'badge-warn'}">${x.estado === 'HECHA' ? 'AVISADA' : 'PENDIENTE'}</span></td>
          ${puedoEditar ? `<td style="white-space:nowrap;">
            <button class="btn" onclick="marcarRestriccion('${ids.join(",")}', '${x.estado === 'HECHA' ? 'PENDIENTE' : 'HECHA'}')"
              title="${x.estado === 'HECHA' ? 'Volver a marcarla como pendiente' : 'Cocina ya está enterada de esta restricción'}">
              ${x.estado === 'HECHA' ? 'Reabrir' : 'Marcar avisada'}</button>
            <button class="btn" onclick="editarRestriccion('${ids.join(",")}')"
              title="Corregir el texto de la restricción">Editar</button>
            <button class="btn" onclick="quitarRestriccion('${ids.join(",")}')"
              title="Quitarla de la hoja de cocina">Quitar</button>
          </td>` : ""}
        </tr>`; }).join("")}
    </table>
    ${puedoEditar ? `<p style="margin:10px 0 0;">
      <button class="btn btn-primary" onclick="agregarRestriccion()">+ Agregar alergia</button>
      <span style="font-size:12px;color:var(--muted);margin-left:8px;">
        Para una alergia que el huésped avisa por teléfono o al llegar.</span></p>` : ""}
    ${panelQuitadas(quitadas)}
    <p style="margin:10px 0 0;font-size:12px;color:var(--muted);">
      «Avisada» significa que cocina ya lo sabe, no que la restricción desapareció:
      sigue en pie toda la estadía y se seguirá mostrando cada noche.
      Al editarla queda marcada a mano y la siguiente sincronización ya no la pisa.</p>
  </div>`;
}

// LAS QUE ALGUIEN QUITÓ, con su botón para devolverlas.
//
// Quitar es fácil de hacer por equivocación —el lodge quitó las de un día entero
// creyendo que estaban duplicadas— y por eso no se borran: se marcan. Esto es la otra
// mitad de esa decisión; sin un sitio donde verlas, la marca no sirve de nada y la
// alergia se pierde igual que si se hubiera borrado.
function panelQuitadas(quitadas) {
  if (!quitadas || !quitadas.length) return "";
  const puedo = puedeEscribir("restaurantes") || puedeEscribir("amenidades");
  return `
    <div style="margin-top:14px;border-top:1px solid var(--linea, #d8d8d0);padding-top:10px;">
      <p style="margin:0 0 6px;font-size:12.5px;color:var(--muted);">
        <strong>${quitadas.length} restricción(es) quitada(s) a mano</strong> de quienes
        comen esta noche. No se borraron: si alguna se quitó por error, se puede devolver.</p>
      <table style="font-size:12px;">
        ${quitadas.map(x => {
          const habs = (x.habitaciones && x.habitaciones.length) ? x.habitaciones : [x.room_no];
          const ids = (x.ids && x.ids.length) ? x.ids : [x.id];
          return `<tr>
            <td style="width:70px;"><strong>${habs.filter(Boolean).map(escaparHTML).join(" · ")}</strong></td>
            <td style="color:var(--muted);">${escaparHTML(x.detalle || x.amenidad || "—")}</td>
            ${puedo ? `<td style="width:110px;">
              <button class="btn" onclick="devolverRestriccion('${ids.join(",")}')"
                title="Volver a mostrarla en la hoja de cocina">Devolver</button></td>` : ""}
          </tr>`; }).join("")}
      </table>
    </div>`;
}

async function devolverRestriccion(ids) {
  for (const id of String(ids).split(",").filter(Boolean)) {
    const res = await fetchAuth(`${API}/api/amenidades/${id}/devolver`, { method: "POST" });
    if (!res.ok) {
      avisar((await res.json().catch(() => ({}))).detail || "No se pudo devolver", true);
      return;
    }
  }
  avisar("Restricción devuelta a la hoja");
  await loadRestaurantes();
  detalleAlergias();
}

// Agregar una alergia que no venía en la reserva: la que el huésped avisa por teléfono
// o al sentarse a comer. Se anota DONDE SE LEE, que es esta hoja.
//
// Se elige la habitación de entre las que comen esta noche, no se escribe a mano: una
// alergia anotada en el cuarto equivocado es peor que no anotarla, porque además hace
// que cocina se confíe.
async function agregarRestriccion() {
  const d = window._restData;
  const comen = [];
  for (const comida of [d.cena, d.almuerzo]) {
    for (const bloque of [(comida || {}).terra_kitchen, (comida || {}).bar_el_bosque]) {
      for (const x of (bloque || [])) {
        if (x.conf_no && !comen.some(y => y.conf_no === x.conf_no)) comen.push(x);
      }
    }
  }
  comen.sort((a, b) => (parseInt(a.room_no) || 999) - (parseInt(b.room_no) || 999));
  if (!comen.length) {
    avisar("No hay nadie comiendo esta noche a quien anotarle una alergia", true);
    return;
  }
  const cual = prompt(
    "¿De qué habitación?\n\n" +
    comen.map(x => `${x.room_no} · ${(x.nombre || "").split(",")[0]}`).join("\n"),
    comen[0].room_no);
  if (cual === null) return;
  const quien = comen.find(x => String(x.room_no) === String(cual).trim());
  if (!quien) { avisar(`La habitación ${cual} no come esta noche`, true); return; }

  const texto = prompt(`Alergia o restricción de la hab. ${quien.room_no}:`, "");
  if (texto === null) return;
  if (!texto.trim()) { avisar("Hace falta escribir de qué es", true); return; }

  const res = await fetchAuth(`${API}/api/amenidades`, {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({
      conf_no: quien.conf_no,
      amenidad: "Restricción alimentaria / alergia",
      detalle: texto.trim(),
      tarea: "AVISAR A COCINA",
      areas: ["Cocina"],
    }),
  });
  if (!res.ok) {
    avisar((await res.json().catch(() => ({}))).detail || "No se pudo agregar", true);
    return;
  }
  avisar(`Alergia anotada en la hab. ${quien.room_no}`);
  await loadRestaurantes();
  detalleAlergias();
}

// Corregir el texto de una restricción desde la hoja de cocina, que es donde se lee y
// donde se nota que está mal. Antes había que irse a Amenidades a buscarla.
//
// Si la nota está copiada en varias reservas se corrigen TODAS: es el mismo texto, y
// dejar una vieja volvería a enseñar dos versiones de la misma alergia.
async function editarRestriccion(ids) {
  const lista = String(ids).split(",").filter(Boolean);
  const actual = (window._restData.restricciones || [])
    .find(x => (x.ids || [x.id]).map(String).join(",") === String(ids));
  const texto = prompt(
    lista.length > 1
      ? `Corregir la restricción. Está escrita igual en ${lista.length} reservas y se corrige en todas.`
      : "Corregir la restricción:",
    (actual && actual.detalle) || "");
  if (texto === null) return;                      // canceló
  if (!texto.trim()) {
    avisar("El texto no puede quedar vacío. Si ya no aplica, usa «Quitar».", true);
    return;
  }
  for (const id of lista) {
    const res = await fetchAuth(`${API}/api/amenidades/${id}/texto`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ detalle: texto.trim() }),
    });
    if (!res.ok) {
      avisar((await res.json().catch(() => ({}))).detail || "No se pudo guardar", true);
      return;
    }
  }
  avisar(lista.length > 1 ? `Corregida en ${lista.length} reservas` : "Restricción corregida");
  await loadRestaurantes();
  detalleAlergias();
}

async function quitarRestriccion(ids) {
  const lista = String(ids).split(",").filter(Boolean);
  if (!confirm(lista.length > 1
      ? `Quitar esta restricción de ${lista.length} reservas. ¿Seguro?`
      : "Quitar esta restricción. ¿Seguro?")) return;
  for (const id of lista) {
    const res = await fetchAuth(`${API}/api/amenidades/${id}`, { method: "DELETE" });
    if (!res.ok) {
      avisar((await res.json().catch(() => ({}))).detail || "No se pudo quitar", true);
      return;
    }
  }
  avisar("Restricción quitada");
  await loadRestaurantes();
  detalleAlergias();
}

// Recibe uno o varios ids separados por coma: una nota copiada en dos reservas es UNA
// restricción en la hoja, y marcarla avisada tiene que marcarlas todas. Si solo se
// marcara la primera, la línea seguiría en rojo y parecería que no se guardó.
async function marcarRestriccion(ids, estado) {
  for (const id of String(ids).split(",").filter(Boolean)) {
    const res = await fetchAuth(`${API}/api/restaurantes/restriccion/${id}/estado`, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ estado }),
    });
    if (!res.ok) { avisar((await res.json()).detail, true); return; }
  }
  avisar(estado === "HECHA" ? "Cocina avisada" : "Marcada como pendiente otra vez");
  // Se recarga la pantalla y se vuelve a abrir el tab, para no perder de vista la lista
  // que la persona estaba revisando.
  await loadRestaurantes();
  detalleAlergias();
}

// Lo que la reserva trae pagado ADEMÁS de las comidas: qué bebidas incluye y si es de
// cortesía. Se decide en el mismo momento que el régimen, con el plato en la mano, así
// que se muestra al lado y no en otra pantalla.
//
// Van SOLO las dos etiquetas. El texto de Opera del que salieron se imprimía debajo, y
// en la hoja del día es ruido: trae el paquete entero, el tour, la vía de entrada y el
// descuento del spa, que no se miran aquí. El texto no se pierde —queda en el title,
// asomando el mouse encima de la etiqueta— para cuando haya que leer QUÉ es la cortesía
// («CPL en hospedaje» y «CPL boat transfer» no son lo mismo).
function notasReserva(x) {
  const marcas = [];
  if (x.bebidas) {
    marcas.push(`<span class="badge badge-ok" title="${escaparHTML(x.bebidas)}">bebidas incluidas</span>`);
  }
  if (x.cortesia) {
    marcas.push(`<span class="badge" style="background:#EADCF7;color:#4A2A72;font-weight:600;"
                  title="${escaparHTML(x.cortesia)}">cortesía (CPL)</span>`);
  }
  if (!marcas.length) return "";
  return `<br>${marcas.join(" ")}`;
}

function detalleRegimen() {
  const d = window._restData;
  const panel = document.getElementById("rest-detalle");
  const F = FILTROS.restaurantes;
  const grupos = ORDEN_REGIMEN
    .map(r => [r, porRegimen(d, r)])
    .filter(([, lista]) => lista.length);

  panel.innerHTML = `<div class="detail-panel">
    <p style="font-weight:600;margin:0 0 4px;">Régimen de comidas · ${F.fecha}</p>
    <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">
      Habitaciones que comen en el lodge ese día: quien entra y quien está en casa.</p>
    ${grupos.map(([regimen, lista]) => `
      <p style="margin:10px 0 4px;font-weight:600;font-size:13px;">
        ${NOMBRE_REGIMEN[regimen]}
        <span style="font-weight:400;color:var(--muted);">— ${lista.length} hab.,
          ${lista.reduce((s, x) => s + x.pax, 0)} pax</span></p>
      <table>
        <tr><th>Hab.</th><th>Huésped</th><th>Pax</th><th>Además de las comidas</th><th></th></tr>
        ${lista.map(x => `<tr class="${x.tipo === 'ENTRA' ? 'fila-entra' : ''}">
          <td><strong>${x.room_no || '—'}</strong>${etiquetaGrupo(x.conf_no)}</td>
          <td>${x.nombre}</td>
          <td>${x.pax}</td>
          <!-- Aquí es donde se mira el régimen, así que aquí van también las bebidas
               incluidas y la cortesía: son lo mismo —qué trae pagado la reserva— y
               tenerlas en dos pantallas distintas obliga a cruzarlas de memoria. -->
          <td>${notasReserva(x) || '<span style="font-size:11px;color:var(--muted);">—</span>'}</td>
          <td>${x.tipo === 'ENTRA' ? '<span class="badge badge-warn">entra</span>' : ''}</td>
        </tr>`).join("")}
      </table>`).join("")}

    <div class="filterbar" style="margin-top:16px;border-top:1px solid var(--border);padding-top:12px;">
      <span style="font-size:12.5px;color:var(--muted);">Ver por rango:</span>
      <input type="date" id="rg-desde" value="${F.fecha}">
      <input type="date" id="rg-hasta" value="${masDiasISO(7)}">
      <button class="btn" onclick="verRegimenRango()">Ver rango</button>
    </div>
    <div id="rg-rango"></div>
  </div>`;
}

async function verRegimenRango() {
  const desde = document.getElementById("rg-desde").value;
  const hasta = document.getElementById("rg-hasta").value;
  const caja = document.getElementById("rg-rango");
  caja.innerHTML = `<p class="empty" style="padding:12px;">Contando…</p>`;
  const d = await (await fetchAuth(`${API}/api/restaurantes/regimen?desde=${desde}&hasta=${hasta}`)).json();
  const cols = ORDEN_REGIMEN.filter(r => d.totales[r]);
  caja.innerHTML = `
    <p style="font-weight:600;font-size:13px;margin:14px 0 4px;">Del ${d.desde} al ${d.hasta}</p>
    <p style="font-size:11.5px;color:var(--muted);margin:0 0 8px;">
      Cada día cuenta aparte: quien se queda tres noches suma tres veces, que es lo que
      importa para el servicio.${d.recortado ? " El rango se recortó a 92 días." : ""}</p>
    <table>
      <tr><th>Fecha</th>${cols.map(r => `<th>${NOMBRE_REGIMEN[r].split(" · ")[0]}</th>`).join("")}</tr>
      ${d.dias.map(dia => `<tr>

    document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
    return;
  }
  window._restAbierto = cual;
  document.querySelectorAll("#app .stat").forEach(s => s.classList.remove("selected"));
  if (event && event.currentTarget) event.currentTarget.classList.add("selected");

  // El régimen no es un restaurante: se agrupa por lo que trae pagado el huésped.
  if (cual === "regimen") { detalleRegimen(); return; }

      ${sinComida.map(x => `hab. ${x.room_no || "—"} (${x.regimen_texto})`).join(" · ")}.
      Se les cobra aparte.</div>` : ""}
    ${lista.some(x => x.grupo) && puedeEscribir("restaurantes") ? `

      <label style="display:flex;align-items:center;gap:6px;font-size:12px;margin:0 0 9px;cursor:pointer;">
        <input type="checkbox" id="mover-todo-el-grupo" checked>

        ${esCena ? "<th>Hora reservada</th>" : ""}${puedeEscribir("restaurantes") ? "<th></th>" : ""}</tr>
      ${lista.map(x => `<tr class="${x.tipo === 'ENTRA' ? 'fila-entra' : ''}">
        <td><strong>${x.room_no || '—'}</strong>${etiquetaGrupo(x.conf_no)}</td>

    ${lista.some(x => x.grupo) ? '<p style="font-size:11px;color:var(--muted);margin-top:4px;">Lo mismo al cambiar de restaurante: el grupo se mueve entero. No se llevan las habitaciones que ya estén puestas a mano en otro restaurante ni las que tengan cena privada — el cartel las nombra.</p>' : ""}
  </div>`;
